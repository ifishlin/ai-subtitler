<meta charset="utf-8">
<style>
  :root {
    --paper:  #091e30;   /* 卡片底色 */
    --edge:   #40bee6;   /* 外框、重點 */
    --title:  #ffeea5;   /* 標題 */
    --ink:    #ffffff;   /* 內文 */
    --muted:  #9fc4d8;   /* 次要文字 */
    --warn:   #ff9d5c;   /* 強調、負面 */
    --ok:     #7fd4a8;   /* 正面 */
    --radius: 34px;      /* 圓角 */
  }
  /* Transparent page: the capture keeps only the card, so it drops onto the
     canvas the way a cut-out icon does. */
  html, body { margin: 0; background: transparent; }
  #card {
    width: 620px;
    box-sizing: border-box;
    padding: 26px 30px 30px;
    border-radius: var(--radius);
    background: rgba(9, 30, 48, 0.92);
    border: 4px solid var(--edge);
    font-family: "PingFang TC", "Heiti TC", sans-serif;
    color: var(--ink);
  }
  .badge {
    display: inline-block;
    background: color-mix(in srgb, var(--edge) 70%, #000);
    border-radius: 18px;
    padding: 7px 18px;
    font-size: 22px;
    letter-spacing: .06em;
  }
  h1 {
    margin: 20px 0 4px;
    font-size: 42px;
    font-weight: 600;
    color: var(--title);              /* the same yellow the info cards title in */
  }
  .note { margin: 0 0 20px; font-size: 19px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 6px; }
  thead th {
    font-size: 19px; font-weight: 500; color: var(--muted);
    border-bottom: 2px solid color-mix(in srgb, var(--edge) 45%, var(--paper));
  }
  thead th:last-child, td:last-child { text-align: right; }
  tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--edge) 28%, var(--paper)); }
  td.label { font-size: 27px; }
  td.figure {
    font-size: 40px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .lost { color: var(--warn); }      /* what was not saved reads as the warning */
  .kept { color: var(--ok); }
  .unit { font-size: 21px; font-weight: 400; color: var(--muted); margin-left: 6px; }
</style>

<div id="card">
  <span class="badge">新聞重點</span>
  <h1>疫苗錯誤資訊的代價</h1>
  <p class="note">受訪者引用的研究說法</p>
  <table>
    <thead>
      <tr><th>情境</th><th>美國人命</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="label">原本可救回</td>
        <td class="figure lost">10–20<span class="unit">萬</span></td>
      </tr>
      <tr>
        <td class="label">實際未接種而死亡</td>
        <td class="figure kept">未提出數字</td>
      </tr>
    </tbody>
  </table>
</div>
