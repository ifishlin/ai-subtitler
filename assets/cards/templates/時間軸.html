<meta charset="utf-8">
<style>
  :root {
    --paper:  #091e30;   /* 卡片底色 */
    --edge:   #40bee6;   /* 外框、重點 */
    --title:  #ffeea5;   /* 標題 */
    --ink:    #ffffff;   /* 內文 */
    --muted:  #9fc4d8;   /* 次要文字 */
    --warn:   #ff9d5c;   /* 強調、負面 */
    --ok:     #7fd4a8;   /* 正面 */
    --radius: 34px;      /* 圓角 */
  }
  html, body { margin: 0; background: transparent; }
  #card {
    width: 620px; box-sizing: border-box; padding: 26px 30px 22px;
    border-radius: var(--radius); background: color-mix(in srgb, var(--paper) 92%, transparent); border: 4px solid var(--edge);
    font-family: "PingFang TC", "Heiti TC", sans-serif; color: var(--ink);
  }
  .badge { display: inline-block; background: color-mix(in srgb, var(--edge) 70%, #000); border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  h1 { margin: 20px 0 20px; font-size: 40px; font-weight: 600; color: var(--title); }
  ol { margin: 0; padding: 0 0 0 30px; list-style: none;
       border-left: 3px solid color-mix(in srgb, var(--edge) 45%, var(--paper)); }
  li { position: relative; padding: 0 0 24px 22px; }
  li:last-child { padding-bottom: 4px; }
  /* The dot sits on the line, so the line is the left border of the list. */
  li::before { content: ""; position: absolute; left: -32px; top: 8px;
               width: 15px; height: 15px; border-radius: 50%;
               background: var(--edge); box-shadow: 0 0 0 4px color-mix(in srgb, var(--paper) 92%, transparent); }
  li .when { font-size: 21px; color: var(--title); font-variant-numeric: tabular-nums; }
  li .what { font-size: 27px; line-height: 1.4; margin-top: 3px; }
</style>

<div id="card">
  <span class="badge">事件經過</span>
  <h1>標題寫在這裡</h1>
  <ol>
    <li><div class="when">2020 年 3 月</div><div class="what">第一件事</div></li>
    <li><div class="when">2021 年</div><div class="what">第二件事</div></li>
    <li><div class="when">現在</div><div class="what">第三件事</div></li>
  </ol>
</div>
