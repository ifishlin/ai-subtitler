<meta charset="utf-8">
<style>
  :root {
    --paper:  #091e30;   /* 卡片底色 */
    --edge:   #40bee6;   /* 外框、重點 */
    --title:  #ffeea5;   /* 標題 */
    --ink:    #ffffff;   /* 內文 */
    --muted:  #9fc4d8;   /* 次要文字 */
    --warn:   #ff9d5c;   /* 強調、負面 */
    --ok:     #7fd4a8;   /* 正面 */
    --radius: 34px;      /* 圓角 */
  }
  html, body { margin: 0; background: transparent; }
  #card {
    width: 680px; box-sizing: border-box; padding: 26px 30px 30px;
    border-radius: var(--radius); background: color-mix(in srgb, var(--paper) 92%, transparent); border: 4px solid var(--edge);
    font-family: "PingFang TC", "Heiti TC", sans-serif; color: var(--ink);
  }
  .badge { display: inline-block; background: color-mix(in srgb, var(--edge) 70%, #000); border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  h1 { margin: 20px 0 22px; font-size: 40px; font-weight: 600; color: var(--title); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px;
          align-items: stretch; }
  .side { background: color-mix(in srgb, var(--edge) 14%, var(--paper)); border-radius: 20px; padding: 20px 22px; }
  .side .who { font-size: 21px; color: var(--muted); margin-bottom: 10px; }
  .side .say { font-size: 27px; line-height: 1.45; }
  .side.claim { border-left: 6px solid var(--warn); }
  .side.fact  { border-left: 6px solid var(--ok); }
  .versus { align-self: center; font-size: 26px; color: var(--muted); }
</style>

<div id="card">
  <span class="badge">新聞重點</span>
  <h1>說法與事實</h1>
  <div class="pair">
    <div class="side claim">
      <div class="who">他說</div>
      <div class="say">左邊放其中一方的說法</div>
    </div>
    <div class="versus">vs</div>
    <div class="side fact">
      <div class="who">事實</div>
      <div class="say">右邊放另一方或查證結果</div>
    </div>
  </div>
</div>
