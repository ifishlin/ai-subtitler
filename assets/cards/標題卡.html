<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #card {
    width: 620px; box-sizing: border-box; padding: 30px 34px 34px;
    border-radius: 34px; background: rgba(9, 30, 48, .92); border: 4px solid #40bee6;
    font-family: "PingFang TC", "Heiti TC", sans-serif; color: #fff;
  }
  .badge { display: inline-block; background: #1196be; border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  h1 { margin: 22px 0 18px; font-size: 46px; font-weight: 600; color: #ffeea5; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { font-size: 30px; line-height: 1.55; padding-left: 26px; position: relative; }
  li::before { content: "・"; position: absolute; left: 0; color: #40bee6; }
</style>

<div id="card">
  <span class="badge">我要換卡</span>
  <h1>標題寫在這裡</h1>
  <ul>
    <li>第一個要點</li>
    <li>第二個要點</li>
  </ul>
</div>
