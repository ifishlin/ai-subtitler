<!doctype html>
<meta charset="utf-8">
<title>新影片　AI-Desk</title>
<style>
  :root{
    --bg:#0b0e12; --panel:#141a21; --panel2:#1b232c; --line:#26313d;
    --ink:#e6edf3; --dim:#9fb0c0; --faint:#6b7c8c;
    --accent:#5aa9ff; --ok:#4ec98b; --warn:#f5b544; --danger:#ef6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:6px 14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:#0b1017;border-color:transparent;
    font-weight:600}
  button.tiny{padding:3px 9px;font-size:12px}
  input{background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);padding:8px 11px;font:13px var(--mono);width:100%}
  input:focus{outline:none;border-color:var(--accent)}

  header{display:flex;align-items:center;gap:12px;padding:12px 20px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;letter-spacing:.02em}
  header .where{color:var(--faint);font-size:12px}

  main{max-width:820px;margin:0 auto;padding:26px 20px 60px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:16px}
  h2{margin:0 0 14px;font-size:13px;color:var(--dim);font-weight:600}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field .say{font-size:11px;color:var(--faint);margin-top:5px}
  .row{display:flex;gap:10px;align-items:center}
  .row .grow{flex:1}

  /* ---- progress ---- */
  #run{display:none}
  #run.on{display:block}
  .bar{height:7px;background:var(--bg);border:1px solid var(--line);
    border-radius:99px;overflow:hidden;margin:12px 0 10px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;
    transition:width .4s ease}
  .bar.bad i{background:var(--danger)}
  .bar.good i{background:var(--ok)}
  .now{display:flex;align-items:baseline;gap:10px}
  .now b{font-size:15px}
  .now .clock{margin-left:auto;font:12px var(--mono);color:var(--faint)}
  ol.steps{list-style:none;margin:14px 0 0;padding:0;font-size:12px}
  ol.steps li{display:flex;gap:9px;padding:3px 0;color:var(--faint)}
  ol.steps li .no{font:11px var(--mono);min-width:2.4em}
  ol.steps li.done{color:var(--dim)}
  ol.steps li.done .no::after{content:"　✓";color:var(--ok)}
  ol.steps li.here{color:var(--ink)}
  ol.steps li.here .no::after{content:"　…";color:var(--accent)}
  #log{margin-top:14px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font:11px/1.6 var(--mono);
    color:var(--faint);max-height:190px;overflow:auto;white-space:pre-wrap}
  #note{font-size:13px;margin-top:12px}
  #note.bad{color:var(--danger)}
  #note.good{color:var(--ok)}
  #note.warn{color:var(--warn)}

  /* ---- which sites ---- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chips span{font-size:11px;color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  #siteFind{width:14em;font-size:12px;padding:5px 9px}
  #siteHits{font-size:12px;color:var(--dim);margin-top:9px;min-height:1.4em}
  #siteHits b{color:var(--ok)}
  #siteHits .none{color:var(--warn)}
</style>

<header>
  <h1>新影片</h1>
  <span class="where">一個網址，一支做好的影片</span>
</header>

<main>
  <section>
    <div class="field">
      <label for="source">影片</label>
      <input id="source" placeholder="https://www.youtube.com/watch?v=…　或一個本機檔案路徑"
             spellcheck="false" autocomplete="off">
      <div class="say">貼網頁的網址，或直接給硬碟上的影片檔路徑。</div>
    </div>
    <div class="field">
      <label for="name">取名</label>
      <div class="row">
        <input id="name" class="grow" placeholder="例如 rfk-interview" spellcheck="false">
        <button id="go" class="primary">開始</button>
      </div>
      <div class="say">會變成 <code>projects/</code> 底下的一個資料夾。</div>
    </div>
    <div id="note"></div>
  </section>

  <section id="run">
    <div class="now">
      <b id="what">準備中</b>
      <span id="stepNo" style="color:var(--faint);font:12px var(--mono)"></span>
      <span class="clock" id="clock">0:00</span>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <ol class="steps" id="steps"></ol>
    <div id="log"></div>
    <div class="row" style="margin-top:14px">
      <span class="grow"></span>
      <button id="stop" class="tiny">停止</button>
    </div>
  </section>

  <section>
    <h2>可以用哪些網站</h2>
    <p style="margin:0;color:var(--dim);font-size:13px">
      下載交給 yt-dlp，所以它認得的網站都可以，
      共 <b id="siteTotal">…</b> 個。常見的有：
    </p>
    <div class="chips">
      <span>YouTube</span><span>Vimeo</span><span>X / Twitter</span>
      <span>Facebook</span><span>Instagram</span><span>TikTok</span>
      <span>Twitch</span><span>Bilibili</span><span>BBC</span>
      <span>CNN</span><span>NYTimes</span><span>Reddit</span>
    </div>
    <div class="row">
      <input id="siteFind" placeholder="查一個網站…" spellcheck="false">
    </div>
    <div id="siteHits"></div>
    <p style="margin:12px 0 0;color:var(--faint);font-size:12px">
      要登入、付費或有地區限制的影片會下載失敗——那是拿不到，不是不支援。
      本機檔案不經過這一步。
    </p>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const escapeHTML = (text) => String(text).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* The eight steps produce.py announces. Naming them here rather than waiting
   to be told means the list is complete from the first second -- you can see
   what is coming, not only what is happening. */
const STEPS = [
  "準備影片", "辨識", "連 LLM", "校正",
  "檢查與自動修補", "審查成品", "規劃圖卡", "燒錄",
];

function clock(seconds) {
  const whole = Math.max(0, Math.round(seconds || 0));
  return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, "0")}`;
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `${method} ${path} 失敗`);
  return data;
}

function renderSteps(at) {
  $("steps").innerHTML = STEPS.map((label, index) => {
    const step = index + 1;
    const where = step < at ? "done" : step === at ? "here" : "";
    return `<li class="${where}"><span class="no">${step}/8</span>${label}</li>`;
  }).join("");
}

function paint(state) {
  $("run").classList.add("on");
  $("what").textContent = state.what || STEPS[Math.max(0, state.step - 1)] || "準備中";
  $("stepNo").textContent = state.step ? `${state.step}/${state.steps}` : "";
  $("clock").textContent = clock(state.seconds);
  const bar = document.querySelector(".bar");
  bar.classList.toggle("bad", state.state === "error");
  bar.classList.toggle("good", state.state === "done");
  $("fill").style.width = `${(state.step / (state.steps || 8)) * 100}%`;
  renderSteps(state.state === "done" ? 99 : state.step);
  $("log").textContent = (state.log || []).join("\n");
  $("log").scrollTop = $("log").scrollHeight;
  $("stop").disabled = state.state !== "running";
}

let watching = null;

function watch() {
  if (watching) return;
  watching = setInterval(async () => {
    let state;
    try { state = await api("GET", "/api/produce"); } catch (error) { return; }
    paint(state);
    if (state.state === "running") return;
    clearInterval(watching);
    watching = null;
    $("go").disabled = false;
    // Finishing and finishing properly are different things.
    if (state.warning) {
      $("note").className = "warn";
      $("note").textContent = `${state.message}　但是：${state.warning}`;
    } else {
      $("note").className = state.state === "error" ? "bad" : "good";
      $("note").textContent = state.message
        || (state.state === "done" ? "完成" : "");
    }
  }, 1000);
}

$("go").onclick = async () => {
  $("note").className = "";
  $("note").textContent = "";
  try {
    const state = await api("POST", "/api/produce", {
      source: $("source").value.trim(),
      name: $("name").value.trim(),
    });
    $("go").disabled = true;
    paint({ ...state, seconds: 0 });
    watch();
  } catch (error) {
    $("note").className = "bad";
    $("note").textContent = error.message;
  }
};

$("stop").onclick = async () => {
  if (!confirm("停止這次製作？已經下載和辨識的東西會留著。")) return;
  try { await api("POST", "/api/produce/stop"); } catch (error) { /* gone already */ }
};

// Enter in either field starts it, which is what anyone tries first.
for (const id of ["source", "name"]) {
  $(id).addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !$("go").disabled) $("go").click();
  });
}

/* ---- which sites ---- */
let asking = null;
$("siteFind").addEventListener("input", (event) => {
  clearTimeout(asking);
  const wanted = event.target.value.trim();
  if (!wanted) { $("siteHits").textContent = ""; return; }
  asking = setTimeout(async () => {
    try {
      const found = await api("GET", `/api/sites?q=${encodeURIComponent(wanted)}`);
      $("siteHits").innerHTML = found.matches.length
        ? `<b>可以</b>　${found.matches.map(escapeHTML).join("、")}`
          + (found.more ? `　…還有 ${found.more} 個` : "")
        : `<span class="none">清單裡沒有「${escapeHTML(wanted)}」</span>`
          + `　不過網址還是可以試，yt-dlp 對一般網頁有通用的抓法。`;
    } catch (error) { $("siteHits").textContent = error.message; }
  }, 250);
});

(async function boot() {
  renderSteps(0);
  try {
    const found = await api("GET", "/api/sites");
    $("siteTotal").textContent = found.total;
  } catch (error) { $("siteTotal").textContent = "很多"; }
  try {
    const state = await api("GET", "/api/produce");
    if (state.state !== "idle") {
      paint(state);
      if (state.state === "running") { $("go").disabled = true; watch(); }
    }
  } catch (error) { /* nothing running */ }
})();
</script>
