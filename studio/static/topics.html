<!doctype html>
<meta charset="utf-8">
<title>題目與文案　AI-Desk</title>
<link rel="stylesheet" href="/static/ask.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    display:flex;flex-direction:column;height:100vh}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:#0b1017;border-color:transparent;
    font-weight:600}
  button.tiny{padding:3px 9px;font-size:12px}
  input{background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);padding:6px 10px;font-size:13px}
  a{color:var(--accent)}

  header{display:flex;align-items:center;gap:12px;padding:11px 18px;flex:none;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px}
  header .where{color:var(--faint);font-size:12px}
  header .grow{flex:1}

  main{flex:1;display:flex;min-height:0}
  #list{width:300px;flex:none;overflow:auto;padding:12px;
    border-right:1px solid var(--line)}
  #paper{flex:1;overflow:auto;padding:20px 26px 60px}

  .item{padding:10px;margin-bottom:6px;border-radius:8px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line)}
  .item:hover{border-color:var(--accent)}
  .item.on{border-color:var(--accent);background:var(--panel2)}
  .item b{display:block;font-weight:600}
  .item .facts{font:11px var(--mono);color:var(--faint);margin-top:4px;display:block}
  .item .bad{color:var(--warn)}
  .item b .films{float:right;font:11px var(--mono);color:var(--faint);
    font-weight:400}

  /* 題目的名字。這一頁最該一眼認出的東西，跟短影音那邊同一個道理。 */
  h2{margin:0 0 12px;font-size:24px;letter-spacing:.5px}

  /* 還沒處理的事，一區三列。本來是兩個黃框加一列並排 —— 三條橫幅讀起來像
     三個警報，而它們是同一種東西：等你決定的。
     只有真正等你動手的那兩列是黃的；「產生文案」是交接不是警告，所以不是。 */
  .todo{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin:0 0 14px;overflow:hidden}
  .todo .row{display:grid;gap:4px 12px;padding:11px 15px;
    grid-template-columns:1fr auto auto;align-items:center;
    border-bottom:1px solid var(--line)}
  .todo .row:last-child{border-bottom:none}
  .todo .doubt,.todo .want{background:#241f12}
  .todo .what{min-width:0}
  .todo .what b{display:block;font-size:13px;color:#e2a33c}
  .todo .write .what b{color:var(--ink)}
  .todo .what span{display:block;font-size:11px;color:var(--faint);
    line-height:1.55;margin-top:2px}
  /* 公版的說明只留一行，全文在 title。它是三四句話，整段攤開會把這一列撐成
     一個段落，而它要回答的問題只在選公版的那一刻問一次。 */
  .todo .write .what span{overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .todo .rows{grid-column:1 / -1;margin-top:6px;display:flex;
    flex-direction:column;gap:3px}
  .todo .rows.terms{flex-direction:row;flex-wrap:wrap;gap:6px}
  .todo .rows code{font:11px var(--mono);color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:5px;padding:1px 7px}
  .doubt-row{display:flex;align-items:center;gap:9px;font-size:12px;min-width:0}
  .doubt-row .who{color:var(--faint);font:11px var(--mono);flex:none;
    width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doubt-row .txt{color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .todo select{font:13px inherit;color:var(--ink);background:#0b1017;
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;
    cursor:pointer}
  .todo select:hover{border-color:var(--accent)}

  /* ---- what has been gathered ---- */
  /* A pile to choose from, so it is browsed rather than read: small, dense,
     and every one says which search found it. */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:8px}
  .shelf figure{margin:0;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .shelf img{width:100%;height:88px;object-fit:cover;display:block;
    background:#0d1014}
  .shelf figcaption{font:10px var(--mono);padding:3px 6px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* What we asked for, and what actually came back. Side by side because the
     mistake is invisible any other way: the search said `electricity bill`,
     the picture's own caption said `fuse box`, and only the first was ever
     shown. */
  .shelf figcaption.asked{color:#7fd4ff;padding-top:5px}
  .shelf figcaption.got{color:var(--faint);white-space:normal;line-height:1.35;
    max-height:2.7em;border-top:1px solid var(--line);padding-top:4px}
  .shelf figcaption.who{color:#9a8; font-size:9px}
  /* A shot at the size it will be seen. The row thumbnails are 82px tall
     and a card's own type is 76px on a 1920 frame -- legible in the finished
     video, illegible in the list -- so the list is for finding a shot and
     this is for judging it. */
  /* Which of 起承轉合 this line claims to be. Shown because it is a claim the
     writer made and the program checks, not decoration. */
  td.at select.role{display:block;margin-top:4px;font:11px var(--mono);
    color:#7fd4ff;background:#0d1014;border:1px solid var(--line);
    border-radius:5px;padding:2px 4px;cursor:pointer}
  td.at select.role:hover{border-color:var(--accent)}
  #big{position:fixed;inset:0;background:#000d;z-index:60;display:flex;
    align-items:center;justify-content:center;padding:24px}
  /* `display:flex` on the element itself outranks the browser's own
     `[hidden]{display:none}`, so the overlay came up on load and covered the
     page -- a black sheet with one 關閉 button on it. The attribute has to be
     given back its authority explicitly. */
  #big[hidden]{display:none}
  .big-inner{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px 14px;max-width:min(94vw,760px);
    max-height:94vh;display:flex;flex-direction:column;gap:10px}
  .big-bar{display:flex;align-items:baseline;gap:10px}
  .big-bar b{font-size:13px}
  .big-bar span{font:11px var(--mono);color:var(--faint)}
  /* Worded like every other panel's, because a ✕ is a symbol you have to
     know and 關閉 is a word you can read. */
  .big-bar button{margin-left:auto}
  #bigStage{display:flex;align-items:center;justify-content:center;
    min-height:0;overflow:auto}
  #bigStage img,#bigStage video{max-width:100%;max-height:74vh;
    border-radius:8px;display:block;background:#0d1014}
  #bigNote{font:11px var(--mono);color:var(--faint);line-height:1.6}
  #bigNote em{font-style:normal;color:#7fd4ff}
  /* Unsaved edits are visible and countable. Saving on every keystroke meant
     there was no such state, so nothing could be discarded and nothing had to
     be confirmed. */
  /* The house styles, edited as what they are: data. Every field was a
     constant somewhere, and `why` is the field that matters -- a number with
     no reason attached gets changed by whoever finds it inconvenient. */
  #houses{position:fixed;inset:0;background:#000d;z-index:70;display:flex;
    align-items:flex-start;justify-content:center;padding:32px 24px;overflow:auto}
  #houses[hidden]{display:none}
  .houses-inner{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px 16px;width:min(96vw,880px)}
  .houses-bar{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .houses-bar b{font-size:14px}
  .houses-bar .hint{font-size:11px;color:var(--faint);flex:1;line-height:1.5}
  .houses-new{display:flex;gap:8px;align-items:center;margin-top:6px;
    padding-top:11px;border-top:1px solid var(--line)}


  /* Which shape a script is, on its card. Not only inside the script view:
     it decides what every other number on that card means -- 38% borrowed is
     over the ceiling for an argument and comfortable for a story. */
  .src.written{position:relative}
  .src.written .drop-script{position:absolute;right:10px;top:9px;opacity:0;
    color:var(--faint)}
  .src.written:hover .drop-script{opacity:1}
  .src.written .drop-script:hover{color:#ff8a72;border-color:#5b2a22}
  .src.written .house{display:inline-block;margin-left:8px;padding:1px 8px;
    border-radius:99px;font:11px var(--mono)}
  .src.written .house.argue{background:#12212e;color:#7fd4ff;
    border:1px solid #244055}
  .src.written .house.story{background:#2a1a12;color:#ffb347;
    border:1px solid #5c3325}

  /* Two decisions about the whole film, made once and never revisited until
     they were put here: which shape it is, and who it is for. */

  #pending[hidden]{display:none}
  #jobBar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    align-items:center;gap:12px;padding:9px 18px;background:var(--panel);
    border-top:1px solid var(--line)}
  #jobBar[hidden]{display:none}
  #jobBar b{font-size:13px;flex:none}
  #jobNote{font:12px var(--mono);color:var(--faint);flex:none;
    max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .job-track{flex:1;height:6px;border-radius:3px;background:#0d1014;
    overflow:hidden}
  .job-track i{display:block;height:100%;background:var(--accent);
    transition:width .3s}
  #jobClock{font:12px var(--mono);color:var(--faint);flex:none}
  #jobBar.failed{background:#2a1512;border-top-color:#5b2a22}
  #jobBar.failed .job-track i{background:#ef6b6b}


  /* A rule between piles, so one section ends visibly before the next
     begins. Everything stays open: a pile you have to unfold is a pile you
     forget is there. */
  .pile{border-top:1px solid var(--line);margin-top:16px;
    scroll-margin-top:12px}
  .pile:first-of-type{border-top:none}
  .pile h3{display:flex;align-items:baseline;gap:9px;margin:14px 0 8px}
  .pile h3 .hint{font-size:11px;color:var(--faint);font-weight:400}

  .jump{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;
    position:sticky;top:0;z-index:20;padding:8px 0;background:var(--bg)}
  .jump button{color:var(--faint)}
  .jump button b{color:var(--ink);margin-left:3px}
  .jump button.lacking b{color:var(--warn)}

  /* 理由和受眾，一塊兩行。標籤在上、欄位在下，因為兩者的長度差很多 ——
     並排會讓短的那個看起來是附註。 */
  .decide{display:grid;gap:9px;padding:12px 15px;margin-bottom:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    grid-template-columns:1fr 1fr;align-items:end}
  .decide label{display:block;font-size:11px;color:var(--faint);
    letter-spacing:.4px}
  .decide input{display:block;width:100%;margin-top:4px;font:14px inherit;
    color:var(--ink);background:#0b1017;border:1px solid var(--line);
    border-radius:7px;padding:6px 9px}
  .decide input:hover{border-color:#244055}
  .decide input:focus{border-color:var(--accent);outline:none}
  .decide input::placeholder{color:var(--faint);font-size:13px}
  .decide > button{grid-column:1 / -1;justify-self:start}
  @media (max-width:900px){ .decide{grid-template-columns:1fr} }


  /* 狀態和動作，一塊。這一頁只有兩個真正的動作，而它們互斥 —— 素材不夠就
     收集，夠了就寫。所以由 pile.ready 決定哪一顆是 primary，另一顆退成
     tiny：兩顆一樣顯眼，等於沒有指出現在該做什麼。 */
  .doing{border-radius:10px;margin:0 0 14px;overflow:hidden;
    border:1px solid var(--line);background:var(--panel)}
  .doing.ok{border-color:#2c5a45}
  .doing.no{border-color:#5c4a2a}
  .doing .verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px 15px;font-size:13px}
  .doing.ok .verdict{background:#12291f;color:var(--ok)}
  .doing.no .verdict{background:#241a14;color:var(--warn)}
  /* 動作列貼在畫面底部，跟短影音那邊的「壓片」同一個處置。這一頁的素材堆
     很長，滑到一半決定要寫不該先捲回頂端。
     #jobBar 跑起來的時候在它下面（fixed、z-index 50），所以讓開。 */
  /* #paper 是 overflow:auto，所以 sticky 貼的是它的底部而不是視窗底部 ——
     而它有 padding-bottom:60px，那 60px 就把動作列頂上去了。短影音那邊能
     work 是因為順手加了這一行，這裡漏了。 */
  #paper{padding-bottom:0}
  body:has(#jobBar:not([hidden])) .acts{bottom:46px}
  .acts{position:sticky;bottom:0;z-index:15;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:16px 0 0;padding:11px 15px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px 10px 0 0;border-bottom:none;
    /* 貼底的東西下面還有內容在捲，所以底色要不透明，而且要蓋掉自己下緣以外
       的那一條 —— 圓角外面那兩個小三角會漏出下面的字。 */
    box-shadow:0 -8px 16px -8px #0008, 0 12px 0 0 var(--panel)}
  .acts input{flex:1;min-width:220px}
  .acts .gap{flex:1 0 12px}
  .acts select{font:13px inherit;color:var(--ink);background:#0b1017;
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;
    cursor:pointer}
  .acts select:hover{border-color:var(--accent)}
  /* 公版說明和訊息各佔一整行，空的時候不佔位。 */
  .acts .why,.acts .hint,.acts #note{flex:1 0 100%;font-size:11px;
    color:var(--faint);margin:0}
  .acts .why{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts .why:empty,.acts .hint:empty,.acts #note:empty{display:none}

  /* Who has been heard. The point is not the count -- it is whether the
     other side is in there at all, so an empty one is coloured, not just
     small. Riding along on the verdict line because it answers the same
     question: is this writable yet. */
  .sides{display:flex;gap:5px;flex-shrink:0}
  .sides i{font-style:normal;font-size:11px;color:var(--faint);
    padding:2px 7px;border-radius:11px;background:#00000033;
    border:1px solid transparent}
  .sides i b{font:12px var(--mono);font-variant-numeric:tabular-nums;
    color:var(--ink);margin-left:4px}
  .sides i.none{border-color:#5c3a2a;background:#241a14}
  .sides i.none b{color:var(--warn)}

  h3{margin:24px 0 8px;font-size:13px;color:var(--dim);
    display:flex;align-items:center;gap:8px}
  h3 .count{font:11px var(--mono);color:var(--faint)}
  h3 .count.lacking{color:var(--warn)}
  h3 .hint{font-size:11px;color:var(--faint);font-weight:400;margin-left:auto}
  .hunt{display:flex;gap:8px;margin-bottom:10px}
  .hunt input{flex:1;font-size:13px}
  /* Candidates, not material: clicking one is what keeps it. */
  #caught .shelf figure{cursor:pointer}
  #caught .shelf figure:hover{border-color:var(--ok)}
  #caught .shelf figure.taken{opacity:.4;pointer-events:none}
  /* 被判成無關的那幾列。淡掉、加一道橘邊、放一顆「算進來」—— 因為清單畫全
     部，計數只算沒被判掉的，而畫面本來沒有任何線索說明差別。 */
  .src.doubted{opacity:.5;border-left:3px solid #5c4a2a}
  .src.doubted:hover{opacity:.85}
  .src .keep{float:right;margin-left:10px}
  .src{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin-bottom:7px;font-size:13px}
  .src .who{font:11px var(--mono);color:var(--faint);margin-top:3px}
  .src .fact{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
  .lean{font-size:10px;padding:1px 7px;border-radius:99px;margin-left:6px;
    border:1px solid var(--line);color:var(--dim)}
  .lean.left{color:#7fb4ff;border-color:#2d4a70}
  .lean.right{color:#ff9d7f;border-color:#6b3f2e}
  .lean.neutral{color:var(--ok);border-color:#2c5a45}
  /* A lead is something seen in a channel listing: known to exist, not yet
     fetched or read. Dashed, so it never reads as material already in hand. */
  .src.lead{border-style:dashed;background:transparent}
  .src.written{cursor:pointer;border-color:#2c5a45;background:#12291f}
  .src.written:hover{border-color:var(--ok)}
  .src.written b{font-size:15px;pointer-events:none}
  .src.written .who{pointer-events:none}
  .voice{font-size:12px;color:var(--dim);padding:6px 0;line-height:1.6;
    border-top:1px solid #1c242e}
  .voice .likes{font:11px var(--mono);color:var(--faint);margin-right:9px}
  .empty{color:var(--faint);font-size:13px;padding:14px;text-align:center;
    border:1px dashed var(--line);border-radius:9px}
  /* ---- one script, laid out as it will be spoken ---- */
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:left;font-size:11px;color:var(--faint);font-weight:500;
    padding:0 10px 7px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
  tr:hover td{background:#161d25}
  td.at{font:11px var(--mono);color:var(--faint);white-space:nowrap;width:5.4em}
  td.say{font-size:15px;line-height:1.55}
  /* The picture beside the line it belongs to: the two were chosen together
     and should be read together. */
  td.show{font-size:12px;color:var(--dim);width:30%}
  /* The picture's own words, under the label the writer typed. When they
     disagree the label is the one that is wrong, and this is where that
     shows. */
  td.show .grabbed{display:block;font:10px var(--mono);color:var(--faint);
    line-height:1.4;margin-top:3px}
  .seen-box.on{color:#5fcf9b;border-color:#2c5a45}
  td.show video.pic{width:100%;max-width:210px;height:82px;object-fit:cover;
    display:block;border-radius:6px;background:#0d1014;margin-bottom:4px}
  td.show{cursor:zoom-in}
  .shelf figure{cursor:zoom-in}
  td.show img.pic.drawn{object-fit:contain;background:#0d1b2a;
    border:1px solid #22405c}
  td.show .grabbed.bad{color:#ff8a72}
  td.show img.pic{width:100%;max-width:210px;height:82px;object-fit:cover;
    border-radius:6px;display:block;margin-bottom:5px;background:#0d1014}
  td.from{font-size:11px;color:var(--faint);width:11em}
  td.from.ours{color:var(--accent)}
  #note{font-size:13px;margin-top:14px}
  #note.bad{color:var(--danger)}
  #note.warn{color:var(--warn)}
</style>
<script defer src="/static/ask.js"></script>

<header>
  <h1>素材</h1>
  <span class="where">收集、看過、裁決，然後交給短影音</span>
  <span class="grow"></span>
  <input id="newName" placeholder="新題目…" size="16">
  <button id="btnNew" class="tiny">新增</button>
</header>

<!-- The house styles themselves. They began as two files I wrote by hand,
     which makes "what shapes a short can be" something only somebody editing
     the repository can change. They are data. -->
<!-- One long task at a time, and it says what it is doing. Gathering and
     rendering both took minutes and both ran only from the command line,
     which meant the page could not do half of what the pipeline does. -->
<div id="jobBar" hidden>
  <b id="jobWhat"></b>
  <span id="jobNote"></span>
  <div class="job-track"><i id="jobFill"></i></div>
  <span id="jobClock"></span>
</div>

<div id="houses" hidden>
  <div class="houses-inner">
    <div class="houses-bar">
      <b>公版</b>
      <span class="hint">一個公版說的是「這種片子長什麼形狀」。
        沒寫的項目會掉回 rules.json 的共用值</span>
      <button id="housesClose" class="tiny">關閉</button>
    </div>
    <div id="housesList"></div>
    <div class="houses-new">
      <input id="newHouseKey" placeholder="代號（英文，如 explain）" size="18">
      <input id="newHouseName" placeholder="名稱（如 拆解說明）" size="14">
      <button id="btnNewHouse" class="tiny primary">新增公版</button>
    </div>
  </div>
</div>

<main>
  <div id="list"></div>
  <div id="paper"><div class="empty">左邊選一個題目</div></div>
</main>


<script src="/static/shared.js"></script>
<script>
const STATE = { list: [], want: { videos: 5, reports: 5 }, chosen: null };






/* How the list is arranged. Sorted by when the file was last written, which
   is what it always did and is worth saying out loud: editing an audience
   moves a topic to the top. `state` sorts by how far each one got instead --
   which is the question once there are more topics than fit on a screen. */
const SIFT = {find: "", sort: "recent", showArchived: false};

function topicCard(item) {
  /* 兩顆，右上角。滑過去才顯出來（釘住的和收起來的一直顯示），因為整理清單
     是偶爾的事，而清單本身是天天看的。
     沒有「刪除」：封存和刪除本來都可逆、都不釋放空間，差別只有多難還原 ——
     那不是兩個功能。要真的清掉在封存區的標題那裡，一次一批。 */
  return `
    <div class="item ${item.name === STATE.chosen ? "on" : ""}${
      item.archived ? " archived" : ""}${item.pinned ? " pinned" : ""}"
         data-name="${escapeHTML(item.name)}">
      <span class="row-acts">
        <button class="tiny act" data-mark="pinned" data-on="${
          item.pinned ? "0" : "1"}" data-name="${escapeHTML(item.name)}"
          title="${item.pinned ? "取消置頂" : "釘在最前面"}"
          >${item.pinned ? "📌" : "📍"}</button>
        <button class="tiny act" data-mark="archived" data-on="${
          item.archived ? "0" : "1"}" data-name="${escapeHTML(item.name)}"
          title="${item.archived ? "放回清單" : "收起來，隨時放回來"}"
          >${item.archived ? "放回" : "收起"}</button>
      </span>
      <b>${escapeHTML(item.name)}${
        item.films ? `<span class="films">🎬 ${item.films}</span>` : ""}</b>
      <span class="facts">影片 ${item.counts.videos}/${STATE.want.videos}　`
      + `報導 ${item.counts.reports}/${STATE.want.reports}　事實 ${item.facts} 條</span>
      ${item.ready ? '<span class="facts" style="color:var(--ok)">素材夠了</span>'
                   : `<span class="facts bad">${escapeHTML(item.why)}</span>`}
      ${item.scripts.length
        ? `<span class="facts">文案 ${item.scripts.length} 份</span>` : ""}
    </div>`;
}

function renderList() {
  const find = SIFT.find.trim().toLowerCase();
  const matches = (one) => !find
    || one.name.toLowerCase().includes(find)
    || (one.note || "").toLowerCase().includes(find)
    || (one.audience || "").toLowerCase().includes(find);

  const rank = {
    // Newest first: what the list has always done.
    recent: (a, b) => b.modified - a.modified,
    // By how far it got, so the ones waiting on something are together.
    state: (a, b) => (b.films - a.films)
      || (b.scripts.length - a.scripts.length)
      || (Number(b.ready) - Number(a.ready))
      || (b.modified - a.modified),
    name: (a, b) => a.name.localeCompare(b.name, "zh-Hant"),
  }[SIFT.sort];

  /* 三區：釘住的、進行中的、收起來的。釘住的不參與排序 —— 釘住就是「不管
     什麼規則，我要它在最上面」，再排一次就等於沒釘。 */
  const all = STATE.list.filter(matches);
  const pinned = all.filter((one) => one.pinned && !one.archived);
  const live = all.filter((one) => !one.pinned && !one.archived).sort(rank);
  const filed = all.filter((one) => one.archived).sort(rank);

  $("list").innerHTML = `
    <div class="sift">
      <input id="findTopic" value="${escapeHTML(SIFT.find)}"
        placeholder="找題目、理由、受眾…" spellcheck="false">
      <select id="sortTopic">
        <option value="recent"${SIFT.sort === "recent" ? " selected" : ""}>最近改過</option>
        <option value="state"${SIFT.sort === "state" ? " selected" : ""}>做到哪</option>
        <option value="name"${SIFT.sort === "name" ? " selected" : ""}>名稱</option>
      </select>
    </div>
    ${pinned.map(topicCard).join("")}
    ${pinned.length && live.length ? '<div class="split"></div>' : ""}
    ${live.map(topicCard).join("")
      || (pinned.length ? "" : '<div class="empty">沒有符合的題目</div>')}
    ${filed.length ? `
      <div class="filed-head">
        <button class="tiny" id="showFiled">${
          SIFT.showArchived ? "▾" : "▸"} 收起來的 ${filed.length} 個</button>
        ${SIFT.showArchived
          ? '<button class="tiny purge" id="btnPurge">清空</button>' : ""}
      </div>
      ${SIFT.showArchived ? filed.map(topicCard).join("") : ""}` : ""}`;

  $("findTopic").oninput = (event) => {
    SIFT.find = event.target.value;
    const where = event.target.selectionStart;
    renderList();
    $("findTopic").focus();
    $("findTopic").setSelectionRange(where, where);
  };
  $("sortTopic").onchange = (event) => { SIFT.sort = event.target.value; renderList(); };
  if ($("showFiled")) $("showFiled").onclick = () => {
    SIFT.showArchived = !SIFT.showArchived;
    renderList();
  };
  /* 唯一真的不可逆的動作，所以是唯一問一句的。而它一次處理一批已經看不見一
     段時間的東西 —— 破壞性的步驟自然落在最後，不用刻意安排。 */
  if ($("btnPurge")) $("btnPurge").onclick = async () => {
    const n = STATE.list.filter((one) => one.archived).length;
    if (!await confirmed(`清空收起來的 ${n} 個題目？`, {
      body: "素材、文案、成片都會移走。這一步不像「收起來」，放不回來。",
      yes: "清空", no: "算了"})) return;
    try {
      const back = await api("POST", "/api/topics/purge");
      await reload(false);
      told("清空了", `${back.purged.length} 個題目、`
                   + `${(back.bytes / 1048576).toFixed(0)} MB`);
    } catch (error) { told("出錯了", error.message); }
  };
}


/** What people said underneath, loudest first. No names: we want what was
 *  said, not who said it. */
function voiceRows(voices) {
  if (!voices || !voices.length) {
    return '<div class="empty">還沒抓留言</div>';
  }
  return voices.map((one) => `
    <div class="src">
      <div class="who">${escapeHTML(one.outlet || "")}　${
        escapeHTML(one.title || "")}　${(one.comments || []).length} 則</div>
      ${(one.comments || []).slice(0, 12).map((said) => `
        <div class="voice"><span class="likes">▲${said.likes}</span>${
          escapeHTML(said.say)}</div>`).join("")}
      ${(one.comments || []).length > 12
        ? `<div class="who">…另外 ${one.comments.length - 12} 則</div>` : ""}
    </div>`).join("");
}

function sourceRows(items, kind) {
  if (!items || !items.length) {
    return `<div class="empty">還沒有${kind}</div>`;
  }
  /* 被標存疑的要看得出來，而且要能當場撿回。
     這張清單畫全部 33 支，而計數只算沒被標的 4 支 —— 畫面上兩個數字互相矛
     盾，而清單完全沒有線索。使用者的反應是「我明明有超多影片，為什麼說只有
     四個」，那是介面的錯不是他的錯。
     一支寫著「Trump renames Lake Ontario」的影片被判成無關，看起來跟留下的
     那些一模一樣。 */
  return items.map((item) => `
    <div class="src${item.doubt ? " doubted" : ""}">
      ${item.doubt ? `<button class="tiny keep" data-url="${
        escapeHTML(item.url || "")}" title="模型判它跟題目無關，沒算進計數。按一下撿回來"
        >算進來</button>` : ""}
      ${item.url ? `<a href="${escapeHTML(item.url)}" target="_blank">${
        escapeHTML(item.title || item.url)}</a>` : escapeHTML(item.title || "")}
      ${leanTag(item.lean || "")}
      <div class="who">${escapeHTML(item.outlet || "")}${
        item.seconds ? `　${Math.round(item.seconds / 60)} 分` : ""}${
        item.captions ? "　有字幕" : ""}${
        item.use ? `　用 ${item.use.map((w) => `${w[0]}–${w[1]}s`).join("、")}` : ""}${
        item.note ? `　${escapeHTML(item.note)}` : ""}</div>
      ${(item.facts || []).length
        ? `<div class="fact">${item.facts.map(escapeHTML).join("　·　")}</div>` : ""}
    </div>`).join("");
}

async function open(name) {
  STATE.chosen = name;
  renderList();
  let pile;
  try { pile = await api("GET", `/api/topic?name=${encodeURIComponent(name)}`); }
  catch (error) {
    // 離開中就別畫。中止的 fetch 不是這個題目讀不到。
    if (!goneQuiet(error)) {
      $("paper").innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`;
    }
    return;
  }

  const got = pile.counts.got, want = pile.counts.want, sides = pile.balance.sides;
  const columns = [["left", "左"], ["neutral", "中立"], ["right", "右"],
                   ["other", "其他"]];

  $("paper").innerHTML = `
    <h2>${escapeHTML(pile.topic || name)}</h2>
    <!-- 兩個欄位，一塊。它們回答同一個問題的兩半：為什麼做（理由）、做給誰
         （受眾）—— 而後者決定結尾整段怎麼寫、甚至決定收哪些圖。分成上下兩
         條的時候，中間隔著一整條邊界，看起來像兩件不相干的事。

         這裡的兩樣是這一頁上唯一算不出來的東西。素材夠不夠、平衡不平衡、
         有幾張圖，程式全部算得出來；「醫療題目不能用 AI 配音變現」不在任何
         地方，而它決定這支片做不做。 -->
    <div class="decide">
      <label>挑這題的理由
        <input id="topicNote" value="${escapeHTML(pile.note || "")}"
          placeholder="為什麼值得花九十秒？有什麼坑？" spellcheck="false">
      </label>
      <label>說給誰聽
        <input id="topicWho" value="${escapeHTML(pile.audience || "")}"
          placeholder="還沒決定 —— 結尾整段會寫給這群人聽" spellcheck="false">
      </label>
      ${pile.audience_guess && pile.audience !== pile.audience_guess
        ? `<button id="btnGuessWho" class="tiny"
             title="從題目關鍵字猜的，不一定對">用「${
             escapeHTML(pile.audience_guess)}」</button>` : ""}
    </div>

    <!-- One line, not two panels. The six counts that used to sit here are
         on the sticky jump bar a little further down, where each one is also
         the way to reach that pile -- printing them twice made the top of
         the page a table of contents for a table of contents. What is left
         is the one thing the jump bar cannot say: whether this is writable,
         and who has not been heard. -->
    <!-- 狀態和動作，一塊。
         這一頁只有兩個真正的動作 —— 逐家問、產生文案 —— 其餘全是讀和判斷。
         而它們互斥：素材不夠就去收集，夠了就去寫，中間沒有第三種情況。頁面
         已經知道現在是哪一種（pile.ready），所以由它決定哪一顆是主要的。
         本來一個在判定下面、一個在待辦最後一列，中間隔著兩個黃框 —— 兩個都
         不像主要動作，而其中一個永遠是。 -->
    <div class="doing ${pile.ready ? "ok" : "no"}">
      <div class="verdict">
        <span>${pile.ready ? "素材夠了，可以寫文案"
                           : `還不能寫：${escapeHTML(pile.why)}`}</span>
        <span class="sides">${columns.map(([key, label]) => `
          <i class="${sides[key] ? "" : "none"}">${label}<b>${sides[key]}</b></i>`
        ).join("")}</span>
      </div>

    </div>

    <!-- 還沒處理的事，一區。本來是兩個一模一樣的黃框上下疊著，再加一列
         「寫成／產生文案」—— 三條橫幅，讀起來像三個警報，而它們其實是同一
         種東西：等你決定的。
         順序就是做事的順序：先撿回判錯的，再補缺的圖，然後才寫。 -->
    <div class="todo">
      ${(pile.doubted || []).length ? `
      <div class="row doubt">
        <div class="what">
          <b>模型覺得這 ${pile.doubted.length} 篇跟題目無關</b>
          <span>還留著，也還沒算進計數。撿回判錯的，其餘丟掉</span>
        </div>
        <button id="btnDropAll" class="tiny">其餘全部丟</button>
        <div class="rows">${pile.doubted.map((one) => `
          <div class="doubt-row" data-url="${escapeHTML(one.url || "")}">
            <button class="tiny keep">留</button>
            <span class="who">${escapeHTML(one.outlet || "")}</span>
            <span class="txt">${escapeHTML(one.title || "")}</span>
          </div>`).join("")}</div>
      </div>` : ""}

      ${(pile.wanted || []).length ? `
      <!-- 受眾要求的、素材堆沒有的。計數說圖夠了；計數看不出「結尾沒有東西
           可以落」，因為結尾是講給一群人聽的，而三十張講主題的圖在數字上一
           樣夠。 -->
      <div class="row want">
        <div class="what">
          <b>結尾會需要的示意圖，還沒收到</b>
          <span>說給誰聽是「${escapeHTML(pile.audience || "")}」，
            文案最後幾句要落在那群人的生活上</span>
        </div>
        <button id="btnWanted" class="tiny">去 Pexels 抓</button>
        <div class="rows terms">${pile.wanted.map((one) =>
          `<code>${escapeHTML(one)}</code>`).join("")}</div>
      </div>` : ""}

    </div>

    ${(pile.scripts || []).length ? `
      <h3>寫好的文案 <span class="count">${pile.scripts.length} 份</span></h3>
      ${pile.scripts.map((one) => `
        <div class="src written" data-script="${escapeHTML(one.name || one)}">
          <button class="tiny drop-script"
            data-name="${escapeHTML(one.name || one)}" title="刪掉這份文案">刪</button>
          <b>${escapeHTML(one.name || one)}</b>
          ${one.house ? `<span class="house ${
            one.format === "story" ? "story" : "argue"}">${
            escapeHTML(one.house)}</span>` : ""}
          <div class="who">${one.seconds
            ? `${one.seconds}s　${one.lines} 句　點開來看逐句台詞`
            : "點開來看逐句台詞"}</div>
        </div>`).join("")}` : ""}

    ${(pile.leads || []).length ? `
      <h3>線索 <span class="count">${pile.leads.length} 條，還沒抓回來</span></h3>
      ${pile.leads.map((lead) => `
        <div class="src lead">
          ${escapeHTML(lead.title || "")}${leanTag(lead.lean || "")}
          <div class="who">${escapeHTML(lead.outlet || "")}</div>
        </div>`).join("")}` : ""}

    ${jumpBar(pile)}
    ${fold("影片", `${got.videos} / ${want.videos}`,
           sourceRows(pile.sources.videos, "影片"))}
    ${fold("報導", `${got.reports} / ${want.reports}`,
           sourceRows(pile.sources.reports, "報導"))}
    ${fold("原始數據", `${got.data}`,
           sourceRows(pile.sources.data, "數據"),
           "能下載 CSV 的官方統計（財政部、CBO、FRED、Eurostat），用來自己畫圖表。"
           + "還沒有程式在收，要手動加進 topics/*.json")}
    <h3>臨時要找一張
      <span class="hint">寫文案時想到什麼就打什麼，英文</span></h3>
    <div class="hunt">
      <input id="want" placeholder="例如：Trump wearing a hat" spellcheck="false">
      <button id="btnFind" class="tiny">找</button>
    </div>
    <div id="caught"></div>

    ${["stock", "real", "frame"].map((kind) => {
      const spec = pile.counts.pictures[kind];
      const shown = (pile.sources.images || []).filter(
        (one) => (one.kind || "stock") === kind);
      return `
      <section class="pile" id="pile-${escapeHTML(spec.label)}">
      <h3>${escapeHTML(spec.label)}
        <span class="count ${spec.short ? "lacking" : ""}">${spec.have} / ${
          spec.want}${spec.short ? `　還缺 ${spec.short}` : ""}</span>
        <span class="hint">${WHERE_FROM[kind]}</span></h3>
      ${shown.length ? `<div class="shelf">${shown.map((one) => `
        <figure data-shot="${escapeHTML(JSON.stringify({
            say: "", show: one.term || "",
            pic: `/media/photo/${encodeURIComponent(name)}/${
              encodeURIComponent((one.file || "").split("/").pop())}`,
            caption: one.caption || "", credit: one.credit || "",
            from: one.outlet || "",
          }))}" title="點開來看">
          <img src="/media/photo/${encodeURIComponent(name)}/${
            encodeURIComponent((one.file || "").split("/").pop())}"
            alt="" loading="lazy">
          <figcaption class="asked">${escapeHTML(
            one.at != null ? `${Math.round(one.at)}s　${one.outlet || ""}`
                           : one.term || "")}</figcaption>
          <figcaption class="got">${escapeHTML(one.caption || "（沒有說明）")}</figcaption>
          ${one.credit ? `<figcaption class="who">${escapeHTML(one.credit)}</figcaption>` : ""}
        </figure>`).join("")}</div>`
        : `<div class="empty">還沒有${escapeHTML(spec.label)}</div>`}
      </section>`;
    }).join("")}

    <section class="pile" id="pile-鄉民反應">
      <h3>鄉民反應 <span class="count">${voiceCount(pile)} 則</span>
        <button id="btnVoices" class="tiny">抓留言</button></h3>
      ${voiceRows(pile.voices)}
    </section>

    <section class="pile" id="pile-整理出的事實">
      <h3>整理出的事實 <span class="count">${(pile.facts || []).length}</span>
        <span class="hint">每一條都要指得回某一篇。還沒有程式在抽，
          要手動加進 topics/*.json</span></h3>
      ${(pile.facts || []).length
        ? (pile.facts || []).map((fact) => `
            <div class="src">${escapeHTML(fact.say)}
              <div class="who">${escapeHTML(fact.from || "")}</div></div>`).join("")
        : '<div class="empty">還沒有整理</div>'}
    </section>

    <!-- 動作列貼在畫面底部，跟短影音那邊的「壓片」同一個處置。
         這一頁比文案還長 —— 十支影片、三十四篇報導、三十四張圖、六十則留言
         —— 滑到一半決定「夠了，來寫」，不該先捲回頂端按一顆鈕。
         判定句留在上面：那是結論，這裡是動作。 -->
    <div class="acts">
      <input id="hunt" placeholder="英文搜尋詞，逗號分隔（如 museum theft, stolen painting）"
        spellcheck="false">
      <button id="btnTerms" class="tiny">想幾個</button>
      <button id="btnGather" class="${pile.ready ? "tiny" : "primary"}">${
        pile.ready ? "再收集" : "逐家問（影片＋報導＋圖＋留言）"}</button>
      <span class="gap"></span>
      <!-- 公版在寫之前選，不是寫完再改：它決定角色、節奏、實拍上限和送哪一
           份 prompt，事後換等於每一句都要重貼標籤 —— 梅西納就是這樣。 -->
      <select id="writeAs" title="寫成哪一種">
        ${(FORMATS.length ? FORMATS : [{key: "argue", name: "新聞報導"}])
          .map((one) => `<option value="${escapeHTML(one.key)}">${
            escapeHTML(one.name || one.key)}</option>`).join("")}
      </select>
      <button id="btnWrite" class="${pile.ready ? "primary" : "tiny"}"
        ${pile.ready ? "" : "disabled"}>產生文案</button>
      ${pile.ready ? "" : '<button id="btnAnyway" class="tiny">不齊也要寫</button>'}
      <div id="whyHouse" class="why"></div>
      <div id="termsNote" class="hint"></div>
      <div id="note"></div>
    </div>`;

  const write = async (anyway) => {
    $("note").className = "";
    $("note").textContent = "寫稿中…";
    try {
      const made = await api("POST", "/api/topic/script",
                             { name, anyway, format: $("writeAs").value });
      // 寫好就過去。這一頁的工作到「交出一份草稿」為止，而剩下的每一件事
      // —— 改台詞、看圖打勾、壓片 —— 都在那一頁。印一行「寫好了」然後把人
      // 留在原地，等於要他自己猜下一步在哪。
      $("note").textContent = `寫好了：${made.script}　過去改…`;
      leaveTo("/scripts?name=" + encodeURIComponent(made.script));
    } catch (error) {
      $("note").className = "warn";
      $("note").textContent = error.message;
    }
  };
  /* Ask for one shot and look at what comes back. Nothing is kept until it is
     clicked -- a specific request is usually specific about how it should look
     as well as what is in it. */
  const hunt = async () => {
    const want = $("want").value.trim();
    if (!want) return;
    $("caught").innerHTML = '<div class="empty">找…</div>';
    let got;
    try { got = await api("POST", "/api/topic/find", { want }); }
    catch (error) {
      $("caught").innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`;
      return;
    }
    if (!got.found.length) {
      $("caught").innerHTML = '<div class="empty">兩邊都沒有。換個說法試試</div>';
      return;
    }
    $("caught").innerHTML = `
      <div class="shelf">${got.found.map((one, index) => `
        <figure data-catch="${index}" title="點一下收進來　${
          escapeHTML(one.caption || "")}">
          <img src="${escapeHTML(one.url)}" alt="" loading="lazy">
          <figcaption>${one.kind === "real" ? "真實" : "示意"}　${
            escapeHTML(one.author || one.outlet)}</figcaption>
        </figure>`).join("")}</div>`;
    $("caught").querySelectorAll("[data-catch]").forEach((card) => {
      card.onclick = async () => {
        card.classList.add("taken");
        try {
          await api("POST", "/api/topic/keep",
                    { name, want, picture: got.found[Number(card.dataset.catch)] });
          $("note").className = "";
          $("note").textContent = "收下了。重新整理這一頁就會出現在下面";
        } catch (error) {
          card.classList.remove("taken");
          $("note").className = "bad";
          $("note").textContent = error.message;
        }
      };
    });
  };
  if ($("btnFind")) $("btnFind").onclick = hunt;
  if ($("want")) $("want").addEventListener("keydown", (event) => {
    if (event.key === "Enter") hunt();
  });

  if ($("btnVoices")) $("btnVoices").onclick = async () => {
    $("btnVoices").disabled = true;
    $("btnVoices").textContent = "抓取中…";
    try {
      const got = await api("POST", "/api/topic/voices", { name });
      open(name);
      $("note").textContent = `抓了 ${got.added} 則，共 ${got.total} 則`;
    } catch (error) {
      $("btnVoices").disabled = false;
      $("btnVoices").textContent = "抓留言";
      $("note").className = "bad";
      $("note").textContent = error.message;
    }
  };
  // Each shape says in its own file why it exists; show that beside the
  // chooser, because "新聞報導 or 說故事" is not a choice anybody can make from
  // the two words alone.
  const writeAs = $("writeAs");
  if (writeAs) {
    const sayWhy = () => {
      const spec = FORMATS.find((one) => one.key === writeAs.value) || {};
      // 一行，全文在 title。三四句話塞在按鈕旁邊只會被跳過，而它要回答的是
      // 「這兩種公版差在哪」—— 那個問題只在選的那一刻要問一次。
      $("whyHouse").textContent = spec.why || "";
      $("whyHouse").title = spec.why || "";
    };
    writeAs.onchange = sayWhy;
    sayWhy();
  }
  // Who this topic is for. Stored on the topic, and copied into a script when
  // one is written -- a topic can yield two shorts for two audiences, so the
  // script keeps its own once it exists.
  // Deleting a script. It goes to trash/ rather than away: a script is the
  // only place a set of judgements lives -- which picture for which line,
  // which passage, which card -- and each of those took looking at something.
  // The film and the drawn cards do go, since both rebuild from it exactly.
  $("paper").querySelectorAll(".drop-script").forEach((button) => {
    button.onclick = async (event) => {
      event.stopPropagation();          // the card itself opens the script
      const which = button.dataset.name;
      if (!await confirmed(`刪掉文案「${which}」？`, {
        body: "文案移到 trash/，可以救回來。",
        lose: ["壓好的影片（可以重壓）", "畫好的卡片（可以重畫）",
               "接觸表"]})) return;
      try {
        await api("DELETE", `/api/script?name=${encodeURIComponent(which)}`);
        open(name);
      } catch (error) { told('出錯了', error.message); }
    };
  });

  $("paper").querySelectorAll("[data-jump]").forEach((button) => {
    button.onclick = () => {
      const target = document.getElementById(`pile-${button.dataset.jump}`);
      if (target) target.scrollIntoView({behavior: "smooth", block: "start"});
    };
  });


  // Deleting a topic. Refused while a script is written from it: a script
  // names pictures by path, so taking the pile away turns a script that was
  // fine yesterday into one missing every shot.
  const noteBox = $("topicNote");
  if (noteBox) {
    noteBox.dataset.was = noteBox.value;
    const saveNote = async () => {
      if (noteBox.value.trim() === noteBox.dataset.was) return;
      try {
        await api("POST", "/api/topic/note",
                  {name, note: noteBox.value.trim()});
        noteBox.dataset.was = noteBox.value.trim();
      } catch (error) { told('出錯了', error.message); noteBox.value = noteBox.dataset.was; }
    };
    noteBox.addEventListener("blur", saveNote);
    noteBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); noteBox.blur(); }
      if (event.key === "Escape") { noteBox.value = noteBox.dataset.was; noteBox.blur(); }
    });
  }

  const who = $("topicWho");
  if (who) {
    who.dataset.was = who.value;
    const saveWho = async () => {
      if (who.value.trim() === who.dataset.was) return;
      try {
        await api("POST", "/api/topic/audience",
                  {name, audience: who.value.trim()});
        who.dataset.was = who.value.trim();
        open(name);
      } catch (error) { told('出錯了', error.message); who.value = who.dataset.was; }
    };
    who.addEventListener("blur", saveWho);
    who.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); who.blur(); }
      if (event.key === "Escape") { who.value = who.dataset.was; who.blur(); }
    });
  }
  if ($("btnGuessWho")) $("btnGuessWho").onclick = async () => {
    try {
      await api("POST", "/api/topic/audience",
                {name, audience: pile.audience_guess});
      open(name);
    } catch (error) { told('出錯了', error.message); }
  };

  // The picture terms ride along with the video ones: one suggestion, one
  // gather. Kept here rather than in a second box because they are not a
  // separate decision -- both come from the same reading of the topic.
  TERMS.pictures = [];
  // Suggested, then shown, then used. Putting the terms in the box rather
  // than searching with them straight away is the difference between a
  // suggestion and a decision somebody else made -- and these terms decide
  // which nineteen answers come back.
  if ($("btnTerms")) $("btnTerms").onclick = async () => {
    $("termsNote").textContent = "想中…";
    try {
      const got = await api("POST", "/api/topic/terms", {name});
      $("hunt").value = got.videos.join(", ");
      TERMS.pictures = got.pictures || [];
      TERMS.named = got.named || [];
      const extra = [];
      if (got.pictures.length) extra.push(`圖庫：${got.pictures.join("、")}`);
      if ((got.named || []).length) extra.push(`維基：${got.named.join("、")}`);
      $("termsNote").textContent = extra.length
        ? `${extra.join("　｜　")}　${got.took}s` : `${got.took}s`;
    } catch (error) { $("termsNote").textContent = error.message; }
  };
  // Ruling on what the model doubted. Keeping is one click each because that
  // is the direction worth making easy -- a wrongly dropped source is a fact
  // that stops existing, a wrongly kept one is a line in a list.
  /* 撿回一筆，兩個地方都可以按：上面的待辦區、以及清單裡那一列。
     網址在 .doubt-row 上或在按鈕自己身上，兩種都收 —— 一個委派，兩種來源。 */
  $("paper").querySelectorAll(".keep").forEach((button) => {
    button.onclick = async () => {
      const row = button.closest(".doubt-row");
      const url = (row && row.dataset.url) || button.dataset.url;
      if (!url) return;
      try {
        await api("POST", "/api/topic/judge", {name, urls: [url], keep: true});
        open(name);
      } catch (error) { told('出錯了', error.message); }
    };
  });
  if ($("btnDropAll")) $("btnDropAll").onclick = async () => {
    const urls = [...$("paper").querySelectorAll(".doubt-row")]
      .map((row) => row.dataset.url);
    if (!await confirmed(`丟掉這 ${urls.length} 篇？`, {
      body: "模型判定它們跟題目無關。丟掉之後就找不回來了。"})) return;
    try {
      await api("POST", "/api/topic/judge", {name, urls, keep: false});
      open(name);
    } catch (error) { told('出錯了', error.message); }
  };
  if ($("btnGather")) $("btnGather").onclick = async () => {
    const queries = $("hunt").value.trim();
    if (!queries) { told("要給搜尋詞"); return; }
    try {
      await api("POST", "/api/topic/gather",
                {name, queries, pictures: TERMS.pictures.join(", "),
                 named: TERMS.named.join(", ")});
      watchJob(() => open(name));
    } catch (error) { told('出錯了', error.message); }
  };
  if ($("btnWanted")) $("btnWanted").onclick = async () => {
    $("note").className = ""; $("note").textContent = "抓圖中…";
    try {
      const back = await api("POST", "/api/topic/images",
                             {name, terms: pile.wanted, where: "stock"});
      $("note").textContent = `收了 ${back.added} 張`;
      open(name);
    } catch (error) {
      $("note").className = "warn"; $("note").textContent = error.message;
    }
  };
  if ($("btnWrite")) $("btnWrite").onclick = () => write(false);
  if ($("btnAnyway")) $("btnAnyway").onclick = () => write(true);
}

const TERMS = {pictures: [], named: []};

/* 公版清單。這一頁只讀它 —— 「寫成 新聞報導／說故事」那個選單。
   編輯公版在文案頁，因為那是改「片子長什麼形狀」，不是收集素材。 */
let FORMATS = [];
/* Which piles are open. A gathered topic is twenty-five videos, thirty-six
   reports and forty-nine pictures -- right for something browsed once and
   consulted later, wrong to scroll past on every visit. Remembered across
   redraws so opening one and acting on it does not shut it again. */
/* Getting to a pile without scrolling past the others. The counts are on the
   buttons, so it doubles as the summary of what has been gathered -- which is
   the thing you actually came to the page to find out. */
function jumpBar(pile) {
  const got = pile.counts.got, want = pile.counts.want;
  const piles = [
    ["影片", `${got.videos}/${want.videos}`],
    ["報導", `${got.reports}/${want.reports}`],
    ["原始數據", `${got.data}`],
    ...Object.values(pile.counts.pictures).map(
      (spec) => [spec.label, `${spec.have}/${spec.want}`, spec.short]),
    ["鄉民反應", `${voiceCount(pile)}`],
    ["整理出的事實", `${(pile.facts || []).length}`],
  ];
  return `<div class="jump">${piles.map(([title, count, short]) => `
    <button class="tiny${short ? " lacking" : ""}" data-jump="${escapeHTML(title)}">
      ${escapeHTML(title)} <b>${escapeHTML(count)}</b></button>`).join("")}</div>`;
}
/* Everything open, always. Folding was the wrong answer to a long page: a
   pile you have to open is a pile you forget is there, and the point of
   gathering is to see what you have. What was actually wanted is a way to get
   to a section without scrolling past the others. */
function fold(title, count, body, why) {
  return `
    <section class="pile" id="pile-${escapeHTML(title)}">
      <h3>${escapeHTML(title)} <span class="count">${escapeHTML(count)}</span>
        ${why ? `<span class="hint">${escapeHTML(why)}</span>` : ""}</h3>
      ${body}
    </section>`;
}

async function reload(openFirst) {
  try {
    const found = await api("GET", "/api/topics");
    STATE.list = found.topics.sort((a, b) => b.modified - a.modified);
    STATE.want = found.want;
  } catch (error) { /* nothing yet */ }
  renderList();
  if (openFirst && STATE.list.length) open(STATE.list[0].name);
}

/* ---------------------------------------------------------------- 綁事件
 * 委派給 #list 和 #paper，因為兩邊的內容每次重畫都換掉，綁在元素上會掉。 */

$("list").addEventListener("click", async (event) => {
  /* 置頂和收起來走同一條路。它們是同一種東西（人對這一列的判斷），所以
     data-mark 說改哪個欄位，data-on 說改成什麼。 */
  const act = event.target.closest("[data-mark]");
  if (act) {
    event.stopPropagation();     // 標記不是「打開」
    act.disabled = true;
    try {
      await api("POST", "/api/topic/mark",
                {name: act.dataset.name, [act.dataset.mark]: act.dataset.on === "1"});
      const found = await api("GET", "/api/topics");
      STATE.list = (found.topics || []).sort((a, b) => b.modified - a.modified);
      renderList();
    } catch (error) { told("出錯了", error.message); act.disabled = false; }
    return;
  }
  const row = event.target.closest("[data-name]");
  if (row) open(row.dataset.name);
});

$("paper").addEventListener("click", (event) => {
  // 文案卡片現在連到另一頁，不是在這一頁展開。
  const card = event.target.closest("[data-script]");
  if (card) { leaveTo("/scripts?name="
    + encodeURIComponent(card.dataset.script)); return; }

  const shelf = event.target.closest(".shelf [data-shot]");
  if (shelf) { openShot(JSON.parse(shelf.dataset.shot)); return; }
});

$("btnNew").onclick = async () => {
  const name = $("newName").value.trim();
  if (!name) return;
  try {
    const made = await api("POST", "/api/topic", { name });
    STATE.list = made.topics.sort((a, b) => b.modified - a.modified);
    $("newName").value = "";
    renderList();
    open(name);
  } catch (error) { told('出錯了', error.message); }
};
$("newName").addEventListener("keydown", (event) => {
  if (event.key === "Enter") $("btnNew").click();
});

/* 網址帶了名字就開那一個 —— 從文案頁按「回題目」會這樣過來。 */
async function boot() {
  const settle = holdOff();
  /* 並行，理由同 scripts.html：串著跑的那幾百毫秒就是換頁時閃的那一下。
     公版清單抓不到，「寫成」那個選單會掉回「新聞報導」，不影響其他事。 */
  const [formats, listed] = await Promise.all([
    api("GET", "/api/formats").catch(() => ({formats: []})),
    api("GET", "/api/topics").catch(() => ({topics: [], want: STATE.want})),
  ]);
  FORMATS = formats.formats || [];
  STATE.list = (listed.topics || []).sort((a, b) => b.modified - a.modified);
  STATE.want = listed.want || STATE.want;

  const wanted = new URLSearchParams(location.search).get("name");
  const pick = (wanted && STATE.list.some((one) => one.name === wanted))
    ? wanted : (STATE.list[0] && STATE.list[0].name);
  renderList();
  settle();
  if (pick) await open(pick);
}

/* 報錯的規矩在 shared.js：壞了要說，但離開中不要說。 */
boot().catch(reportFault);
window.addEventListener("unhandledrejection",
  (event) => reportFault(event.reason));
</script>
