<!doctype html>
<meta charset="utf-8">
<title>題目與文案　AI-Desk</title>
<style>
  :root{
    --bg:#0b0e12; --panel:#141a21; --panel2:#1b232c; --line:#26313d;
    --ink:#e6edf3; --dim:#9fb0c0; --faint:#6b7c8c;
    --accent:#5aa9ff; --ok:#4ec98b; --warn:#f5b544; --danger:#ef6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    display:flex;flex-direction:column;height:100vh}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:#0b1017;border-color:transparent;
    font-weight:600}
  button.tiny{padding:3px 9px;font-size:12px}
  input{background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);padding:6px 10px;font-size:13px}
  a{color:var(--accent)}

  header{display:flex;align-items:center;gap:12px;padding:11px 18px;flex:none;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px}
  header .where{color:var(--faint);font-size:12px}
  header .grow{flex:1}

  main{flex:1;display:flex;min-height:0}
  #list{width:300px;flex:none;overflow:auto;padding:12px;
    border-right:1px solid var(--line)}
  #paper{flex:1;overflow:auto;padding:20px 26px 60px}

  .item{padding:10px;margin-bottom:6px;border-radius:8px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line)}
  .item:hover{border-color:var(--accent)}
  .item.on{border-color:var(--accent);background:var(--panel2)}
  .item b{display:block;font-weight:600}
  .item .facts{font:11px var(--mono);color:var(--faint);margin-top:4px;display:block}
  .item .bad{color:var(--warn)}

  h2{margin:0 0 4px;font-size:19px}
  .angle{color:var(--dim);font-size:13px;margin-bottom:16px}

  /* ---- what has been gathered ---- */
  /* A pile to choose from, so it is browsed rather than read: small, dense,
     and every one says which search found it. */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:8px}
  .shelf figure{margin:0;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .shelf img{width:100%;height:88px;object-fit:cover;display:block;
    background:#0d1014}
  .shelf figcaption{font:10px var(--mono);padding:3px 6px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* What we asked for, and what actually came back. Side by side because the
     mistake is invisible any other way: the search said `electricity bill`,
     the picture's own caption said `fuse box`, and only the first was ever
     shown. */
  .shelf figcaption.asked{color:#7fd4ff;padding-top:5px}
  .shelf figcaption.got{color:var(--faint);white-space:normal;line-height:1.35;
    max-height:2.7em;border-top:1px solid var(--line);padding-top:4px}
  .shelf figcaption.who{color:#9a8; font-size:9px}
  /* A shot at the size it will be seen. The row thumbnails are 82px tall
     and a card's own type is 76px on a 1920 frame -- legible in the finished
     video, illegible in the list -- so the list is for finding a shot and
     this is for judging it. */
  /* Which of 起承轉合 this line claims to be. Shown because it is a claim the
     writer made and the program checks, not decoration. */
  td.at select.role{display:block;margin-top:4px;font:11px var(--mono);
    color:#7fd4ff;background:#0d1014;border:1px solid var(--line);
    border-radius:5px;padding:2px 4px;cursor:pointer}
  td.at select.role:hover{border-color:var(--accent)}
  .say-edit{outline:none;border-radius:6px;padding:3px 6px;margin:-3px -6px;
    border:1px solid transparent;cursor:text;white-space:pre-wrap}
  .say-edit:hover{border-color:var(--line)}
  .say-edit:focus{border-color:var(--accent);background:#0d1014}
  .say-meter{margin-top:4px;font:10px var(--mono);color:var(--faint);
    display:flex;gap:9px;flex-wrap:wrap}
  .say-meter .warn{color:#e2a33c}
  .say-meter .hint{opacity:.62}
  #big{position:fixed;inset:0;background:#000d;z-index:60;display:flex;
    align-items:center;justify-content:center;padding:24px}
  /* `display:flex` on the element itself outranks the browser's own
     `[hidden]{display:none}`, so the overlay came up on load and covered the
     page -- a black sheet with one 關閉 button on it. The attribute has to be
     given back its authority explicitly. */
  #big[hidden]{display:none}
  .big-inner{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px 14px;max-width:min(94vw,760px);
    max-height:94vh;display:flex;flex-direction:column;gap:10px}
  .big-bar{display:flex;align-items:baseline;gap:10px}
  .big-bar b{font-size:13px}
  .big-bar span{font:11px var(--mono);color:var(--faint)}
  /* Worded like every other panel's, because a ✕ is a symbol you have to
     know and 關閉 is a word you can read. */
  .big-bar button{margin-left:auto}
  #bigStage{display:flex;align-items:center;justify-content:center;
    min-height:0;overflow:auto}
  #bigStage img,#bigStage video{max-width:100%;max-height:74vh;
    border-radius:8px;display:block;background:#0d1014}
  #bigNote{font:11px var(--mono);color:var(--faint);line-height:1.6}
  #bigNote em{font-style:normal;color:#7fd4ff}
  /* Unsaved edits are visible and countable. Saving on every keystroke meant
     there was no such state, so nothing could be discarded and nothing had to
     be confirmed. */
  /* The house styles, edited as what they are: data. Every field was a
     constant somewhere, and `why` is the field that matters -- a number with
     no reason attached gets changed by whoever finds it inconvenient. */
  #houses{position:fixed;inset:0;background:#000d;z-index:70;display:flex;
    align-items:flex-start;justify-content:center;padding:32px 24px;overflow:auto}
  #houses[hidden]{display:none}
  .houses-inner{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px 16px;width:min(96vw,880px)}
  .houses-bar{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .houses-bar b{font-size:14px}
  .houses-bar .hint{font-size:11px;color:var(--faint);flex:1;line-height:1.5}
  .house-card{border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    margin-bottom:10px;background:var(--bg)}
  .house-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .house-head code{font:11px var(--mono);color:var(--faint)}
  .house-head .grow{flex:1}
  .house-card label{display:block;font-size:11px;color:var(--faint);
    margin-bottom:7px}
  .house-card label.wide{grid-column:1/-1}
  .house-card input,.house-card textarea{width:100%;margin-top:3px;
    font:13px inherit;color:var(--ink);background:#0d1014;
    border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  .house-card textarea{font-size:12px;line-height:1.6;resize:vertical}
  .house-card .h-name{font-size:14px;font-weight:600;width:auto;margin:0}
  .house-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:8px 12px}
  .houses-new{display:flex;gap:8px;align-items:center;margin-top:6px;
    padding-top:11px;border-top:1px solid var(--line)}

  .pick-house{display:flex;align-items:center;gap:7px;font-size:12px;
    color:var(--faint)}
  .pick-house select{font:13px inherit;color:var(--ink);background:#0d1014;
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
  .pick-house select:hover{border-color:var(--accent)}
  #whyHouse{font-size:11px;color:var(--faint);flex:1;line-height:1.5}

  /* Which shape a script is, on its card. Not only inside the script view:
     it decides what every other number on that card means -- 38% borrowed is
     over the ceiling for an argument and comfortable for a story. */
  .src.written .house{display:inline-block;margin-left:8px;padding:1px 8px;
    border-radius:99px;font:11px var(--mono)}
  .src.written .house.argue{background:#12212e;color:#7fd4ff;
    border:1px solid #244055}
  .src.written .house.story{background:#2a1a12;color:#ffb347;
    border:1px solid #5c3325}

  /* Two decisions about the whole film, made once and never revisited until
     they were put here: which shape it is, and who it is for. */
  .about{display:flex;align-items:center;gap:14px;margin:10px 0 14px;
    padding:9px 14px;border-radius:9px;background:var(--panel);
    border:1px solid var(--line);flex-wrap:wrap}
  .about label{display:flex;align-items:center;gap:7px;font-size:12px;
    color:var(--faint)}
  .about label.grow{flex:1;min-width:240px}
  .about select,.about input{font:13px inherit;color:var(--ink);
    background:#0d1014;border:1px solid var(--line);border-radius:6px;
    padding:4px 9px}
  .about input{flex:1}
  .about select:hover,.about input:focus{border-color:var(--accent)}
  .about .hint{font-size:11px;color:var(--faint)}
  .film{display:flex;align-items:center;gap:10px;margin:12px 0}
  .film .grow{flex:1}
  .film .hint{font:11px var(--mono);color:var(--faint)}

  #pending{display:flex;align-items:center;gap:12px;margin:12px 0;
    padding:9px 14px;border-radius:9px;background:#2a2415;
    border:1px solid #5b4a22}
  #pending[hidden]{display:none}
  #pendingCount{font:12px var(--mono);color:#e2a33c}
  #pending .hint{font-size:11px;color:var(--faint);flex:1}
  .shape{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin:12px 0}
  .shape-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;
    background:#0d1014}
  .shape-bar i{display:flex;align-items:center;justify-content:center;
    height:100%;min-width:0}
  .shape-bar b{font:11px var(--mono);color:#0d1014;opacity:.85}
  .turn{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
  .turn-head{font-size:12px;display:flex;align-items:baseline;gap:10px;
    flex-wrap:wrap}
  .turn-lines{margin:8px 0;display:flex;flex-direction:column;gap:3px}
  .turn-lines div{font-size:13px;padding:4px 10px;border-radius:6px;
    border-left:3px solid transparent}
  .turn-lines .was{color:var(--faint);border-left-color:#3f9e73}
  .turn-lines .now{color:var(--ink);border-left-color:#c8543f;
    background:#2a1512}
  .turn-lines .now.next{background:transparent;color:var(--faint)}
  .turn-ask{font-size:11px;color:var(--faint);line-height:1.6}
  .turn-ask b{color:#ff8a72}
  .rights{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin:12px 0}
  .rights-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .rights-head b{font-size:13px}
  .rights-head .lead{font:13px var(--mono)}
  .rights-head .lead.good{color:#5fcf9b}
  .rights-head .lead.short{color:#ff8a72}
  .rights .bar{display:flex;height:13px;border-radius:7px;overflow:hidden;
    background:#0d1014}
  .rights .bar i{display:block;height:100%}
  .rights-keys{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;
    font:11px var(--mono);color:var(--faint)}
  .rights-keys i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:5px}
  .rights-keys b{color:var(--ink);margin-left:5px}
  .rights-keys em{font-style:normal;margin-left:4px}
  .holders{margin-top:7px;font:11px var(--mono);color:var(--faint)}
  .holders span{margin-right:12px}
  .holders b{color:#e0a; color:#e2a33c}
  .rights-why{margin:8px 0 0;font-size:11px;line-height:1.6;color:var(--faint)}
  #jobBar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    align-items:center;gap:12px;padding:9px 18px;background:var(--panel);
    border-top:1px solid var(--line)}
  #jobBar[hidden]{display:none}
  #jobBar b{font-size:13px;flex:none}
  #jobNote{font:12px var(--mono);color:var(--faint);flex:none;
    max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .job-track{flex:1;height:6px;border-radius:3px;background:#0d1014;
    overflow:hidden}
  .job-track i{display:block;height:100%;background:var(--accent);
    transition:width .3s}
  #jobClock{font:12px var(--mono);color:var(--faint);flex:none}
  #jobBar.failed{background:#2a1512;border-top-color:#5b2a22}
  #jobBar.failed .job-track i{background:#ef6b6b}

  .gather{display:flex;align-items:center;gap:10px;margin:10px 0}
  .gather > span{font-size:11px;color:var(--faint);flex:none}
  .gather input{flex:1}

  .doubted{margin:10px 0;padding:9px 14px;border-radius:9px;background:#2a2415;
    border:1px solid #5b4a22}
  .doubted-head{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .doubted-head b{font-size:12px;color:#e2a33c}
  .doubted-head .hint{font-size:11px;color:var(--faint)}
  .doubted-head .grow{flex:1}
  .doubt-row{display:flex;align-items:center;gap:9px;padding:2px 0;
    font-size:12px}
  .doubt-row .who{color:var(--faint);font:11px var(--mono);flex:none;
    width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doubt-row .what{color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}

  .wanted{display:flex;align-items:center;gap:11px;margin:10px 0;
    padding:8px 14px;border-radius:9px;background:#2a2415;
    border:1px solid #5b4a22;flex-wrap:wrap}
  .wanted > span{font-size:12px;color:#e2a33c;flex:none}
  .wanted-terms{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .wanted-terms code{font:11px var(--mono);color:var(--dim);background:#0d1014;
    border:1px solid var(--line);border-radius:5px;padding:1px 7px}
  .note-line{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .note-line span{font-size:11px;color:var(--faint);flex:none}
  .note-line input{flex:1;font:13px inherit;color:var(--dim);
    background:transparent;border:1px solid transparent;border-radius:6px;
    padding:3px 8px}
  .note-line input:hover{border-color:var(--line)}
  .note-line input:focus{border-color:var(--accent);background:#0d1014;
    color:var(--ink);outline:none}
  .who-for{display:flex;align-items:baseline;gap:12px;padding:10px 15px;
    margin-bottom:12px;background:#12212e;border:1px solid #244055;
    border-radius:9px}
  .who-for span{font-size:11px;color:var(--faint)}
  .who-for input{flex:1;font:15px inherit;color:#7fd4ff;background:transparent;
    border:1px solid transparent;border-radius:6px;padding:2px 8px}
  .who-for input:hover{border-color:#244055}
  .who-for input:focus{border-color:var(--accent);background:#0d1014;outline:none}
  .who-for input::placeholder{color:var(--faint);font-size:13px}
  .gauge{display:flex;gap:16px;flex-wrap:wrap;padding:12px 15px;margin-bottom:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .gauge div{font-size:12px;color:var(--dim)}
  .gauge b{display:block;font:18px var(--mono);font-variant-numeric:tabular-nums;
    color:var(--ink)}
  .gauge b.short{color:var(--warn)}
  .gauge b.good{color:var(--ok)}

  /* Who has been heard. The point is not the count -- it is whether the other
     side is in there at all, so an empty column is coloured, not just small. */
  .sides{display:flex;gap:6px;margin-bottom:14px}
  .sides div{flex:1;text-align:center;padding:8px 4px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);font-size:11px;
    color:var(--faint)}
  .sides div b{display:block;font:17px var(--mono);color:var(--ink);margin-bottom:2px}
  .sides div.none{border-color:#5c3a2a;background:#241a14}
  .sides div.none b{color:var(--warn)}

  #verdict{padding:11px 15px;border-radius:9px;margin-bottom:18px;font-size:13px}
  #verdict.ok{background:#12291f;border:1px solid #2c5a45;color:var(--ok)}
  #verdict.no{background:#241a14;border:1px solid #5c3a2a;color:var(--warn)}

  h3{margin:24px 0 8px;font-size:13px;color:var(--dim);
    display:flex;align-items:center;gap:8px}
  h3 .count{font:11px var(--mono);color:var(--faint)}
  h3 .count.lacking{color:var(--warn)}
  h3 .hint{font-size:11px;color:var(--faint);font-weight:400;margin-left:auto}
  .hunt{display:flex;gap:8px;margin-bottom:10px}
  .hunt input{flex:1;font-size:13px}
  /* Candidates, not material: clicking one is what keeps it. */
  #caught .shelf figure{cursor:pointer}
  #caught .shelf figure:hover{border-color:var(--ok)}
  #caught .shelf figure.taken{opacity:.4;pointer-events:none}
  .src{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin-bottom:7px;font-size:13px}
  .src .who{font:11px var(--mono);color:var(--faint);margin-top:3px}
  .src .fact{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
  .lean{font-size:10px;padding:1px 7px;border-radius:99px;margin-left:6px;
    border:1px solid var(--line);color:var(--dim)}
  .lean.left{color:#7fb4ff;border-color:#2d4a70}
  .lean.right{color:#ff9d7f;border-color:#6b3f2e}
  .lean.neutral{color:var(--ok);border-color:#2c5a45}
  /* A lead is something seen in a channel listing: known to exist, not yet
     fetched or read. Dashed, so it never reads as material already in hand. */
  .src.lead{border-style:dashed;background:transparent}
  .src.written{cursor:pointer;border-color:#2c5a45;background:#12291f}
  .src.written:hover{border-color:var(--ok)}
  .src.written b{font-size:15px;pointer-events:none}
  .src.written .who{pointer-events:none}
  .voice{font-size:12px;color:var(--dim);padding:6px 0;line-height:1.6;
    border-top:1px solid #1c242e}
  .voice .likes{font:11px var(--mono);color:var(--faint);margin-right:9px}
  .empty{color:var(--faint);font-size:13px;padding:14px;text-align:center;
    border:1px dashed var(--line);border-radius:9px}
  /* ---- one script, laid out as it will be spoken ---- */
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:left;font-size:11px;color:var(--faint);font-weight:500;
    padding:0 10px 7px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
  tr:hover td{background:#161d25}
  td.at{font:11px var(--mono);color:var(--faint);white-space:nowrap;width:5.4em}
  td.say{font-size:15px;line-height:1.55}
  /* The picture beside the line it belongs to: the two were chosen together
     and should be read together. */
  td.show{font-size:12px;color:var(--dim);width:30%}
  /* The picture's own words, under the label the writer typed. When they
     disagree the label is the one that is wrong, and this is where that
     shows. */
  td.show .grabbed{display:block;font:10px var(--mono);color:var(--faint);
    line-height:1.4;margin-top:3px}
  .seen-box{display:inline-flex;align-items:center;gap:5px;margin-top:5px;
    font:11px var(--mono);color:#e2a33c;border:1px solid #6b4d17;
    border-radius:5px;padding:1px 7px;cursor:pointer;user-select:none}
  .seen-box.on{color:#5fcf9b;border-color:#2c5a45}
  .seen-box input{margin:0;accent-color:#5fcf9b}
  td.show video.pic{width:100%;max-width:210px;height:82px;object-fit:cover;
    display:block;border-radius:6px;background:#0d1014;margin-bottom:4px}
  td.show{cursor:zoom-in}
  .shelf figure{cursor:zoom-in}
  td.show img.pic.drawn{object-fit:contain;background:#0d1b2a;
    border:1px solid #22405c}
  td.show .grabbed.bad{color:#ff8a72}
  td.show img.pic{width:100%;max-width:210px;height:82px;object-fit:cover;
    border-radius:6px;display:block;margin-bottom:5px;background:#0d1014}
  td.from{font-size:11px;color:var(--faint);width:11em}
  td.from.ours{color:var(--accent)}
  .ruler{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;
    margin:14px 0 4px;border:1px solid var(--line);display:flex}
  .ruler i{display:block;height:100%;border-right:1px solid #0b0e12}
  .ruler i:nth-child(odd){background:var(--accent)}
  .ruler i:nth-child(even){background:#4a86cc}
  #note{font-size:13px;margin-top:14px}
  #note.bad{color:var(--danger)}
  #note.warn{color:var(--warn)}
</style>

<header>
  <h1>題目</h1>
  <span class="where">先收集，再寫</span>
  <span class="grow"></span>
  <input id="newName" placeholder="新題目…" size="16">
  <button id="btnNew" class="tiny">新增</button>
  <button id="btnHouses" class="tiny">公版</button>
  <button id="btnBack" class="tiny">← 回編輯器</button>
</header>

<!-- The house styles themselves. They began as two files I wrote by hand,
     which makes "what shapes a short can be" something only somebody editing
     the repository can change. They are data. -->
<!-- One long task at a time, and it says what it is doing. Gathering and
     rendering both took minutes and both ran only from the command line,
     which meant the page could not do half of what the pipeline does. -->
<div id="jobBar" hidden>
  <b id="jobWhat"></b>
  <span id="jobNote"></span>
  <div class="job-track"><i id="jobFill"></i></div>
  <span id="jobClock"></span>
</div>

<div id="houses" hidden>
  <div class="houses-inner">
    <div class="houses-bar">
      <b>公版</b>
      <span class="hint">一個公版說的是「這種片子長什麼形狀」。
        沒寫的項目會掉回 rules.json 的共用值</span>
      <button id="housesClose" class="tiny">關閉</button>
    </div>
    <div id="housesList"></div>
    <div class="houses-new">
      <input id="newHouseKey" placeholder="代號（英文，如 explain）" size="18">
      <input id="newHouseName" placeholder="名稱（如 拆解說明）" size="14">
      <button id="btnNewHouse" class="tiny primary">新增公版</button>
    </div>
  </div>
</div>

<main>
  <div id="list"></div>
  <div id="paper"><div class="empty">左邊選一個題目</div></div>
</main>

<div id="big" hidden>
  <div class="big-inner">
    <div class="big-bar">
      <b id="bigWho"></b><span id="bigWhat"></span>
      <button id="bigClose" class="tiny">關閉</button>
    </div>
    <div id="bigStage"></div>
    <div id="bigNote"></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const escapeHTML = (text) => String(text).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const STATE = { list: [], want: { videos: 5, reports: 5 }, chosen: null };

/* Three kinds of picture because they cover different holes: stock stands in
   for the abstract, Commons has the actual person and place, and a frame is
   the event as it was broadcast. None substitutes for another. */
const WHERE_FROM = {
  stock: "Pexels，可商用免標示。用在抽象的東西——帳單、電表、排隊",
  real: "Wikimedia Commons，多為 CC BY／BY-SA，出處要上畫面。用在有名字的人事地",
  frame: "從這個題目自己的新聞影片剪的。算在 25% 的引用額度裡",
};

/* Watching a job. Asked for rather than pushed, because both tasks are minutes
   long and a page that goes quiet for four minutes looks broken. */
let JOB_TIMER = null;
async function watchJob(whenDone) {
  const tick = async () => {
    let job;
    try { job = await api("GET", "/api/job"); } catch (error) { return; }
    const bar = $("jobBar");
    bar.hidden = job.state !== "running" && job.state !== "failed";
    $("jobWhat").textContent = job.what || "";
    $("jobNote").textContent = job.note || "";
    $("jobClock").textContent = job.seconds ? `${Math.round(job.seconds)}s` : "";
    $("jobFill").style.width =
      job.steps ? `${(job.step / job.steps) * 100}%` : "0%";
    bar.classList.toggle("failed", job.state === "failed");
    if (job.state === "running") return;
    clearInterval(JOB_TIMER); JOB_TIMER = null;
    if (job.state === "done" && whenDone) whenDone();
  };
  clearInterval(JOB_TIMER);
  await tick();
  JOB_TIMER = setInterval(tick, 1500);
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `${path} 失敗`);
  return data;
}

function clock(seconds) {
  seconds = Math.max(0, seconds || 0);
  return `${Math.floor(seconds / 60)}:${(seconds % 60).toFixed(1).padStart(4, "0")}`;
}

function leanTag(lean) {
  const which = /left/.test(lean) ? "left" : /right/.test(lean) ? "right"
              : lean === "neutral" ? "neutral" : "";
  return lean ? `<span class="lean ${which}">${escapeHTML(lean)}</span>` : "";
}

function renderList() {
  $("list").innerHTML = STATE.list.map((item) => `
    <div class="item ${item.name === STATE.chosen ? "on" : ""}"
         data-name="${escapeHTML(item.name)}">
      <b>${escapeHTML(item.name)}</b>
      <span class="facts">影片 ${item.counts.videos}/${STATE.want.videos}　`
      + `報導 ${item.counts.reports}/${STATE.want.reports}　事實 ${item.facts} 條</span>
      ${item.ready ? '<span class="facts" style="color:var(--ok)">素材夠了</span>'
                   : `<span class="facts bad">${escapeHTML(item.why)}</span>`}
      ${item.leads ? `<span class="facts">線索 ${item.leads} 條</span>` : ""}
      ${item.scripts.length
        ? `<span class="facts">文案 ${item.scripts.length} 份</span>` : ""}
    </div>`).join("") || '<div class="empty">還沒有題目</div>';
}

function voiceCount(pile) {
  return (pile.voices || []).reduce((sum, one) => sum + (one.comments || []).length, 0);
}

/** What people said underneath, loudest first. No names: we want what was
 *  said, not who said it. */
function voiceRows(voices) {
  if (!voices || !voices.length) {
    return '<div class="empty">還沒抓留言</div>';
  }
  return voices.map((one) => `
    <div class="src">
      <div class="who">${escapeHTML(one.outlet || "")}　${
        escapeHTML(one.title || "")}　${(one.comments || []).length} 則</div>
      ${(one.comments || []).slice(0, 12).map((said) => `
        <div class="voice"><span class="likes">▲${said.likes}</span>${
          escapeHTML(said.say)}</div>`).join("")}
      ${(one.comments || []).length > 12
        ? `<div class="who">…另外 ${one.comments.length - 12} 則</div>` : ""}
    </div>`).join("");
}

function sourceRows(items, kind) {
  if (!items || !items.length) {
    return `<div class="empty">還沒有${kind}</div>`;
  }
  return items.map((item) => `
    <div class="src">
      ${item.url ? `<a href="${escapeHTML(item.url)}" target="_blank">${
        escapeHTML(item.title || item.url)}</a>` : escapeHTML(item.title || "")}
      ${leanTag(item.lean || "")}
      <div class="who">${escapeHTML(item.outlet || "")}${
        item.seconds ? `　${Math.round(item.seconds / 60)} 分` : ""}${
        item.captions ? "　有字幕" : ""}${
        item.use ? `　用 ${item.use.map((w) => `${w[0]}–${w[1]}s`).join("、")}` : ""}${
        item.note ? `　${escapeHTML(item.note)}` : ""}</div>
      ${(item.facts || []).length
        ? `<div class="fact">${item.facts.map(escapeHTML).join("　·　")}</div>` : ""}
    </div>`).join("");
}

async function open(name) {
  STATE.chosen = name;
  renderList();
  let pile;
  try { pile = await api("GET", `/api/topic?name=${encodeURIComponent(name)}`); }
  catch (error) { $("paper").innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`; return; }

  const got = pile.counts.got, want = pile.counts.want, sides = pile.balance.sides;
  const columns = [["left", "左"], ["neutral", "中立"], ["right", "右"],
                   ["other", "其他"]];

  $("paper").innerHTML = `
    <h2>${escapeHTML(pile.topic || name)}</h2>
    <!-- Why this topic, and what to watch for. The one thing here nothing can
         compute: whether the opposition is easy to find is in the balance
         panel; that a medical topic cannot be monetised with an AI voice is
         not anywhere else, and it decides whether the film gets made. -->
    <div class="note-line">
      <span>挑這題的理由</span>
      <input id="topicNote" value="${escapeHTML(pile.note || "")}"
        placeholder="為什麼值得花九十秒？有什麼坑？" spellcheck="false">
    </div>
    <!-- Who the ending has to land on. Not always everyone: for a market
         story it is a shareholder, and his contact point is a balance. -->
    <!-- Decided, not guessed. The keyword table is offered as a button; it
         used to be printed here as though it were the answer, and it said a
         piece about studios being bought was for people whose jobs AI might
         take. A field that arrives filled in is a field nobody reads. -->
    <div class="who-for">
      <span>說給誰聽</span>
      <input id="topicWho" value="${escapeHTML(pile.audience || "")}"
        placeholder="還沒決定 —— 結尾整段會寫給這群人聽" spellcheck="false">
      ${pile.audience_guess && pile.audience !== pile.audience_guess
        ? `<button id="btnGuessWho" class="tiny"
             title="從題目關鍵字猜的，不一定對">用「${
             escapeHTML(pile.audience_guess)}」</button>` : ""}
    </div>

    <div class="gauge">
      <div>影片<b class="${got.videos >= want.videos ? "good" : "short"}">${
        got.videos} / ${want.videos}</b></div>
      <div>報導<b class="${got.reports >= want.reports ? "good" : "short"}">${
        got.reports} / ${want.reports}</b></div>
      <div>照片<b class="${got.images >= want.images ? "good" : "short"}">${
        got.images} / ${want.images}</b></div>
      <div>原始數據<b>${got.data}</b></div>
      <div>整理出的事實<b>${(pile.facts || []).length}</b></div>
      <div>鄉民留言<b>${voiceCount(pile)}</b></div>
    </div>

    <div class="sides">
      ${columns.map(([key, label]) => `
        <div class="${sides[key] ? "" : "none"}">
          <b>${sides[key]}</b>${label}
        </div>`).join("")}
    </div>

    <div id="verdict" class="${pile.ready ? "ok" : "no"}">
      ${pile.ready ? "素材夠了，可以寫文案。"
                   : `還不能寫：${escapeHTML(pile.why)}`}
    </div>

    <!-- The per-outlet round: ask nineteen named outlets what they said,
         download what they gave, cut frames where the captions point. This is
         the argument the whole project rests on and it ran only from a
         terminal. -->
    <div class="gather">
      <span>收集</span>
      <input id="hunt" placeholder="英文搜尋詞，逗號分隔（如 museum theft, stolen painting）"
        spellcheck="false">
      <button id="btnTerms" class="tiny">想幾個</button>
      <button id="btnGather" class="tiny primary">逐家問（影片＋報導＋圖）</button>
    </div>
    <div id="termsNote" class="hint"></div>

    ${(pile.doubted || []).length ? `
    <!-- A model's opinion, held for a decision. Deleting on it loses both the
         source and the fact that anything was judged: the count simply reads
         lower and looks like a search that found less. -->
    <div class="doubted">
      <div class="doubted-head">
        <b>模型覺得這 ${pile.doubted.length} 篇跟題目無關</b>
        <span class="hint">還留著，也還沒算進計數。掃一遍，撿回判錯的</span>
        <span class="grow"></span>
        <button id="btnDropAll" class="tiny">其餘全部丟</button>
      </div>
      ${pile.doubted.map((one) => `
        <div class="doubt-row" data-url="${escapeHTML(one.url || "")}">
          <button class="tiny keep">留</button>
          <span class="who">${escapeHTML(one.outlet || "")}</span>
          <span class="what">${escapeHTML(one.title || "")}</span>
        </div>`).join("")}
    </div>` : ""}

    ${(pile.wanted || []).length ? `
    <!-- What the audience implies and the pile does not have. The counts say
         this topic has enough pictures; they cannot say it has nothing to end
         on, because the ending is aimed at a group of people and thirty
         pictures of the subject satisfy a number either way. -->
    <div class="wanted">
      <span>結尾會需要，但還沒收到</span>
      <div class="wanted-terms">${pile.wanted.map((one) =>
        `<code>${escapeHTML(one)}</code>`).join("")}</div>
      <button id="btnWanted" class="tiny">抓這幾個</button>
    </div>` : ""}

    <div style="display:flex;gap:8px;align-items:center">
      <!-- Chosen before writing, not corrected afterwards. The shape decides
           the roles, the pacing, the borrowed ceiling and which prompt is
           sent, so picking it after the fact means every line has to be
           relabelled -- which is what happened to Messina. -->
      <label class="pick-house">寫成
        <select id="writeAs">
          ${(FORMATS.length ? FORMATS : [{key: "argue", name: "新聞報導"}])
            .map((one) => `<option value="${escapeHTML(one.key)}">${
              escapeHTML(one.name || one.key)}</option>`).join("")}
        </select>
      </label>
      <button id="btnWrite" class="primary" ${pile.ready ? "" : "disabled"}>產生文案</button>
      ${pile.ready ? "" : '<button id="btnAnyway" class="tiny">素材不齊也要寫</button>'}
      <span id="whyHouse" class="hint"></span>
      <span style="flex:1"></span>
    </div>
    <div id="note"></div>

    ${(pile.scripts || []).length ? `
      <h3>寫好的文案 <span class="count">${pile.scripts.length} 份</span></h3>
      ${pile.scripts.map((one) => `
        <div class="src written" data-script="${escapeHTML(one.name || one)}">
          <b>${escapeHTML(one.name || one)}</b>
          ${one.house ? `<span class="house ${
            one.format === "story" ? "story" : "argue"}">${
            escapeHTML(one.house)}</span>` : ""}
          <div class="who">${one.seconds
            ? `${one.seconds}s　${one.lines} 句　點開來看逐句台詞`
            : "點開來看逐句台詞"}</div>
        </div>`).join("")}` : ""}

    ${(pile.leads || []).length ? `
      <h3>線索 <span class="count">${pile.leads.length} 條，還沒抓回來</span></h3>
      ${pile.leads.map((lead) => `
        <div class="src lead">
          ${escapeHTML(lead.title || "")}${leanTag(lead.lean || "")}
          <div class="who">${escapeHTML(lead.outlet || "")}</div>
        </div>`).join("")}` : ""}

    <h3>影片 <span class="count">${got.videos} / ${want.videos}</span></h3>
    ${sourceRows(pile.sources.videos, "影片")}
    <h3>報導 <span class="count">${got.reports} / ${want.reports}</span></h3>
    ${sourceRows(pile.sources.reports, "報導")}
    <h3>原始數據 <span class="count">${got.data}</span></h3>
    ${sourceRows(pile.sources.data, "數據")}
    <h3>臨時要找一張
      <span class="hint">寫文案時想到什麼就打什麼，英文</span></h3>
    <div class="hunt">
      <input id="want" placeholder="例如：Trump wearing a hat" spellcheck="false">
      <button id="btnFind" class="tiny">找</button>
    </div>
    <div id="caught"></div>

    ${["stock", "real", "frame"].map((kind) => {
      const spec = pile.counts.pictures[kind];
      const shown = (pile.sources.images || []).filter(
        (one) => (one.kind || "stock") === kind);
      return `
      <h3>${escapeHTML(spec.label)}
        <span class="count ${spec.short ? "lacking" : ""}">${spec.have} / ${
          spec.want}${spec.short ? `　還缺 ${spec.short}` : ""}</span>
        <span class="hint">${WHERE_FROM[kind]}</span></h3>
      ${shown.length ? `<div class="shelf">${shown.map((one) => `
        <figure data-shot="${escapeHTML(JSON.stringify({
            say: "", show: one.term || "",
            pic: `/media/photo/${encodeURIComponent(name)}/${
              encodeURIComponent((one.file || "").split("/").pop())}`,
            caption: one.caption || "", credit: one.credit || "",
            from: one.outlet || "",
          }))}" title="點開來看">
          <img src="/media/photo/${encodeURIComponent(name)}/${
            encodeURIComponent((one.file || "").split("/").pop())}"
            alt="" loading="lazy">
          <figcaption class="asked">${escapeHTML(
            one.at != null ? `${Math.round(one.at)}s　${one.outlet || ""}`
                           : one.term || "")}</figcaption>
          <figcaption class="got">${escapeHTML(one.caption || "（沒有說明）")}</figcaption>
          ${one.credit ? `<figcaption class="who">${escapeHTML(one.credit)}</figcaption>` : ""}
        </figure>`).join("")}</div>`
        : `<div class="empty">還沒有${escapeHTML(spec.label)}</div>`}`;
    }).join("")}

    <h3>鄉民反應 <span class="count">${voiceCount(pile)} 則</span>
      <button id="btnVoices" class="tiny">抓留言</button></h3>
    ${voiceRows(pile.voices)}

    <h3>整理出的事實 <span class="count">${(pile.facts || []).length}</span></h3>
    ${(pile.facts || []).length
      ? (pile.facts || []).map((fact) => `
          <div class="src">${escapeHTML(fact.say)}
            <div class="who">${escapeHTML(fact.from || "")}</div></div>`).join("")
      : '<div class="empty">還沒有整理</div>'}`;

  const write = async (anyway) => {
    $("note").className = "";
    $("note").textContent = "寫稿中…";
    try {
      const made = await api("POST", "/api/topic/script",
                             { name, anyway, format: $("writeAs").value });
      $("note").textContent = `寫好了：${made.script}`;
    } catch (error) {
      $("note").className = "warn";
      $("note").textContent = error.message;
    }
  };
  /* Ask for one shot and look at what comes back. Nothing is kept until it is
     clicked -- a specific request is usually specific about how it should look
     as well as what is in it. */
  const hunt = async () => {
    const want = $("want").value.trim();
    if (!want) return;
    $("caught").innerHTML = '<div class="empty">找…</div>';
    let got;
    try { got = await api("POST", "/api/topic/find", { want }); }
    catch (error) {
      $("caught").innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`;
      return;
    }
    if (!got.found.length) {
      $("caught").innerHTML = '<div class="empty">兩邊都沒有。換個說法試試</div>';
      return;
    }
    $("caught").innerHTML = `
      <div class="shelf">${got.found.map((one, index) => `
        <figure data-catch="${index}" title="點一下收進來　${
          escapeHTML(one.caption || "")}">
          <img src="${escapeHTML(one.url)}" alt="" loading="lazy">
          <figcaption>${one.kind === "real" ? "真實" : "示意"}　${
            escapeHTML(one.author || one.outlet)}</figcaption>
        </figure>`).join("")}</div>`;
    $("caught").querySelectorAll("[data-catch]").forEach((card) => {
      card.onclick = async () => {
        card.classList.add("taken");
        try {
          await api("POST", "/api/topic/keep",
                    { name, want, picture: got.found[Number(card.dataset.catch)] });
          $("note").className = "";
          $("note").textContent = "收下了。重新整理這一頁就會出現在下面";
        } catch (error) {
          card.classList.remove("taken");
          $("note").className = "bad";
          $("note").textContent = error.message;
        }
      };
    });
  };
  if ($("btnFind")) $("btnFind").onclick = hunt;
  if ($("want")) $("want").addEventListener("keydown", (event) => {
    if (event.key === "Enter") hunt();
  });

  if ($("btnVoices")) $("btnVoices").onclick = async () => {
    $("btnVoices").disabled = true;
    $("btnVoices").textContent = "抓取中…";
    try {
      const got = await api("POST", "/api/topic/voices", { name });
      open(name);
      $("note").textContent = `抓了 ${got.added} 則，共 ${got.total} 則`;
    } catch (error) {
      $("btnVoices").disabled = false;
      $("btnVoices").textContent = "抓留言";
      $("note").className = "bad";
      $("note").textContent = error.message;
    }
  };
  // Each shape says in its own file why it exists; show that beside the
  // chooser, because "新聞報導 or 說故事" is not a choice anybody can make from
  // the two words alone.
  const writeAs = $("writeAs");
  if (writeAs) {
    const sayWhy = () => {
      const spec = FORMATS.find((one) => one.key === writeAs.value) || {};
      $("whyHouse").textContent = spec.why || "";
    };
    writeAs.onchange = sayWhy;
    sayWhy();
  }
  // Who this topic is for. Stored on the topic, and copied into a script when
  // one is written -- a topic can yield two shorts for two audiences, so the
  // script keeps its own once it exists.
  const noteBox = $("topicNote");
  if (noteBox) {
    noteBox.dataset.was = noteBox.value;
    const saveNote = async () => {
      if (noteBox.value.trim() === noteBox.dataset.was) return;
      try {
        await api("POST", "/api/topic/note",
                  {name, note: noteBox.value.trim()});
        noteBox.dataset.was = noteBox.value.trim();
      } catch (error) { alert(error.message); noteBox.value = noteBox.dataset.was; }
    };
    noteBox.addEventListener("blur", saveNote);
    noteBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); noteBox.blur(); }
      if (event.key === "Escape") { noteBox.value = noteBox.dataset.was; noteBox.blur(); }
    });
  }

  const who = $("topicWho");
  if (who) {
    who.dataset.was = who.value;
    const saveWho = async () => {
      if (who.value.trim() === who.dataset.was) return;
      try {
        await api("POST", "/api/topic/audience",
                  {name, audience: who.value.trim()});
        who.dataset.was = who.value.trim();
        open(name);
      } catch (error) { alert(error.message); who.value = who.dataset.was; }
    };
    who.addEventListener("blur", saveWho);
    who.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); who.blur(); }
      if (event.key === "Escape") { who.value = who.dataset.was; who.blur(); }
    });
  }
  if ($("btnGuessWho")) $("btnGuessWho").onclick = async () => {
    try {
      await api("POST", "/api/topic/audience",
                {name, audience: pile.audience_guess});
      open(name);
    } catch (error) { alert(error.message); }
  };

  // The picture terms ride along with the video ones: one suggestion, one
  // gather. Kept here rather than in a second box because they are not a
  // separate decision -- both come from the same reading of the topic.
  TERMS.pictures = [];
  // Suggested, then shown, then used. Putting the terms in the box rather
  // than searching with them straight away is the difference between a
  // suggestion and a decision somebody else made -- and these terms decide
  // which nineteen answers come back.
  if ($("btnTerms")) $("btnTerms").onclick = async () => {
    $("termsNote").textContent = "想中…";
    try {
      const got = await api("POST", "/api/topic/terms", {name});
      $("hunt").value = got.videos.join(", ");
      TERMS.pictures = got.pictures || [];
      $("termsNote").textContent = got.pictures.length
        ? `圖庫的詞：${got.pictures.join("、")}（收集完會用到）　${got.took}s`
        : `${got.took}s`;
    } catch (error) { $("termsNote").textContent = error.message; }
  };
  // Ruling on what the model doubted. Keeping is one click each because that
  // is the direction worth making easy -- a wrongly dropped source is a fact
  // that stops existing, a wrongly kept one is a line in a list.
  $("paper").querySelectorAll(".doubt-row .keep").forEach((button) => {
    button.onclick = async () => {
      const row = button.closest(".doubt-row");
      try {
        await api("POST", "/api/topic/judge",
                  {name, urls: [row.dataset.url], keep: true});
        open(name);
      } catch (error) { alert(error.message); }
    };
  });
  if ($("btnDropAll")) $("btnDropAll").onclick = async () => {
    const urls = [...$("paper").querySelectorAll(".doubt-row")]
      .map((row) => row.dataset.url);
    if (!confirm(`丟掉這 ${urls.length} 篇？`)) return;
    try {
      await api("POST", "/api/topic/judge", {name, urls, keep: false});
      open(name);
    } catch (error) { alert(error.message); }
  };
  if ($("btnGather")) $("btnGather").onclick = async () => {
    const queries = $("hunt").value.trim();
    if (!queries) { alert("要給搜尋詞"); return; }
    try {
      await api("POST", "/api/topic/gather",
                {name, queries, pictures: TERMS.pictures.join(", ")});
      watchJob(() => open(name));
    } catch (error) { alert(error.message); }
  };
  if ($("btnWanted")) $("btnWanted").onclick = async () => {
    $("note").className = ""; $("note").textContent = "抓圖中…";
    try {
      const back = await api("POST", "/api/topic/images",
                             {name, terms: pile.wanted, where: "stock"});
      $("note").textContent = `收了 ${back.added} 張`;
      open(name);
    } catch (error) {
      $("note").className = "warn"; $("note").textContent = error.message;
    }
  };
  if ($("btnWrite")) $("btnWrite").onclick = () => write(false);
  if ($("btnAnyway")) $("btnAnyway").onclick = () => write(true);
}

/* ---------- one script ----------
   The same page, because a script is only ever read next to the pile it came
   from: every line names its source, and the source list is one click away. */
/* Who owns what is on screen, as a share of the running time.

   "Borrowed" was the wrong number to watch. A stock photograph is borrowed
   and carries no risk whatever; a five-second clip of a broadcast is a
   quotation of somebody else's copyright and is the only part that can cost
   the channel anything. Those two were being added together, so the figure
   that mattered was hidden inside a larger one that did not. */
const RIGHT_COLOUR = {ours: "#4f8ef0", free: "#3f9e73",
                      credit: "#c9973a", claimed: "#c8543f"};
const RIGHT_NOTE = {
  ours: "我們自己畫的，沒有人能主張",
  free: "圖庫或公有領域，可商用且不必標示",
  credit: "CC BY／BY-SA：作者和授權條款必須出現在畫面上",
  claimed: "別人的著作權，以引用主張合理使用",
};

/* Hand edits are held until they are saved.

   Every keystroke used to reach disk, which meant there was no such thing as
   an unsaved change: a half-finished thought was already the script and
   leaving the page could not undo it. Edits now collect here, the button says
   how many are waiting, and going anywhere else drops them.

   Order is checked on the way in, not on the way out: 合 in front of 轉 is
   refused by the server with the whole set in hand, because a role moved on
   its own looks fine and the sequence it lands in does not. */
const PENDING = {name: null, changes: new Map()};
const TERMS = {pictures: []};

/* Editing the house styles.

   Every field here is a threshold that used to be a constant somewhere, and
   the one that matters most is `why`. A number without its reason gets
   changed by whoever finds it inconvenient; with the reason attached, the
   next person at least knows what they are trading away. The tone-run limit
   of twelve was written for an argument's short sections and reported a story
   as broken by design -- that is the kind of thing `why` is for. */
function houseRow(one) {
  const s = one.structure || {}, b = one.borrowed || {},
        c = one.cards || {}, e = one.ending || {};
  const roles = (s.roles || []).join("、");
  return `
  <div class="house-card" data-key="${escapeHTML(one.key)}">
    <div class="house-head">
      <input class="h-name" value="${escapeHTML(one.name || "")}" size="10">
      <code>${escapeHTML(one.key)}</code>
      <span class="grow"></span>
      <button class="tiny h-save">儲存</button>
      ${one.key === "argue" ? "" : `<button class="tiny h-drop">刪除</button>`}
    </div>
    <label class="wide">為什麼有這個公版
      <textarea class="h-why" rows="3">${escapeHTML(one.why || "")}</textarea></label>
    <div class="house-grid">
      <label class="wide">角色（照順序，用、分隔）
        <input class="h-roles" value="${escapeHTML(roles)}"></label>
      <label>每段最少幾句
        <input class="h-least" value="${escapeHTML(
          Object.values(s.least_per_role || {}).join("、"))}"
          placeholder="照角色順序"></label>
      <label>第三個角色要在幾成之前
        <input class="h-turn" value="${s.turn_before ?? 0}"
          placeholder="0 = 不限"></label>
      <label>實拍目標
        <input class="h-aim" value="${b.aim ?? 0.25}"></label>
      <label>實拍上限
        <input class="h-most" value="${b.most ?? 0.35}"></label>
      <label>會動的至少佔實拍
        <input class="h-clip" value="${b.clip_least ?? 0.5}"></label>
      <label>同一種卡片連幾張
        <input class="h-kind" value="${c.same_kind_run ?? 3}"></label>
      <label>同一色調連幾張
        <input class="h-tone" value="${c.same_tone_run ?? 12}"></label>
      <label>結尾摘要幾條
        <input class="h-points" value="${(e.points || [3, 4]).join("、")}"></label>
      <label>結尾落在
        <input class="h-landing" value="${escapeHTML(e.landing || "")}"
          placeholder="市井小民 / 懸念"></label>
      <label>用哪一份 prompt
        <input class="h-prompt" value="${escapeHTML(one.prompt || "script.md")}"></label>
    </div>
  </div>`;
}

function readHouse(card) {
  const get = (cls) => card.querySelector("." + cls).value.trim();
  const nums = (text) => text.split(/[、,\s]+/).filter(Boolean).map(Number);
  const roles = get("h-roles").split(/[、,\s]+/).filter(Boolean);
  const least = nums(get("h-least"));
  return {
    name: get("h-name"), why: get("h-why"),
    structure: {
      roles,
      turn_before: Number(get("h-turn")) || 0,
      least_per_role: Object.fromEntries(
        roles.map((role, index) => [role, least[index] ?? 2])),
    },
    borrowed: {aim: Number(get("h-aim")), most: Number(get("h-most")),
               clip_least: Number(get("h-clip"))},
    cards: {same_kind_run: Number(get("h-kind")),
            same_tone_run: Number(get("h-tone"))},
    ending: {kind: "outro", points: nums(get("h-points")),
             landing: get("h-landing")},
    prompt: get("h-prompt"),
  };
}

async function drawHouses() {
  try { FORMATS = (await api("GET", "/api/formats")).formats || []; }
  catch (error) { alert(error.message); return; }
  $("housesList").innerHTML = FORMATS.map(houseRow).join("");
  $("housesList").querySelectorAll(".house-card").forEach((card) => {
    const key = card.dataset.key;
    card.querySelector(".h-save").onclick = async () => {
      try {
        await api("POST", "/api/format", {key, spec: readHouse(card)});
        drawHouses();
      } catch (error) { alert(error.message); }
    };
    const drop = card.querySelector(".h-drop");
    if (drop) drop.onclick = async () => {
      if (!confirm(`刪掉「${key}」？`)) return;
      try {
        await api("DELETE", `/api/format?key=${encodeURIComponent(key)}`);
        drawHouses();
      } catch (error) { alert(error.message); }
    };
  });
}

$("btnHouses").onclick = () => { $("houses").hidden = false; drawHouses(); };
$("housesClose").onclick = () => { $("houses").hidden = true; };
$("houses").addEventListener("click", (event) => {
  if (event.target.id === "houses") $("houses").hidden = true;
});
$("btnNewHouse").onclick = async () => {
  const key = $("newHouseKey").value.trim();
  const name = $("newHouseName").value.trim();
  if (!key || !name) { alert("代號和名稱都要填"); return; }
  // A new shape starts as a copy of the argument, because starting from blank
  // means filling in eleven numbers before anything can be checked at all.
  const base = FORMATS.find((one) => one.key === "argue") || {};
  try {
    await api("POST", "/api/format",
              {key, spec: {...JSON.parse(JSON.stringify(base)), key: undefined,
                           name, why: "（還沒寫為什麼有這個公版）"}});
    $("newHouseKey").value = ""; $("newHouseName").value = "";
    drawHouses();
  } catch (error) { alert(error.message); }
};

/* The house styles, fetched once. A short is not one shape, and which shape
   this one is decides what the checks even mean -- an argument's roles are
   meaningless words to a story. */
let FORMATS = [];
api("GET", "/api/formats")
  .then((back) => { FORMATS = back.formats || []; })
  .catch(() => {});

function pendingKey(index, field) { return `${index}:${field}`; }

function markPending(index, field, value) {
  PENDING.changes.set(pendingKey(index, field), {line: index, [field]: value});
  drawPending();
}

function dropPending() {
  PENDING.changes.clear();
  PENDING.name = null;
}

function drawPending() {
  const bar = $("pending");
  if (!bar) return;
  const count = PENDING.changes.size;
  bar.hidden = count === 0;
  if (count) $("pendingCount").textContent = `${count} 處未儲存`;
}

async function savePending() {
  if (!PENDING.changes.size) return;
  const name = PENDING.name;
  try {
    await api("POST", "/api/script/lines",
              {name, changes: [...PENDING.changes.values()]});
    dropPending();
    showScript(name);
  } catch (error) { alert(error.message); }
}

/* 起承轉合, laid out so it can be judged rather than counted.

   The program can prove a line is labelled 轉 and sits in the first third; it
   cannot tell whether anything was reversed. Restating the setup more loudly
   passes every check. So the page shows the turn on its own, with the belief
   it is supposed to overturn directly above it, which is the only form in
   which the question "did the understanding change" can actually be asked. */
const ROLE_COLOUR = {起: "#4f8ef0", 承: "#3f9e73", 轉: "#c8543f", 合: "#c9973a"};

function shapePanel(sums) {
  const lines = sums.lines || [];
  if (!lines.some((line) => line.role)) return "";
  const clock = sums.seconds || 1;
  const runs = [];
  lines.forEach((line) => {
    const last = runs[runs.length - 1];
    if (last && last.role === line.role) { last.seconds += line.seconds; last.n += 1; }
    else runs.push({role: line.role, seconds: line.seconds, n: 1, at: line.at});
  });
  // The third role is the one nothing can check: the reversal in an argument,
  // the doubts in a story. Named from the format rather than written in, since
  // the two vocabularies share no words.
  const roles = sums.roles || ["起", "承", "轉", "合"];
  const pivot = roles[2];
  const turn = lines.find((line) => line.role === pivot);
  const before = lines.filter((line) => line.at < (turn ? turn.at : 0)).slice(-2);
  const after = turn ? lines.slice(lines.indexOf(turn), lines.indexOf(turn) + 2) : [];
  const story = pivot === "疑點";
  return `
  <div class="shape">
    <div class="shape-bar">${runs.map((run) => `
      <i style="width:${(run.seconds / clock) * 100}%;background:${
        ROLE_COLOUR[run.role] || "#555"}"
        title="${escapeHTML(run.role)}　${run.n} 句　${run.seconds.toFixed(1)}s">
        <b>${escapeHTML(run.role || "")}</b></i>`).join("")}</div>
    ${turn ? `
    <div class="turn">
      <div class="turn-head">${story
        ? "這個「疑點」有替觀眾想完嗎？" : "這個「轉」翻轉了什麼？"}
        <span class="hint">${story
          ? "程式只證明它被標成疑點。有沒有留白給觀眾，只有讀的人知道"
          : "程式只證明它被標成轉、而且在前三分之一。有沒有翻轉只有讀的人知道"}</span></div>
      <div class="turn-lines">
        ${before.map((line) => `<div class="was">${escapeHTML(line.role)}　${
          escapeHTML(line.say)}</div>`).join("")}
        ${after.map((line, index) => `<div class="now${index ? " next" : ""}">${
          escapeHTML(line.role)}　${escapeHTML(line.say)}</div>`).join("")}
      </div>
      <div class="turn-ask">${story
        ? `這一句是<b>擺出一個矛盾</b>，還是替觀眾下了結論？
           出現「顯示」「代表」「可見」通常就是想完了。`
        : `看完上面兩句，再看下面兩句——<b>對同一批事實的理解變了嗎？</b>
           沒變的話，那是補充或換句話說，不是轉。`}</div>
    </div>` : ""}
  </div>`;
}

function rightsPanel(rights) {
  if (!rights) return "";
  const order = ["ours", "free", "credit", "claimed"];
  const risky = rights.share.claimed || 0;
  return `
  <div class="rights">
    <div class="rights-head">
      <b>畫面的權利</b>
      <span class="lead ${risky >= 25 ? "short" : "good"}">有版權 ${risky}%</span>
      <span class="hint">最長一段引用 ${rights.longest} 秒</span>
    </div>
    <div class="bar">${order.map((key) => {
      const share = rights.share[key] || 0;
      return share ? `<i style="width:${share}%;background:${RIGHT_COLOUR[key]}"
        title="${escapeHTML(rights.labels[key])} ${share}%　${
        escapeHTML(RIGHT_NOTE[key])}"></i>` : "";
    }).join("")}</div>
    <div class="rights-keys">${order.map((key) => `
      <span><i style="background:${RIGHT_COLOUR[key]}"></i>${
        escapeHTML(rights.labels[key])}
        <b>${rights.share[key] || 0}%</b>
        <em>${rights.seconds[key] || 0}s</em></span>`).join("")}</div>
    ${rights.holders.length ? `<div class="holders">引用了誰：${
      rights.holders.map((one) => `<span>${escapeHTML(one.who)}
        <b>${one.seconds}s</b>（${one.share}%）</span>`).join("")}</div>` : ""}
    <p class="rights-why">${
      risky >= 25
        ? "引用比例偏高。合理使用沒有一條安全的百分比，但審查最先看的就是這個數字，超過四分之一很難主張整支片是我們的。"
        : "引用的每一段都短、都有觀點、都標了來源。仍要注意 Content ID 連畫面一起比對，靜音躲得掉音軌、躲不掉畫面。"}</p>
  </div>`;
}

async function showScript(name) {
  // Opening a different script drops whatever was pending on the last one.
  // Deliberate: an edit that was never saved is not a change, and carrying it
  // across would make it one without anybody deciding to.
  if (PENDING.name && PENDING.name !== name) dropPending();
  PENDING.name = name;
  let made;
  try { made = await api("GET", `/api/script?name=${encodeURIComponent(name)}`); }
  catch (error) { alert(error.message); return; }
  const sums = made.measured;
  // One rule, and it lives in core/script.py: the share is measured there.
  const share = 100 - (sums.borrowed_share || 0);

  $("paper").innerHTML = `
    <h2>${escapeHTML(name)}　<button id="btnBackTopic" class="tiny">← 回題目</button></h2>
    <div class="angle">觀點：${escapeHTML(made.view || "")}${
      made.tone ? `　語氣：${escapeHTML(made.tone)}` : ""}</div>
    <!-- Which house style, and who it is for. Both are decisions about the
         whole film that were being made once and then never revisited: the
         format silently defaulted to the argument shape, and the audience came
         from a lookup table that cannot know a piece about studios being bought
         is for people paying for streaming. -->
    <div class="about">
      <label>公版
        <select id="pickFormat">
          ${(FORMATS.length ? FORMATS : [{key: "argue", name: "新聞報導"}])
            .map((one) => `<option value="${escapeHTML(one.key)}"${
              one.key === (made.format || "argue") ? " selected" : ""
            }>${escapeHTML(one.name || one.key)}</option>`).join("")}
        </select>
      </label>
      <label class="grow">說給誰聽
        <input id="forWhom" value="${escapeHTML(made["for"] || "")}"
          placeholder="例如：每個要付帳單的人" spellcheck="false">
      </label>
      <span class="hint">結尾整段是寫給這群人聽的</span>
    </div>
    <div class="gauge">
      <div>長度<b class="${sums.over ? "short" : "good"}">${clock(sums.seconds)}</b></div>
      <div>上限 90 秒<b>${sums.over ? `超出 ${sums.over}s` : "在裡面"}</b></div>
      <div>字數<b>${sums.characters}</b></div>
      <div>句數<b>${sums.lines.length}</b></div>
      <div>觀點<b class="${sums.opinion >= 6 ? "good" : ""}">${sums.opinion} 句</b></div>
      <div>自製<b class="${share >= 60 ? "good" : "short"}">${share}%</b></div>
      <div>實拍<b class="${(sums.borrowed_share || 0) <= 35 ? "good" : "short"}">${
        sums.borrowed_share || 0}%</b></div>
      <div>三段分布<b class="${sums.even ? "good" : "short"}">${
        (sums.spread || []).join(" / ")}</b></div>
      <div>沒標來源<b class="${sums.unsourced.length ? "short" : "good"}">${
        sums.unsourced.length}</b></div>
      <div>沒指定圖<b class="${(sums.unpicked || []).length ? "short" : "good"}">${
        (sums.unpicked || []).length}</b></div>
      <div>沒看過<b class="${(sums.unchecked || []).length ? "short" : "good"}">${
        (sums.unchecked || []).length}</b></div>
      <div title="自製的句子沒說這張卡怎麼畫">沒畫卡<b class="${
        (sums.undrawn || []).length ? "short" : "good"}">${
        (sums.undrawn || []).length}</b></div>
      <div title="最後一句要是 outro：一句帶得走的話 + 頻道標記">結尾<b class="${
        (sums.unsigned || []).length ? "short" : "good"}">${
        (sums.unsigned || []).length ? "缺" : "有"}</b></div>
      <div title="同一種卡片連續超過三張就是投影片">重複<b class="${
        (sums.samey || []).length ? "short" : "good"}">${
        (sums.samey || []).length}</b></div>
      <div title="引用的畫面沒有出處，壓片會被擋下來">沒出處<b class="${
        (sums.uncredited || []).length ? "short" : "good"}">${
        (sums.uncredited || []).length}</b></div>
      <div title="起承轉合：四種都在、順序沒亂、轉在前三分之一">結構<b class="${
        (sums.shapeless || []).length ? "short" : "good"}">${
        (sums.shapeless || []).length ? (sums.shapeless[0].why || "有問題")
                                      : "過"}</b></div>
      <div title="影片段落佔實拍時間的比例，至少一半">會動的<b class="${
        sums.still_enough ? "good" : "short"}">${sums.clip_share || 0}%</b></div>
    </div>
    <!-- Rendering, and the sheet it produces. Looking at what was actually
         rendered is the one check nothing else can do: two of the faults in
         this project were only ever visible with all the shots laid out at
         once. -->
    <div class="film">
      <button id="btnBuild" class="tiny primary">壓片</button>
      <span id="filmWhere" class="hint">還沒壓</span>
      <span class="grow"></span>
      <button id="btnSheet" class="tiny" hidden>看接觸表</button>
      <button id="btnWatch" class="tiny" hidden>看片</button>
    </div>

    <div id="pending" hidden>
      <span id="pendingCount"></span>
      <span class="hint">切換到別的文案或回題目，這些改動會被丟掉</span>
      <button id="btnSaveLines" class="primary tiny">儲存</button>
      <button id="btnDropLines" class="tiny">放棄</button>
    </div>
    ${shapePanel(sums)}
    ${rightsPanel(sums.rights)}
    <div class="ruler">${sums.lines.map((line) =>
      `<i style="width:${(line.seconds / Math.max(90, sums.seconds)) * 100}%"
          title="${clock(line.at)}"></i>`).join("")}</div>
    <table>
      <thead><tr><th>起</th><th>台詞</th><th>畫面</th><th>來源</th></tr></thead>
      <tbody>${sums.lines.map((line) => `
        <tr data-shot="${escapeHTML(JSON.stringify({
            say: line.say || "", show: line.show || "",
            card: line.card_file ? `/media/card/${encodeURIComponent(name)}/${
              encodeURIComponent(line.card_file.split("/").pop())}` : "",
            pic: line.pic ? `/media/pic/${
              line.pic.split("/").map(encodeURIComponent).join("/")}` : "",
            clip: line.clip ? `/media/pic/${
              line.clip.file.split("/").map(encodeURIComponent).join("/")}` : "",
            at: line.clip ? [line.clip.start, line.clip.end] : null,
            caption: line.caption || "", credit: line.credit || "",
            outlet: line.outlet || "", from: line.from || "",
          }))}">
          <td class="at">${clock(line.at)}
            <select class="role" data-was="${escapeHTML(line.role || "")}">
              ${(sums.roles || ["起","承","轉","合"]).map((one) => `<option${
                one === line.role ? " selected" : ""}>${escapeHTML(one)}</option>`
              ).join("")}
            </select></td>
          <td class="say">
            <div class="say-edit" contenteditable="plaintext-only"
              spellcheck="false">${escapeHTML(line.say || "")}</div>
            <div class="say-meter">${sayMeter(line.say || "")}</div>
          </td>
          <td class="show">
            ${line.clip ? `<video class="pic" preload="metadata" muted
              controls src="/media/pic/${
              line.clip.file.split("/").map(encodeURIComponent).join("/")}#t=${
              line.clip.start},${line.clip.end}"></video>`
             : line.pic ? `<img class="pic" src="/media/pic/${
              line.pic.split("/").map(encodeURIComponent).join("/")}"
              alt="" loading="lazy">`
             : line.card_file ? `<img class="pic drawn" src="/media/card/${
              encodeURIComponent(name)}/${
              encodeURIComponent(line.card_file.split("/").pop())}"
              alt="" loading="lazy">`
             : line.card_error ? `<span class="grabbed bad">畫不出來：${
              escapeHTML(line.card_error)}</span>` : ""}
            <span>${escapeHTML(line.show || "")}</span>
            ${(line.pic || line.clip) ? `
            <label class="seen-box${line.seen ? " on" : ""}">
              <input type="checkbox" class="seen"${line.seen ? " checked" : ""}>
              ${line.seen ? "看過了" : "沒看過"}
            </label>` : ""}
            ${line.clip ? `<span class="grabbed">段落 ${
              Math.round(line.clip.start)}–${Math.round(line.clip.end)}s</span>` : ""}
            ${line.caption ? `<span class="grabbed">${
              escapeHTML(line.caption)}</span>` : ""}
          </td>
          <td class="from ${line.from === "觀點" ? "ours" : ""}">${
            escapeHTML(line.from || "")}</td>
        </tr>`).join("")}</tbody>
    </table>`;
  // Leaving for the topic drops pending edits too, and says so first.
  $("btnBackTopic").onclick = () => {
    if (PENDING.changes.size &&
        !confirm(`有 ${PENDING.changes.size} 處還沒儲存，離開就會丟掉。要離開嗎？`))
      return;
    dropPending();
    open(STATE.chosen);
  };
  // The film, if there is one.
  api("GET", `/api/script/film?name=${encodeURIComponent(name)}`)
    .then((film) => {
      if (!film.film) return;
      const when = new Date(film.made * 1000);
      $("filmWhere").textContent =
        `${(film.size / 1048576).toFixed(1)} MB　${when.toLocaleString()}`;
      $("btnSheet").hidden = !film.sheet;
      $("btnWatch").hidden = false;
    }).catch(() => {});
  $("btnBuild").onclick = async () => {
    try {
      await api("POST", "/api/script/build", {name});
      watchJob(() => showScript(name));
    } catch (error) { alert(error.message); }
  };
  $("btnSheet").onclick = () => {
    $("bigWho").textContent = `${name}　接觸表`;
    $("bigWhat").textContent = "每個鏡頭在它自己長度的 90% 處截的";
    $("bigStage").innerHTML =
      `<img src="/media/sheet/${encodeURIComponent(name)}" alt="">`;
    $("bigNote").innerHTML = "";
    $("big").hidden = false;
  };
  $("btnWatch").onclick = () => {
    $("bigWho").textContent = name;
    $("bigWhat").textContent = "";
    $("bigStage").innerHTML = `<video controls autoplay
      src="/media/film/${encodeURIComponent(name)}"></video>`;
    $("bigNote").innerHTML = "";
    $("big").hidden = false;
  };

  // Confirming a picture is what it claims to be. The gate has existed for a
  // while and nothing could fill it but me editing JSON -- which is the wrong
  // shape twice: it needs no model, and I am the one who demonstrably forgets.
  // Clicking the thumbnail opens it full size; the box records that somebody
  // did.
  $("paper").querySelectorAll("input.seen").forEach((box) => {
    box.addEventListener("change", async () => {
      const row = box.closest("tr");
      const index = [...row.parentNode.children].indexOf(row) + 1;
      try {
        await api("POST", "/api/script/seen",
                  {name, line: index, seen: box.checked});
        showScript(name);
      } catch (error) { alert(error.message); box.checked = !box.checked; }
    });
  });

  $("btnSaveLines").onclick = savePending;

  // Changing the house style re-checks everything against other thresholds and
  // usually leaves every role invalid, which is reported rather than repaired:
  // which line is a scene and which is a doubt is a reading, and guessing it
  // would be answering the question the format exists to ask.
  $("pickFormat").onchange = async (event) => {
    const house = event.target.value;
    const spec = FORMATS.find((one) => one.key === house) || {};
    const roles = (spec.structure || {}).roles || [];
    if (!confirm(`改成「${spec.name || house}」？\n\n` +
                 `角色會變成 ${roles.join("／")}，每一句都要重新標。\n` +
                 `實拍上限也會跟著改。`)) {
      event.target.value = made.format || "argue";
      return;
    }
    try {
      await api("POST", "/api/script/format", {name, format: house});
      dropPending();
      showScript(name);
    } catch (error) { alert(error.message); }
  };

  // Who it is for. Written once from a lookup table that cannot know the
  // topic, and the whole ending is aimed at it.
  const whom = $("forWhom");
  whom.dataset.was = whom.value;
  const saveWhom = async () => {
    if (whom.value.trim() === whom.dataset.was) return;
    try {
      await api("POST", "/api/script/about", {name, "for": whom.value.trim()});
      whom.dataset.was = whom.value.trim();
    } catch (error) { alert(error.message); whom.value = whom.dataset.was; }
  };
  whom.addEventListener("blur", saveWhom);
  whom.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); whom.blur(); }
    if (event.key === "Escape") { whom.value = whom.dataset.was; whom.blur(); }
  });
  $("btnDropLines").onclick = () => { dropPending(); showScript(name); };
  drawPending();

  // 起承轉合 is a claim about the writing, and the writer is its worst judge,
  // so whoever is reading has to be able to move it. The order it lands in is
  // checked by the server with the whole set in hand.
  $("paper").querySelectorAll("select.role").forEach((box) => {
    box.addEventListener("change", () => {
      const row = box.closest("tr");
      markPending([...row.parentNode.children].indexOf(row) + 1,
                  "role", box.value);
    });
  });

  // Typing shows the count live; leaving the box, or Enter, queues it.
  // Escape puts the old words back, because a half-typed line should not be
  // able to overwrite a finished one by accident.
  $("paper").querySelectorAll(".say-edit").forEach((cell) => {
    cell.dataset.was = cell.textContent.trim();
    cell.addEventListener("input", () => {
      cell.closest("td").querySelector(".say-meter").innerHTML =
        sayMeter(cell.textContent);
    });
    cell.addEventListener("blur", () => saveLine(cell, name));
    cell.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); cell.blur(); }
      if (event.key === "Escape") {
        event.stopPropagation();
        cell.textContent = cell.dataset.was;
        cell.blur();
      }
    });
  });
}

/* How the line measures against the frame it has to fit.

   Advice, not a gate. 13 characters is what fits across 1080 at the caption
   size and 3 rows is what fits above the safe area, but a writer looking at
   the picture can see that a fourteenth character sits fine where the
   arithmetic says it does not. Refusing the edit would only move the writing
   into a text editor, where nothing is measured at all -- so the number turns
   amber and the line is saved.

   The second figure is the one that is easy to forget: with no narration the
   floor is a reader's, and no line may be shorter than 1.9 seconds however
   few characters it has. */
const PER_ROW = 13, MOST_ROWS = 3, READ = 4.6, FLOOR = 1.9;

function sayMeter(say) {
  const said = String(say).replace(/[\s\-/:-@]/g, "").length;
  const seconds = Math.max(FLOOR, said / READ);
  const over = said > PER_ROW * MOST_ROWS;
  return `<span class="${said > PER_ROW ? "warn" : ""}">${said} 字</span>
    <span class="hint">建議 ${PER_ROW} 字內</span>
    <span>${seconds.toFixed(1)}s</span>${
    over ? `<span class="warn">會被截掉</span>` : ""}${
    said <= PER_ROW * READ / READ && said / READ < FLOOR
      ? `<span class="hint">太短，至少停 ${FLOOR}s</span>` : ""}`;
}

/* An edit joins the queue; it does not reach disk.

   Saving on blur meant a half-typed line was already the script and there was
   nothing for leaving the page to discard. Waiting also lets the order of
   起承轉合 be checked over the whole set at once, which is the only way it can
   be checked -- a role moved on its own always looks fine. */
function saveLine(cell, name) {
  const row = cell.closest("tr");
  const index = [...row.parentNode.children].indexOf(row) + 1;
  const say = cell.textContent.trim();
  if (!say || say === cell.dataset.was) return;
  markPending(index, "say", say);
  cell.dataset.was = say;
  row.querySelector(".say-meter").innerHTML = sayMeter(say);
}

/* Opening one shot at the size it will be seen.

   The row thumbnails are 82 pixels tall. A card's own heading is 76 pixels on
   a 1920-tall frame, which is comfortable in the finished video and a smudge
   in the list -- so the list answers "which shot is this line" and this
   answers "is this shot any good", which is the question that was being
   answered by not looking. */
function openShot(shot) {
  const stage = $("bigStage");
  $("bigWho").textContent = shot.show || shot.say;
  $("bigWhat").textContent = shot.say;
  if (shot.clip) {
    stage.innerHTML = `<video controls autoplay muted playsinline
      src="${shot.clip}#t=${shot.at[0]},${shot.at[1]}"></video>`;
  } else {
    stage.innerHTML = `<img src="${shot.card || shot.pic}" alt="">`;
  }
  const notes = [];
  if (shot.at) notes.push(`段落 <em>${shot.at[0]}–${shot.at[1]}s</em>`);
  if (shot.caption) notes.push(`圖說 <em>${escapeHTML(shot.caption)}</em>`);
  if (shot.credit) notes.push(escapeHTML(shot.credit));
  if (shot.from) notes.push(`出處 ${escapeHTML(shot.from)}`);
  if (shot.card) notes.push("自製卡片");
  $("bigNote").innerHTML = notes.join("　·　");
  $("big").hidden = false;
}

function closeShot() {
  $("bigStage").innerHTML = "";        // stops a clip that is still playing
  $("big").hidden = true;
}

$("bigClose").onclick = closeShot;
$("big").addEventListener("click", (event) => {
  if (event.target.id === "big") closeShot();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !$("big").hidden) closeShot();
});

$("paper").addEventListener("click", (event) => {
  const card = event.target.closest("[data-script]");
  if (card) { showScript(card.dataset.script); return; }

  const shelf = event.target.closest(".shelf [data-shot]");
  if (shelf) { openShot(JSON.parse(shelf.dataset.shot)); return; }

  if (event.target.closest(".say-edit")) return;   // editing, not opening
  if (event.target.closest(".seen-box")) return;   // ticking, not opening

  const row = event.target.closest("tr[data-shot]");
  if (row && event.target.closest("td.show")) {
    // The inline clip has its own controls; clicking those should scrub it,
    // not open a second copy of the same footage.
    if (event.target.tagName === "VIDEO") return;
    openShot(JSON.parse(row.dataset.shot));
  }
});

$("list").addEventListener("click", (event) => {
  const row = event.target.closest("[data-name]");
  if (row) open(row.dataset.name);
});

$("btnNew").onclick = async () => {
  const name = $("newName").value.trim();
  if (!name) return;
  try {
    const made = await api("POST", "/api/topic", { name });
    STATE.list = made.topics.sort((a, b) => b.modified - a.modified);
    $("newName").value = "";
    renderList();
    open(name);
  } catch (error) { alert(error.message); }
};
$("newName").addEventListener("keydown", (event) => {
  if (event.key === "Enter") $("btnNew").click();
});
$("btnBack").onclick = () => { location.href = "/"; };

(async function boot() {
  try {
    const found = await api("GET", "/api/topics");
    STATE.list = found.topics.sort((a, b) => b.modified - a.modified);
    STATE.want = found.want;
  } catch (error) { /* nothing yet */ }
  renderList();
  if (STATE.list.length) open(STATE.list[0].name);
})();
</script>
