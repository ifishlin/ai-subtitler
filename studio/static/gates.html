<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>門　AI-Reporters</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  .source{color:var(--faint);font:11px var(--mono);margin:0 0 26px}


  /* 五類，每一類的可靠度不同 —— 這是這一頁最想講的事，所以放在最上面。 */
  .kinds{display:grid;gap:9px;margin-bottom:6px;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .kind{background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:12px 15px;border-left:4px solid var(--line)}
  .kind b{display:block;font-size:14px;margin-bottom:3px}
  .kind span{color:var(--dim);font-size:12.5px;line-height:1.55}
  .kind .tag{font:11px var(--mono);color:var(--faint);float:right}
  .kind.frame{border-left-color:#4ec98f}
  .kind.script{border-left-color:#5aa9e6}
  .kind.join{border-left-color:#b79bde}
  .kind.sequence{border-left-color:#e8c95a}
  .kind.declared{border-left-color:#e8975a}

  .gate{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:15px 18px;margin-bottom:10px;
    border-left:4px solid var(--line)}
  .gate.frame{border-left-color:#4ec98f}
  .gate.script{border-left-color:#5aa9e6}
  .gate.join{border-left-color:#b79bde}
  .gate.sequence{border-left-color:#e8c95a}
  .gate.declared{border-left-color:#e8975a}

  .gate .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .gate code{font:14px var(--mono);color:var(--accent)}
  .gate .name{font-size:16px;font-weight:600}
  .gate .flags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .flag{font:11px var(--mono);padding:2px 8px;border-radius:11px;
    border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .flag.blocks{color:var(--warn);border-color:#5c3a2a}
  .flag.weak{color:var(--warn);border-color:#5c3a2a}
  .flag.clean{color:var(--ok);border-color:#2c5a45}
  .gate .why{color:var(--dim);font-size:13.5px;margin:7px 0 0}

  .gate details{margin-top:9px}
  .gate summary{cursor:pointer;color:var(--faint);font-size:12px;
    user-select:none;list-style:none}
  .gate summary::-webkit-details-marker{display:none}
  .gate summary:before{content:"▸ ";color:var(--accent)}
  .gate details[open] summary:before{content:"▾ "}
  .gate summary:hover{color:var(--accent)}
  .gate pre{white-space:pre-wrap;font:12.5px/1.7 var(--mono);
    color:var(--dim);background:#00000026;border-radius:9px;
    padding:12px 14px;margin:9px 0 0;overflow-x:auto}
  /* 這一頁的表格很窄很密（十道門 × 九份文案），padding 比共用的小一格。 */
  table.sheet th,table.sheet td{padding:8px 12px}
  table.sheet td:first-child{white-space:nowrap}
  td.n{font:12px var(--mono);text-align:center;color:var(--faint)}
  td.n.bad{color:var(--warn);font-weight:700}
  td.n.zero{color:#2e3d4c}
  .thr{font:12.5px var(--mono);color:var(--dim)}
  .thr b{color:var(--ink)}
  .thr .k{color:var(--accent)}
  .thr .w{display:block;color:var(--faint);font-size:12px;
    font-family:-apple-system,"PingFang TC",sans-serif;margin:2px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>所有的門</h1>
  <p class="under">一道門就是一個程式算得出來的檢查，不通過就過不去。
    跟寫在文件裡的提醒差別在於：門會攔，提醒不會。</p>
  <p class="source" id="source">讀取中…</p>

  <h2>五類，可靠度不一樣</h2>
  <div class="kinds" id="kinds"></div>

  <h2 id="gatesHead">文案的門</h2>
  <div id="gates"></div>

  <h2>整片的三個數字</h2>
  <div id="sums"></div>

  <h2>文案之外</h2>
  <div id="extra"></div>

  <h2>每一份文案現在的狀況</h2>
  <div class="scroll"><table class="sheet" id="grid"></table></div>

  <h2>門檻的數字 —— assets/rules.json</h2>
  <div id="thr" class="thr"></div>
</div>

<script src="/static/nav.js"></script>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

function gateCard(one, blocking) {
  const weak = one.kind === "declared";
  return `
    <div class="gate ${esc(one.kind)}">
      <div class="head">
        <span class="name">${esc(one.label)}</span>
        <code>${esc(one.key)}()</code>
        <span class="flags">
          ${blocking ? '<span class="flag blocks">壓片會擋</span>'
                     : '<span class="flag">只顯示，不擋</span>'}
          ${weak ? '<span class="flag weak">測的是宣告</span>' : ""}
          ${one.hits === 0
            ? '<span class="flag clean">目前 0 處</span>'
            : `<span class="flag blocks">目前 ${one.hits} 處</span>`}
        </span>
      </div>
      <p class="why">${esc(one.why)}</p>
      ${one.doc ? `<details><summary>它是為了哪一次錯誤做的</summary>
        <pre>${esc(one.doc)}</pre></details>` : ""}
      ${one.where ? `<p class="why"><code>${esc(one.where)}</code></p>` : ""}
    </div>`;
}

async function load() {
  const answer = await fetch("/api/gates");
  if (!answer.ok) throw new Error(await answer.text());
  const d = await answer.json();

  const total = d.gates.length + d.sums.length + d.extra.length;
  $("source").textContent =
    `共 ${total} 道。這一頁的內容從 core/script.py 的 GATES 常數和各函式的 `
    + `docstring 抽出來，改了程式這一頁就跟著改 —— 不會有一份會過期的副本。`;

  $("kinds").innerHTML = Object.entries(d.kinds).map(([key, [name, why]]) => {
    const n = d.gates.filter((g) => g.kind === key).length
            + d.sums.filter((g) => g.kind === key).length;
    return `<div class="kind ${esc(key)}">
      <b><code style="font:13px var(--mono);color:var(--accent)">${esc(key)}</code>
        <span class="tag">${n} 道</span></b>
      <b style="font-size:13.5px">${esc(name)}</b>
      <span>${esc(why)}</span></div>`;
  }).join("");

  $("gatesHead").textContent =
    `文案的門 —— ${d.gates.length} 道（${d.gates.filter((g) => g.blocks).length} 道會擋壓片）`;
  $("gates").innerHTML = d.gates.map((one) => gateCard(one, one.blocks)).join("");
  $("sums").innerHTML = d.sums.map((one) =>
    gateCard({...one, hits: 0, doc: ""}, true)).join("");
  $("extra").innerHTML = d.extra.map((one) =>
    gateCard({...one, hits: 0}, one.blocks)).join("");

  const keys = d.gates.map((g) => g.key);
  $("grid").innerHTML = `
    <thead><tr><th>文案</th>
      ${keys.map((k) => `<th style="text-align:center">${esc(k)}</th>`).join("")}
      <th style="text-align:center">長度</th>
      <th style="text-align:center">比例</th>
      <th style="text-align:center">會動</th></tr></thead>
    <tbody>${d.scripts.map((one) => `
      <tr><td>${esc(one.name)}</td>
        ${keys.map((k) => {
          const n = one.faults[k] || 0;
          return `<td class="n ${n ? "bad" : "zero"}">${n ? n : "·"}</td>`;
        }).join("")}
        <td class="n ${one.sums.too_long ? "bad" : "zero"}">${
          one.sums.over > 0 ? "+" + one.sums.over : "·"}</td>
        <td class="n ${one.sums.even ? "zero" : "bad"}">${one.sums.even ? "·" : "✗"}</td>
        <td class="n ${one.sums.still_enough ? "zero" : "bad"}">${
          one.sums.still_enough ? "·" : "✗"}</td>
      </tr>`).join("") || '<tr><td class="empty">還沒有文案</td></tr>'}
    </tbody>`;

  /* 每個數字旁邊都有一個 why。引用數字的文字會過期，指名數字的不會 —— 所以
     這裡印的是鍵和值，不是我重打一遍的說明。 */
  $("thr").innerHTML = Object.entries(d.thresholds).map(([group, spec]) => {
    if (typeof spec !== "object" || spec === null) return "";
    const why = spec.why || "";
    const rows = Object.entries(spec)
      .filter(([k]) => !k.startsWith("why"))
      .map(([k, v]) => `<span class="k">${esc(group)}.${esc(k)}</span> = <b>${
        esc(typeof v === "object" ? JSON.stringify(v) : v)}</b>`)
      .join("　·　");
    return rows ? `<div>${rows}${why ? `<span class="w">${esc(why)}</span>` : ""}</div>` : "";
  }).join("");
}

load().catch((error) => {
  $("source").textContent = "讀不到門的資料：" + error.message;
});
</script>
</body>
</html>
