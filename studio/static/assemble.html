<!doctype html>
<meta charset="utf-8">
<title>Splice　AI-Desk</title>
<link rel="stylesheet" href="/static/ask.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 "PingFang TC","Heiti TC",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:14px;margin:0;font-weight:600}
  header .where{font-size:12px;color:var(--faint)}
  button.tiny{padding:3px 9px;font-size:12px}
  #btnBack{font-size:12px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
  #btnBack:hover{border-color:var(--accent)}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#0b1017;border-color:transparent;
    font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;
    align-items:start}

  h2{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px}

  /* ---------- what can be used ---------- */
  .source{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:5px;
    border:1px solid var(--line);border-radius:7px;background:var(--panel2);
    cursor:pointer}
  .source:hover{border-color:var(--accent)}
  .source .bin{border:0;background:transparent;color:var(--faint);padding:1px 3px;
    opacity:.45;transition:opacity .12s;cursor:pointer;font-size:12px}
  .source:hover .bin{opacity:1}
  .source .bin:hover{color:var(--danger)}
  .source .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:13px}
  .source .meta{font:11px var(--mono);color:var(--faint)}
  .source .tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim)}
  .source .tag.srt{color:var(--ok);border-color:#2c5a45}

  /* ---------- the running order ---------- */
  #pieces{min-height:80px;position:relative}
  #mark{position:absolute;left:0;right:0;height:3px;border-radius:2px;
    background:var(--accent);box-shadow:0 0 8px var(--accent);display:none;
    pointer-events:none}
  #mark.on{display:block}
  .source{cursor:grab}
  .source.lifting{opacity:.4}
  #pieces.taking{outline:1px dashed var(--accent);outline-offset:4px;border-radius:8px}
  .piece{padding:9px 10px;margin-bottom:8px;
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:8px;background:var(--panel2)}
  .piece .top{display:flex;align-items:center;gap:10px}
  /* The whole source, with the kept part lit and the rest dimmed. Trimming is
     dragging the edges of the lit part -- the frames are right there, so there
     is nothing to work out from a number. */
  .strip{position:relative;height:46px;margin-top:8px;border-radius:6px;
    overflow:hidden;background:#0d1014;cursor:default;user-select:none}
  .strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    pointer-events:none}
  .strip .mask{position:absolute;top:0;bottom:0;background:#0b0e12cc;
    pointer-events:none}
  .strip .kept{position:absolute;top:0;bottom:0;border:2px solid var(--accent);
    border-radius:4px;pointer-events:none}
  .strip .edge{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;
    background:linear-gradient(var(--accent),var(--accent)) center/3px 100% no-repeat}
  .strip .edge:hover{background:linear-gradient(var(--accent),var(--accent))
    center/5px 100% no-repeat}
  .piece .no{font:12px var(--mono);color:var(--faint);min-width:1.4em}
  .piece .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .piece input{width:88px;font:12px var(--mono);color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:5px;padding:4px 6px;text-align:center}
  .piece .span{font:11px var(--mono);color:var(--faint);min-width:5em;text-align:right}
  .piece .lift{border:0;background:transparent;color:var(--faint);padding:2px 5px}
  .piece .lift:hover{color:var(--accent)}
  .piece.none{border-left-color:var(--faint);opacity:.85}
  .empty{color:var(--faint);font-size:13px;padding:18px;text-align:center;
    border:1px dashed var(--line);border-radius:8px}

  .foot{display:flex;align-items:center;gap:10px;margin-top:12px}
  .foot input{width:230px;font:13px var(--mono);color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px}
  .total{margin-left:auto;font:12px var(--mono);color:var(--dim)}
  #note{margin-top:10px;font-size:12px;color:var(--faint);min-height:1.4em}
  #note.bad{color:var(--danger)}
  #note.good{color:var(--ok)}
  #srcNote{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  #srcNote.bad{color:var(--danger)}

  #peekBox{position:fixed;right:18px;bottom:18px;width:360px;display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px;box-shadow:0 18px 50px #000b;z-index:20}
  #peekBox.on{display:block}
  #peek{width:100%;display:block;border-radius:6px;background:#000}
  #peekAt{font:11px var(--mono);color:var(--dim);margin-top:6px;text-align:center}
</style>
<script defer src="/static/ask.js"></script>

<header>
  <h1>Splice</h1>
  <span class="where">把幾段接成一支，字幕跟著接</span>
  <div style="flex:1"></div>
  <button id="btnBack" class="tiny">← 回編輯器</button>
</header>

<main>
  <section class="card">
    <h2>可用的片源</h2>
    <div id="sources"></div>
    <p style="font-size:12px;color:var(--faint);margin:10px 0 0">
      點一下接到最後，或用拉的放到指定位置。<b>有字幕</b>的片源接進去時字幕會跟著走。</p>
    <!-- Beside the ✕ it answers for. In the other panel it read as no reaction. -->
    <div id="srcNote"></div>
  </section>

  <section class="card">
    <h2>順序</h2>
    <div id="pieces"><div id="mark"></div></div>
    <div class="foot">
      <label style="font-size:12px;color:var(--dim)">存成
        <input id="name" value="合併" spellcheck="false"></label>
      <button id="go" class="primary">組裝</button>
      <span class="total" id="total"></span>
    </div>
    <div id="note"></div>
  </section>
</main>

<!-- The frame an edge is landing on, while it is being dragged. -->
<div id="peekBox"><video id="peek" muted playsinline preload="metadata"></video>
  <div id="peekAt"></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const escapeHTML = (text) => String(text).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Seconds -> m:ss.s, and back. The same two forms the editor accepts. */
function fmt(t) {
  t = Math.max(0, t || 0);
  return `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
}
function parseTime(text) {
  const parts = String(text).trim().replace(",", ".").split(":");
  if (parts.some((part) => part.trim() === "" || !Number.isFinite(Number(part)))) return NaN;
  return parts.reduce((total, part) => total * 60 + Number(part), 0);
}

const STATE = { sources: [], pieces: [] };

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `${method} ${path} 失敗`);
  return data;
}

function renderSources() {
  $("sources").innerHTML = STATE.sources.map((source, index) => `
    <div class="source" draggable="true" data-source="${index}">
      <span class="name">${escapeHTML(source.name)}</span>
      <span class="meta">${fmt(source.seconds)}</span>
      ${source.srt ? '<span class="tag srt">有字幕</span>'
                   : '<span class="tag">無字幕</span>'}
      <button class="bin" draggable="false" data-bin="${index}"
              title="從清單移掉（移到 trash/，不是真的刪掉）">✕</button>
    </div>`).join("") || '<div class="empty">沒有可用的片源</div>';
}

function renderPieces() {
  // The insertion line is a fixture of the list, not one of its rows: keep it
  // across every redraw rather than rebuilding it.
  const mark = $("mark");
  if (!STATE.pieces.length) {
    $("pieces").innerHTML = '<div class="empty">左邊點一個片源，或直接拉過來</div>';
  } else {
    $("pieces").innerHTML = STATE.pieces.map((piece, index) => `
      <div class="piece ${piece.srt ? "" : "none"}" data-piece="${index}">
        <div class="top">
          <span class="no">${index + 1}</span>
          <span class="name">${escapeHTML(piece.name)}</span>
          <input data-edge="from" value="${fmt(piece.from)}" title="從第幾秒開始">
          <span style="color:var(--faint)">–</span>
          <input data-edge="to" value="${fmt(piece.to)}" title="到第幾秒">
          <span class="span">${fmt(piece.to - piece.from)}</span>
          <button class="lift" data-move="-1" title="往前">▲</button>
          <button class="lift" data-move="1" title="往後">▼</button>
          <button class="lift" data-drop="1" title="移除">✕</button>
        </div>
        <div class="strip" data-strip="${index}">
          <img src="/media/sourcestrip?path=${encodeURIComponent(piece.source)}" alt="">
          <div class="mask" style="left:0;width:${(piece.from / piece.seconds) * 100}%"></div>
          <div class="mask" style="right:0;width:${(1 - piece.to / piece.seconds) * 100}%"></div>
          <div class="kept" style="left:${(piece.from / piece.seconds) * 100}%;
               width:${((piece.to - piece.from) / piece.seconds) * 100}%"></div>
          <div class="edge" data-hold="from"
               style="left:calc(${(piece.from / piece.seconds) * 100}% - 6px)"></div>
          <div class="edge" data-hold="to"
               style="left:calc(${(piece.to / piece.seconds) * 100}% - 6px)"></div>
        </div>
      </div>`).join("");
  }
  $("pieces").appendChild(mark);
  const total = STATE.pieces.reduce((sum, piece) => sum + (piece.to - piece.from), 0);
  const noSubs = STATE.pieces.filter((piece) => !piece.srt).length;
  $("total").textContent = STATE.pieces.length
    ? `${STATE.pieces.length} 段　共 ${fmt(total)}` + (noSubs ? `　${noSubs} 段沒有字幕` : "")
    : "";
  $("go").disabled = !STATE.pieces.length;
}

// Buttons rather than links: a link offers a menu of things nobody wants
// here, and looks unlike every other control that does something.
$("btnBack").onclick = () => { location.href = "/"; };

$("sources").addEventListener("click", async (event) => {
  const row = event.target.closest("[data-source]");
  if (!row) return;
  const source = STATE.sources[Number(row.dataset.source)];

  if (event.target.dataset.bin !== undefined) {
    if (!await confirmed(`把「${source.name}」移掉？`, {
      body: "搬到 trash/，不會真的消失 —— 要永久刪除得自己去清 trash/。",
      lose: source.kind === "run"
        ? ["整個 run 的資料夾", "影片", "字幕和 sidecar"]
        : ["這一支素材檔"],
      yes: "移掉"})) return;
    try {
      const gone = await api("POST", "/api/source/remove", { name: source.name });
      STATE.sources = STATE.sources.filter((item) => item.name !== source.name);
      // Pieces already placed point at a file that has moved; drop them rather
      // than let 組裝 fail on a path that is no longer there.
      const before = STATE.pieces.length;
      STATE.pieces = STATE.pieces.filter((piece) => piece.name !== source.name);
      renderSources();
      renderPieces();
      $("srcNote").className = "";
      $("srcNote").textContent = `${source.name} 移到 ${gone.at}`
        + (before > STATE.pieces.length
           ? `，順序裡用到它的 ${before - STATE.pieces.length} 段也拿掉了` : "");
    } catch (error) {
      $("srcNote").className = "bad";
      $("srcNote").textContent = error.message;
    }
    return;
  }

  STATE.pieces.push({ ...source, from: 0, to: source.seconds });
  renderPieces();
});

/* ---------- dragging a source into the order ----------
   Clicking appends; dragging says where. That matters because inserting a
   clarification into the middle is the whole reason this page exists, and
   "add it then press ▲ four times" is not how anyone thinks about it.

   Native drag and drop rather than pointer events: it is what a browser
   already does for dragging one thing onto another, and it does not fight
   the pointer capture the filmstrip edges rely on. */
let carried = null;

$("sources").addEventListener("dragstart", (event) => {
  const row = event.target.closest("[data-source]");
  if (!row) return;
  carried = STATE.sources[Number(row.dataset.source)];
  row.classList.add("lifting");
  event.dataTransfer.effectAllowed = "copy";
  event.dataTransfer.setData("text/plain", carried.name);   // Firefox insists
});

$("sources").addEventListener("dragend", (event) => {
  const row = event.target.closest("[data-source]");
  if (row) row.classList.remove("lifting");
  carried = null;
  hideMark();
});

$("pieces").addEventListener("dragover", (event) => {
  if (!carried) return;
  event.preventDefault();                   // without this, no drop is allowed
  event.dataTransfer.dropEffect = "copy";
  $("pieces").classList.add("taking");
  showMark(dropIndex(event.clientY));
});

$("pieces").addEventListener("dragleave", (event) => {
  // Moving between a row and its filmstrip fires this too; only a pointer that
  // has actually left the list counts.
  if (event.relatedTarget && $("pieces").contains(event.relatedTarget)) return;
  hideMark();
});

$("pieces").addEventListener("drop", (event) => {
  if (!carried) return;
  event.preventDefault();
  STATE.pieces.splice(dropIndex(event.clientY), 0,
                      { ...carried, from: 0, to: carried.seconds });
  carried = null;
  hideMark();
  renderPieces();
});

/** Which slot the pointer is asking for: before the first row it is over the
 *  top half of, otherwise the end. */
function dropIndex(y) {
  const rows = Array.from($("pieces").querySelectorAll("[data-piece]"));
  for (const row of rows) {
    const box = row.getBoundingClientRect();
    if (y < box.top + box.height / 2) return Number(row.dataset.piece);
  }
  return rows.length;
}

function showMark(index) {
  const list = $("pieces");
  const rows = Array.from(list.querySelectorAll("[data-piece]"));
  const box = list.getBoundingClientRect();
  let y = 6;
  if (rows.length) {
    y = index >= rows.length
      ? rows[rows.length - 1].getBoundingClientRect().bottom - box.top + 2
      : rows[index].getBoundingClientRect().top - box.top - 4;
  }
  $("mark").style.top = `${y + list.scrollTop}px`;
  $("mark").classList.add("on");
}

function hideMark() {
  $("mark").classList.remove("on");
  $("pieces").classList.remove("taking");
}

$("pieces").addEventListener("click", (event) => {
  const row = event.target.closest("[data-piece]");
  if (!row) return;
  const index = Number(row.dataset.piece);
  if (event.target.dataset.drop) {
    STATE.pieces.splice(index, 1);
  } else if (event.target.dataset.move) {
    const to = index + Number(event.target.dataset.move);
    if (to < 0 || to >= STATE.pieces.length) return;
    [STATE.pieces[index], STATE.pieces[to]] = [STATE.pieces[to], STATE.pieces[index]];
  } else {
    return;
  }
  renderPieces();
});

/* ---------- trimming by eye ----------
   Dragging an edge moves that end of the piece and shows the frame it lands
   on, so a cut is chosen by looking at it. The preview is a muted video seeked
   to the moment, not a picture: seeking is instant and needs nothing built. */
$("pieces").addEventListener("pointerdown", (event) => {
  const hold = event.target.dataset && event.target.dataset.hold;
  if (!hold) return;
  const strip = event.target.closest(".strip");
  const piece = STATE.pieces[Number(strip.dataset.strip)];
  event.target.setPointerCapture(event.pointerId);
  showPeek(piece, piece[hold]);

  const move = (at) => {
    const box = strip.getBoundingClientRect();
    const where = ((at.clientX - box.left) / box.width) * piece.seconds;
    const bounded = Math.min(Math.max(0, where), piece.seconds);
    // Neither edge may cross the other, and a piece keeps at least a second.
    piece[hold] = hold === "from"
      ? Math.min(bounded, piece.to - 1)
      : Math.max(bounded, piece.from + 1);
    paintStrip(strip, piece);
    showPeek(piece, piece[hold]);
  };
  const drop = () => {
    event.target.removeEventListener("pointermove", move);
    event.target.removeEventListener("pointerup", drop);
    hidePeek();
    renderPieces();
  };
  event.target.addEventListener("pointermove", move);
  event.target.addEventListener("pointerup", drop);
});

/** Redraw one strip in place: rebuilding the list mid-drag would drop the
 *  element the pointer is captured by. */
function paintStrip(strip, piece) {
  const left = (piece.from / piece.seconds) * 100;
  const right = (piece.to / piece.seconds) * 100;
  strip.querySelectorAll(".mask")[0].style.width = `${left}%`;
  strip.querySelectorAll(".mask")[1].style.width = `${100 - right}%`;
  const kept = strip.querySelector(".kept");
  kept.style.left = `${left}%`;
  kept.style.width = `${right - left}%`;
  strip.querySelector('[data-hold="from"]').style.left = `calc(${left}% - 6px)`;
  strip.querySelector('[data-hold="to"]').style.left = `calc(${right}% - 6px)`;
  const row = strip.closest(".piece");
  row.querySelector('[data-edge="from"]').value = fmt(piece.from);
  row.querySelector('[data-edge="to"]').value = fmt(piece.to);
  row.querySelector(".span").textContent = fmt(piece.to - piece.from);
}

function showPeek(piece, at) {
  const peek = $("peek");
  const wanted = `/media/sourceplay?path=${encodeURIComponent(piece.source)}`;
  if (!peek.src.endsWith(wanted)) peek.src = wanted;
  peek.parentElement.classList.add("on");
  $("peekAt").textContent = `${escapeHTML(piece.name)}　${fmt(at)}`;
  const go = () => { try { peek.currentTime = at; } catch (error) { /* not ready */ } };
  peek.readyState >= 1 ? go() : peek.addEventListener("loadedmetadata", go, { once: true });
}

function hidePeek() {
  setTimeout(() => $("peek").parentElement.classList.remove("on"), 900);
}

$("pieces").addEventListener("change", (event) => {
  const row = event.target.closest("[data-piece]");
  const edge = event.target.dataset.edge;
  if (!row || !edge) return;
  const piece = STATE.pieces[Number(row.dataset.piece)];
  const value = parseTime(event.target.value);
  if (!Number.isFinite(value)) { renderPieces(); return; }
  piece[edge] = Math.min(Math.max(0, value), piece.seconds);
  // A piece has to have something in it, and cannot end before it starts.
  if (piece.to <= piece.from) piece.to = Math.min(piece.seconds, piece.from + 1);
  renderPieces();
});

$("go").onclick = async () => {
  const name = $("name").value.trim();
  $("go").disabled = true;
  $("note").className = "";
  $("note").textContent = "組裝中…（整支重新編碼，大約和影片長度差不多）";
  try {
    await api("POST", "/api/assemble", {
      name,
      pieces: STATE.pieces.map((piece) => ({
        source: piece.source, srt: piece.srt, from: piece.from, to: piece.to,
      })),
    });
    watch(name);
  } catch (error) {
    $("note").className = "bad";
    $("note").textContent = error.message;
    $("go").disabled = false;
  }
};

/** The assembly runs in the background; this asks how it is going. */
function watch(name) {
  const timer = setInterval(async () => {
    let status;
    try { status = await api("GET", "/api/assemble"); } catch (error) { return; }
    if (status.state === "running") return;
    clearInterval(timer);
    $("go").disabled = false;
    $("note").className = status.state === "error" ? "bad" : "good";
    if (status.state === "error") {
      $("note").textContent = status.message;
      return;
    }
    // The editor opens whichever run is active, so the link has to make this
    // one active first -- otherwise it lands on whatever was open before and
    // the video just made is nowhere to be seen.
    $("note").innerHTML = `${escapeHTML(status.message)}　`
      + `<button id="open" class="tiny">在編輯器打開 ${escapeHTML(name)}</button>`;
    $("open").addEventListener("click", async () => {
      try {
        await api("POST", "/api/project", { name });
      } catch (error) {
        $("note").className = "bad";
        $("note").textContent = error.message;
        return;
      }
      location.href = "/";
    });
  }, 1500);
}

(async function boot() {
  try {
    STATE.sources = (await api("GET", "/api/sources")).sources;
  } catch (error) {
    $("note").className = "bad";
    $("note").textContent = error.message;
  }
  renderSources();
  renderPieces();
})();
</script>
<script src="/static/nav.js"></script>
