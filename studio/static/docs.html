<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件　AI-Reporters</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  :root{--code:#0d141c}   /* 只有這一頁用：程式碼區塊的底 */
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15.5px/1.75 -apple-system,BlinkMacSystemFont,"PingFang TC",
      "Noto Sans TC",sans-serif}
  .shell{display:flex;align-items:flex-start;gap:26px;
    max-width:1120px;margin:0 auto;padding:28px 22px 90px}

  .side{position:sticky;top:58px;flex:0 0 178px;min-width:0}
  .side a{display:block;padding:7px 11px;border-radius:8px;
    color:var(--dim);text-decoration:none;font-size:13.5px}
  .side a:hover{background:var(--panel);color:var(--ink)}
  .side a.here{background:var(--accent);color:#0b0f14;font-weight:600}
  .side .lab{font-size:11px;color:var(--faint);letter-spacing:1px;
    padding:0 11px 6px;text-transform:uppercase}

  .paper{flex:1;min-width:0;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:30px 36px 44px}
  .stamp{color:var(--faint);font:11px var(--mono);margin:0 0 20px;
    padding-bottom:14px;border-bottom:1px solid var(--line)}

  /* markdown 出來的東西。docs/*.md 是唯一來源，每次請求重讀。 */
  .md h1{font-size:25px;margin:0 0 18px;line-height:1.35}
  .md h2{font-size:19px;margin:34px 0 10px;padding-top:16px;
    border-top:1px solid var(--line);line-height:1.4}
  .md h1+h2{border-top:none;padding-top:0}
  .md h3{font-size:16px;margin:24px 0 8px;color:var(--dim)}
  .md p{margin:0 0 14px}
  .md ul,.md ol{margin:0 0 14px;padding-left:24px}
  .md li{margin:4px 0}
  .md strong{color:var(--ink);font-weight:700}
  .md a{color:var(--accent)}
  .md hr{border:none;border-top:1px solid var(--line);margin:30px 0}
  .md code{font:13.5px var(--mono);background:var(--code);
    padding:1.5px 5px;border-radius:5px;color:var(--dim)}
  .md pre{background:var(--code);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0 0 16px}
  .md pre code{background:none;padding:0;font-size:13px;line-height:1.7;
    color:var(--dim);white-space:pre}
  .md blockquote{margin:0 0 14px;padding:2px 0 2px 15px;
    border-left:3px solid var(--line);color:var(--dim)}

  .md table{border-collapse:collapse;font-size:13.5px;margin:0 0 18px;
    display:block;overflow-x:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--line);padding:7px 12px;
    text-align:left;vertical-align:top}
  .md th{background:var(--code);color:var(--faint);font-size:12px;
    font-weight:600;white-space:nowrap}
  .md td code{font-size:12.5px}

  .fail{color:var(--warn);padding:20px}
  @media (max-width:760px){
    .shell{flex-direction:column;gap:14px}
    .side{position:static;flex:none;width:100%;display:flex;gap:6px;
      flex-wrap:wrap}
    .side .lab{display:none}
    .paper{padding:22px 20px 34px}
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side"><div class="lab">文件</div></nav>
  <article class="paper">
    <p class="stamp" id="stamp">讀取中…</p>
    <div class="md" id="md"></div>
  </article>
</div>

<script src="/static/nav.js"></script>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

/* 名字從網址來，內容從伺服器來。伺服器每次請求重讀 docs/*.md，所以這一頁
   不可能跟檔案不一致 —— 這個專案有兩份會分岔的紀錄就夠了。 */
function wanted() {
  return new URLSearchParams(location.search).get("name") || "MISTAKES";
}

async function load() {
  const name = wanted();
  const answer = await fetch("/api/doc?name=" + encodeURIComponent(name));
  if (!answer.ok) {
    $("stamp").textContent = "";
    $("md").innerHTML = `<p class="fail">${esc(await answer.text())}</p>`;
    return;
  }
  const d = await answer.json();
  document.title = d.title + "　·　文件";

  $("side").innerHTML = '<div class="lab">文件</div>' + d.all.map((one) =>
    `<a href="/docs?name=${encodeURIComponent(one.name)}"
        class="${one.name === d.name ? "here" : ""}">${esc(one.title)}</a>`
  ).join("");

  const when = new Date(d.changed * 1000);
  $("stamp").textContent =
    `docs/${d.name}.md　·　${d.words.toLocaleString()} 字　·　`
    + `最後改動 ${when.toLocaleString("zh-TW", {hour12: false})}`;
  $("md").innerHTML = d.html;
}

load().catch((error) => {
  $("stamp").textContent = "";
  $("md").innerHTML = `<p class="fail">讀不到：${esc(error.message)}</p>`;
});
</script>
</body>
</html>
