<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>怎麼寫的規定</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  .tabs{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 16px;align-items:flex-start}
  .tabs .group h4{margin:0 0 5px;font:10.5px var(--mono);color:var(--faint);
    font-weight:600;letter-spacing:.6px}
  .tabs .group .row{display:flex;gap:5px;flex-wrap:wrap}
  .tabs .group.dead h4{color:#5c4a2a}
  .tabs .group.dead button{opacity:.6}
  .tabs button{font:12.5px var(--mono);color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:5px 12px;
    cursor:pointer;white-space:nowrap}
  .tabs button:hover{color:var(--ink);border-color:var(--accent)}
  .tabs button.on{color:var(--bg);background:var(--accent);border-color:transparent;
    font-weight:600}
  .tabs button .dot{color:var(--warn);margin-left:5px}
  .tabs button.on .dot{color:var(--bg)}

  .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 11px}
  .bar .n{font:11.5px var(--mono);color:var(--faint);line-height:1.7}
  .bar .n .why{color:var(--dim);font-size:11.5px}
  .bar .gap{flex:1}
  .bar button{font:13px inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer}
  .bar button:hover:not(:disabled){border-color:var(--accent)}
  .bar button:disabled{opacity:.45;cursor:default}
  .bar button.primary{background:var(--accent);color:#0b1017;
    border-color:transparent;font-weight:600}
  .bar button.reset{color:var(--faint)}
  .bar button.reset:hover{color:#ff8a72;border-color:#5b2a22}
  .bar .said{font-size:12px;color:var(--faint)}
  .bar .said.bad{color:var(--warn)}
  .bar .said.ok{color:var(--ok)}

  /* 左邊改，右邊看填好的樣子。並排是因為要判斷「這句話填進數字之後
     還通順嗎」，而那件事在兩個畫面之間切換是判斷不了的。 */
  .both{display:grid;gap:12px;grid-template-columns:1fr 1fr;
    align-items:stretch}
  @media (max-width:900px){.both{grid-template-columns:1fr}}
  .side{display:flex;flex-direction:column;min-width:0}
  .side h3{margin:0 0 6px;font:11px var(--mono);color:var(--faint);
    font-weight:600;letter-spacing:.5px}
  textarea{width:100%;min-height:62vh;resize:vertical;
    font:12.5px/1.75 var(--mono);color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  textarea:focus{outline:none;border-color:var(--accent)}
  pre.view{margin:0;min-height:62vh;max-height:62vh;overflow:auto;
    white-space:pre-wrap;font:12.5px/1.75 var(--mono);color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px}
  /* 被填進去的值。標色的是「這個數字不是寫死的」—— 改片型或 rules.json
     就會變，改這一頁的文字不會。 */
  pre.view b.put{color:#7fd4ff;font-weight:600;background:#7fd4ff14;
    border-radius:4px;padding:0 3px}
  pre.view b.bad{color:var(--warn);background:#f5b54418;border-radius:4px;
    padding:0 3px}

  /* 一個片型一張卡，內容就是它的 JSON。當資料編，因為它本來就是資料 ——
     一個欄位配一個輸入框的做法，保證有一天欄位加了而畫面沒加。 */
  .house-card{border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    margin-bottom:9px;background:var(--panel)}
  .house-card .head{display:flex;align-items:baseline;gap:10px}
  .house-card .head b{font-size:14px}
  .house-card .head code{font:11px var(--mono);color:var(--faint)}
  .house-card .head .used{font:11px var(--mono);color:#7fd4ff;margin-left:auto}
  .house-card textarea{min-height:170px;margin-top:8px;font-size:12px}
  .house-card .row{display:flex;gap:7px;align-items:center;margin-top:7px}
  .house-card .row .said{font-size:11.5px;color:var(--faint);flex:1}
  .house-card .row .said.bad{color:var(--warn)}
  .house-card .row button{font:12px inherit;color:var(--ink);
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:3px 11px;cursor:pointer}
  .house-card .row button.primary{background:var(--accent);color:#0b1017;
    border-color:transparent;font-weight:600}
  .house-card .row .drop{margin-left:auto;color:var(--faint)}
  .house-card .row .drop:hover{color:#ff8a72;border-color:#5b2a22}
  .houses-new{display:flex;gap:8px;align-items:center;margin-top:10px}
  .houses-new input{background:var(--bg);border:1px solid var(--line);
    border-radius:7px;color:var(--ink);padding:6px 10px;font-size:13px}
  .houses-new button{font:13px inherit;color:#0b1017;background:var(--accent);
    border:none;border-radius:8px;padding:6px 13px;cursor:pointer;
    font-weight:600}

  .keys{margin-top:12px;font:11.5px var(--mono);color:var(--faint);
    line-height:1.9}
  .keys b{color:#7fd4ff;font-weight:600}
  .keys span{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <h1>怎麼寫的規定</h1>
  <p class="under">送給模型的前半段。<b>大括號裡的名字不是文字，是空格</b> ——
    送出前由片型和 <code>rules.json</code> 填進去。改這裡改的是話怎麼講，
    改數字要去片型。</p>

  <div class="tabs" id="tabs"></div>

  <div class="bar">
    <span class="n" id="size"></span>
    <span class="gap"></span>
    <span class="said" id="said"></span>
    <button class="reset" id="reset">換回出廠版本</button>
    <button class="primary" id="save">存起來</button>
  </div>

  <div class="both">
    <div class="side">
      <h3>原文　—— 這裡改</h3>
      <textarea id="text" spellcheck="false"></textarea>
    </div>
    <div class="side">
      <h3>填好之後　—— 模型收到的樣子</h3>
      <pre class="view" id="view"></pre>
    </div>
  </div>

  <div class="keys" id="keys"></div>

  <h2>片型　—— 上面那些空格的值從這裡來</h2>
  <p class="under">一個片型說的是「這種片子長什麼形狀」：角色、轉要多前、
    借來的畫面上限、以及<b>送哪一份 md</b>。沒寫的項目會掉回
    <code>rules.json</code> 的共用值。</p>
  <div id="housesList"></div>
  <div class="houses-new">
    <input id="newHouseKey" placeholder="代號（英文，如 explain）" size="18">
    <input id="newHouseName" placeholder="名稱（如 拆解說明）" size="14">
    <button id="btnNewHouse" class="tiny primary">新增片型</button>
  </div>
</div>

<script src="/static/nav.js"></script>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);

let FILES = [];
let WHICH = "";

function here() { return FILES.find((one) => one.name === WHICH) || {}; }

/* 照使用時機分組。這幾份不是同一次呼叫 —— 一份 request 只用得到其中
   一到兩份，而排成一排會讓人以為它們是一份東西的六個章節。 */
const ORDER = ["寫文案", "收集素材", "文案寫完之後", "還沒有人用", "其他"];

function drawTabs() {
  const groups = new Map();
  FILES.forEach((one) => {
    const key = one.group || "其他";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(one);
  });
  $("tabs").innerHTML = ORDER.filter((key) => groups.has(key)).map((key) => `
    <div class="group${key === "還沒有人用" ? " dead" : ""}">
      <h4>${esc(key)}</h4>
      <div class="row">${groups.get(key).map((one) =>
        `<button data-name="${esc(one.name)}"${
          one.name === WHICH ? ' class="on"' : ""}>${esc(one.name)}${
          one.changed ? '<span class="dot">●</span>' : ""}</button>`).join("")}</div>
    </div>`).join("");
}

/* 填好的樣子，被填進去的值標色。
   一個一個換而不是整段丟給 replace：要標色就要知道**哪一段是填進去的**，
   而換完之後那件事就看不出來了。 */
function drawView() {
  const one = here();
  const filled = one.filled || {};
  let out = "";
  let rest = one.text || "";
  const pattern = /\{[^{}\s:]+(?::[a-z]+)?\}/g;
  let at = 0, found;
  while ((found = pattern.exec(rest)) !== null) {
    out += esc(rest.slice(at, found.index));
    const key = found[0];
    const value = filled[key];
    const bad = (one.unknown || []).some((x) => key.startsWith("{" + x));
    out += bad
      ? `<b class="bad">${esc(key)}　← 填不出來</b>`
      : `<b class="put" title="${esc(key)}">${esc(value ?? key)}</b>`;
    at = found.index + key.length;
  }
  out += esc(rest.slice(at));
  $("view").innerHTML = out;

  const keys = Object.entries(filled);
  $("keys").innerHTML = keys.length
    ? "這一份用到的空格：　" + keys.map(([key, value]) =>
        `<b>${esc(key)}</b><span> → ${esc(value)}</span>`).join("　·　")
    : "這一份沒有用到任何空格。";
}

function drawAll() {
  const one = here();
  $("text").value = one.text || "";
  $("size").innerHTML = `${(one.text || "").length} 字　片型 ${esc(one.house || "")}`
    + (one.changed ? "　·　改過（跟出廠版本不同）" : "　·　跟出廠版本相同")
    + (one.why ? `<br><span class="why">${esc(one.why)}${
        one.who ? `　　${esc(one.who)}` : ""}</span>` : "");
  $("reset").disabled = !one.changed;
  drawTabs();
  drawView();
}

$("tabs").addEventListener("click", (event) => {
  const tab = event.target.closest("button[data-name]");
  if (!tab) return;
  WHICH = tab.dataset.name;
  $("said").textContent = "";
  drawAll();
});

/* 邊打邊看。填好的那一邊要立刻跟上，否則「填進去之後還通順嗎」
   還是要靠想像。 */
$("text").addEventListener("input", () => {
  here().text = $("text").value;
  $("size").textContent = `${$("text").value.length} 字　還沒存`;
  drawView();
});

$("save").onclick = async () => {
  const one = here();
  $("save").disabled = true;
  try {
    const back = await fetch("/api/prompt-file", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: one.name, text: $("text").value}),
    });
    const got = await back.json();
    if (!back.ok) throw new Error(got.detail || "存不起來");
    $("said").className = "said ok";
    $("said").textContent = `存好了，${got.chars} 字`;
    await load(one.name);
  } catch (error) {
    $("said").className = "said bad";
    $("said").textContent = error.message;
  }
  $("save").disabled = false;
};

$("reset").onclick = async () => {
  const one = here();
  try {
    const back = await fetch("/api/prompt-file/reset", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: one.name}),
    });
    const got = await back.json();
    if (!back.ok) throw new Error(got.detail || "換不回去");
    $("said").className = "said ok";
    $("said").textContent = "換回出廠版本了";
    await load(one.name);
  } catch (error) {
    $("said").className = "said bad";
    $("said").textContent = error.message;
  }
};

async function load(keep) {
  const back = await fetch("/api/prompt-files");
  if (!back.ok) throw new Error(await back.text());
  const d = await back.json();
  FILES = d.files || [];
  WHICH = keep || WHICH
    || (FILES.find((one) => one.name === "script.md") || FILES[0] || {}).name;
  drawAll();
}

/* ---------------------------------------------------------------- 片型
 * 從素材頁搬過來的。它跟上面那幾份 md 是同一件事的兩半：md 說話怎麼講，
 * 片型說那些話裡的數字是多少 —— 而它們原本在兩個相隔很遠的畫面上，
 * 中間沒有任何東西說明它們有關係。
 */
let HOUSES = [];

function drawHouses() {
  $("housesList").innerHTML = HOUSES.map((one) => {
    const {key, ...spec} = one;
    return `
    <div class="house-card" data-key="${esc(key)}">
      <div class="head">
        <b>${esc(spec.name || key)}</b>
        <code>${esc(key)}</code>
        <span class="used">送 ${esc(spec.prompt || "script.md")}</span>
      </div>
      <textarea spellcheck="false">${esc(JSON.stringify(spec, null, 1))}</textarea>
      <div class="row">
        <button class="primary save">存</button>
        <span class="said"></span>
        <button class="drop">刪掉</button>
      </div>
    </div>`;
  }).join("") || '<p class="under">一個片型都沒有。</p>';
}

async function houseSave(card) {
  const said = card.querySelector(".said");
  let spec;
  try {
    spec = JSON.parse(card.querySelector("textarea").value);
  } catch (error) {
    // JSON 壞掉是最可能發生的事，錯誤要指得回哪裡壞。
    said.className = "said bad";
    said.textContent = "JSON 有問題：" + error.message;
    return;
  }
  try {
    const back = await fetch("/api/format", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: card.dataset.key, spec}),
    });
    const got = await back.json();
    if (!back.ok) throw new Error(got.detail || "存不起來");
    HOUSES = got.formats || HOUSES;
    said.className = "said";
    said.textContent = "存好了";
    // 片型的數字會填進上面那幾份 md，所以存完要重讀 —— 不然右邊那半
    // 還顯示著舊的值。
    await load(WHICH);
    setTimeout(() => { said.textContent = ""; }, 1600);
  } catch (error) {
    said.className = "said bad";
    said.textContent = error.message;
  }
}

async function houseDrop(card) {
  const key = card.dataset.key;
  const said = card.querySelector(".said");
  try {
    const back = await fetch("/api/format?key=" + encodeURIComponent(key),
                             {method: "DELETE"});
    const got = await back.json();
    if (!back.ok) throw new Error(got.detail || "刪不掉");
    HOUSES = HOUSES.filter((one) => one.key !== key);
    drawHouses();
  } catch (error) {
    said.className = "said bad";
    said.textContent = error.message;
  }
}

$("housesList").addEventListener("click", (event) => {
  const card = event.target.closest(".house-card");
  if (!card) return;
  if (event.target.classList.contains("save")) houseSave(card);
  if (event.target.classList.contains("drop")) houseDrop(card);
});

$("btnNewHouse").onclick = async () => {
  const key = $("newHouseKey").value.trim();
  const name = $("newHouseName").value.trim();
  if (!key || !name) return;
  /* 從預設那一份複製，不是空白開始 —— 一個只有名字的片型每一項都掉回
     rules.json，那不是一種形狀。 */
  const base = HOUSES.find((one) => one.key === "argue") || {};
  const {key: _drop, ...spec} = base;
  try {
    const back = await fetch("/api/format", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key, spec: {...spec, name, why: ""}}),
    });
    const got = await back.json();
    if (!back.ok) throw new Error(got.detail || "建不起來");
    HOUSES = got.formats || HOUSES;
    $("newHouseKey").value = "";
    $("newHouseName").value = "";
    drawHouses();
  } catch (error) {
    $("said").className = "said bad";
    $("said").textContent = error.message;
  }
};

async function loadHouses() {
  const back = await fetch("/api/formats");
  if (!back.ok) return;
  HOUSES = (await back.json()).formats || [];
  drawHouses();
}

load().then(loadHouses).catch((error) => {
  $("view").textContent = "讀不到：" + error.message;
});
</script>
</body>
</html>
