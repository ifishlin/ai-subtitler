<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影片段落　AI-Reporters</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  .pickrow{display:flex;gap:8px;align-items:center;margin:0 0 22px}
  .pickrow select{font:14px inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    cursor:pointer;max-width:100%}

  .tally{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
  .tally div{background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 15px;font-size:13px;color:var(--dim)}
  .tally b{color:var(--ink);font-size:17px;margin-right:5px}

  /* 播放器只有一個，跟著被按的那一段走。
     四十段各給一個 <video> 的話，四十條連線會塞爆瀏覽器對單一主機的六條
     上限 —— /scripts 那一頁就是這樣永遠載不完的。 */
  .stage{position:sticky;top:8px;z-index:5;background:var(--bg);
    padding:8px 0 14px;margin:0 0 8px}
  .stage video{width:100%;max-height:40vh;background:#000;border-radius:10px;
    border:1px solid var(--line)}
  .stage p{margin:8px 0 0;color:var(--faint);font-size:12.5px}
  /* 逐字稿跟著播放器走。它本來只留在底下那張卡上，而播放器貼在頂端 ——
     一按下去，正在播的那一段的字就被自己的播放器蓋住了。要看的東西被
     用來看它的東西擋住，是這一頁最不該有的錯。 */
  .stage .said{margin:6px 0 0;color:var(--ink);font-size:14px;line-height:1.6}
  .stage.off{display:none}

  /* 調切點。用看的比用聽的快 —— 切點落在聲音上還是縫裡，波形一眼看得出來。 */
  .tune{margin-top:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px}
  .tune canvas{width:100%;height:72px;display:block;border-radius:6px;
    background:#0d1014;border:1px solid var(--line)}
  .tune .knobs{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    margin-top:9px;font-size:12px;color:var(--faint)}
  .tune .grp{display:flex;gap:4px;align-items:center}
  .tune .grp b{color:var(--ink);font-weight:600;margin-right:2px}
  .tune button{font:12px var(--mono);color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer}
  .tune button:hover{border-color:var(--ok)}
  .tune button.go{border-color:#2c5a45;color:var(--ok)}
  .tune button.go:disabled{opacity:.4;cursor:default;border-color:var(--line);
    color:var(--faint)}
  .tune .now{font:12px var(--mono);color:var(--ink);margin-left:auto}

  .film{margin:26px 0 10px;color:var(--faint);font-size:13px;
    border-bottom:1px solid var(--line);padding-bottom:6px}
  .film b{color:var(--ink);font-size:14.5px}

  .cut{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 16px;margin:0 0 10px;
    display:grid;grid-template-columns:168px 1fr;gap:14px}
  /* 縮圖點下去就播。清單是拿來找的，四十段逐一按下去播要好幾分鐘，
     掃一遍縮圖只要幾秒。 */
  .cut .shot{width:168px;border-radius:8px;border:1px solid var(--line);
    display:block;cursor:pointer;background:#000;aspect-ratio:16/9;
    object-fit:cover}
  .cut .shot:hover{border-color:var(--ok)}
  .cut .body{min-width:0}
  .cut .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .cut .no{font:13px var(--mono);color:var(--ok);font-weight:600}
  .cut .when{font:12px var(--mono);color:var(--faint)}
  .cut .said{margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.6}
  .cut .why{margin:9px 0 0;font-size:12px;color:var(--faint)}
  .cut .key{display:inline-block;font:11.5px var(--mono);margin:0 5px 0 0;
    padding:2px 8px;border-radius:10px;border:1px solid #2c5a45;color:var(--ok)}
  .cut .key.dim{border-color:var(--line);color:var(--faint)}
  /* 切點是查來的還是算來的。標在每一段上，因為兩種在畫面上長得一樣，
     而「切得剛好」是真的準還是估對了，只有這個標記說得出來。 */
  .cut .src{display:inline-block;font:11px var(--mono);margin-left:8px;
    padding:2px 8px;border-radius:10px;border:1px solid var(--line);
    color:var(--faint)}
  .cut .src.exact{border-color:#2c4a6a;color:#7ab6e0}
  /* 切點上還有人在說話。是記號不是門 —— 程式判斷得了「有沒有聲音」，
     判斷不了「這樣剪聽起來能不能接受」，所以它只負責把要聽的挑出來。 */
  .cut.doubt{border-color:#5c3a2a}
  .cut .warn{display:inline-block;font:11px var(--mono);margin-left:8px;
    padding:2px 8px;border-radius:10px;border:1px solid #5c3a2a;
    color:var(--warn)}
  /* 還沒剪出檔案的，縮圖那一格放一塊佔位 —— 沒有按鈕之後，它是唯一
     說得出「這一段還不能看」的東西。 */
  .cut .none{width:168px;aspect-ratio:16/9;border-radius:8px;
    border:1px dashed var(--line);color:var(--faint);font-size:12px;
    display:flex;align-items:center;justify-content:center}

  .callout{background:var(--panel);border:1px solid var(--line);
    border-left:4px solid var(--warn);border-radius:12px;
    padding:15px 18px;margin:0 0 24px}
  .callout b{display:block;font-size:16px;margin-bottom:6px}
  .callout p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <h1>影片段落</h1>
  <p class="under">送進 prompt 的就是這一份 —— 文案裡寫 <code>C7</code>，指的是底下第 7 段。</p>

  <div class="pickrow"><select id="pick"></select></div>
  <div id="callout"></div>
  <div class="tally" id="tally"></div>

  <div class="stage off" id="stage">
    <video id="player" controls preload="metadata"></video>
    <p id="now"></p>
    <p class="said" id="saidnow"></p>
    <div class="tune" id="tune" hidden>
      <canvas id="wave" width="1200" height="144"></canvas>
      <div class="knobs">
        <span class="grp"><b>頭</b>
          <button data-move="start,-0.25">−0.25</button>
          <button data-move="start,-0.05">−0.05</button>
          <button data-move="start,0.05">+0.05</button>
          <button data-move="start,0.25">+0.25</button></span>
        <span class="grp"><b>尾</b>
          <button data-move="end,-0.25">−0.25</button>
          <button data-move="end,-0.05">−0.05</button>
          <button data-move="end,0.05">+0.05</button>
          <button data-move="end,0.25">+0.25</button></span>
        <span class="grp">
          <button id="btnReset">還原</button>
          <button id="btnKeep" class="go">確定，重剪這一段</button></span>
        <span class="now" id="tuneNow"></span>
      </div>
    </div>
  </div>

  <div id="list"></div>
</div>

<script src="/static/nav.js"></script>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (id) => document.getElementById(id);
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

/* 正在調的那一段。null 表示沒有人在調。 */
let TUNING = null;
/* 最近一次畫波形用的曲線。播放時每一格都要重畫，重抓一次就變成每秒
   五十個請求。 */
let CURVE = null;

/* 波形。切點畫兩條線疊上去 —— 調的時候要的是「這一刀落在聲音上還是縫裡」，
   那是用看的，不是用聽的。 */
function drawWave(box, cut, head) {
  CURVE = box;
  const c = $("wave"), pen = c.getContext("2d");
  pen.clearRect(0, 0, c.width, c.height);
  const at = (t) => (t - box.from) / (box.step * box.levels.length) * c.width;
  pen.fillStyle = "#0d1014"; pen.fillRect(0, 0, c.width, c.height);
  const wide = Math.max(1, c.width / box.levels.length);
  box.levels.forEach((db, i) => {
    /* 底 −55 dB、頂 −12 dB。整支片的人聲落在 −15 到 −30 之間，用 −60..0
       去攤的話每一根都是七成高，畫出來是一塊實心的磚 —— 而要看的正是那些
       比別人矮的縫。範圍縮到實際用得到的那一段，停頓才看得見。 */
    const tall = Math.max(1, Math.min(1, Math.max(0, db + 55) / 43) * c.height);
    const x = i / box.levels.length * c.width;
    const inside = box.from + i * box.step >= cut.start
                && box.from + i * box.step <= cut.end;
    /* 段落之外用暗的。剪進去的是哪一段，用顏色分比用底色分清楚。 */
    pen.fillStyle = inside ? "#5aa9e6" : "#2b3947";
    pen.fillRect(x, (c.height - tall) / 2, wide, tall);
  });
  [["start", "#4ade80"], ["end", "#f59e0b"]].forEach(([key, colour]) => {
    pen.strokeStyle = colour; pen.lineWidth = 2;
    pen.beginPath(); pen.moveTo(at(cut[key]), 0);
    pen.lineTo(at(cut[key]), c.height); pen.stroke();
  });
  /* 播到哪裡了。一條白線跟著走 —— 沒有它，波形上的谷和耳朵聽到的停頓
     要自己在腦裡對齊。 */
  if (head != null) {
    /* 兩像素，而且對齊到整數座標 —— 一像素的線落在半格上會被反鋸齒攤成
       兩條半透明的，畫面上是一抹灰而不是一條線。 */
    pen.fillStyle = "#fff";
    pen.fillRect(Math.round(at(head)) - 1, 0, 2, c.height);
  }
}

async function retune() {
  /* 出錯要寫在畫面上。這一支是 async，而它是從 onclick 裡被 await 的 ——
     丟出去的例外沒有人接，於是「按了按鈕，數字變了，聲音沒換」看起來完全
     像正常運作。找那個錯花了半小時，而它從頭到尾沒有留下任何痕跡。 */
  try {
    await tuneOnce();
  } catch (error) {
    $("tuneNow").textContent = "試聽失敗：" + (error && error.message);
  }
}

async function tuneOnce() {
  const cut = TUNING;
  $("tuneNow").textContent = `${cut.start.toFixed(2)} – ${cut.end.toFixed(2)}　${
    (cut.end - cut.start).toFixed(2)} 秒`
    + (cut.start === cut.origin.start && cut.end === cut.origin.end ? "" : "　已調整");
  const box = await fetch(`/api/passage/wave?name=${encodeURIComponent(cut.topic)
    }&index=${cut.index}&start=${cut.start}&end=${cut.end}`).then((r) => r.json());
  drawWave(box, cut);
  /* 只切音軌 —— 零點幾秒，重剪整段要兩三秒，而那個差別會決定人願不願意
     一直微調。沒有按「確定」之前，正式的檔案一格都沒有變。 */
  const got = await fetch("/api/passage/hear", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: cut.topic, index: cut.index,
                          start: cut.start, end: cut.end})}).then((r) => r.json());
  const player = $("player");
  player.setAttribute("src", got.url);
  player.play().catch(() => {});
}

/* 播一段。播的是**剪出來的那個檔案**，不是叫瀏覽器跳到原片的那一秒 ——
   跳過去看到的是「我以為我切在這裡」。 */
function play(row, topic, index) {
  if (!row.clip) return;
  const video = $("player");
  $("stage").classList.remove("off");
  TUNING = {topic, index, row, start: row.start, end: row.end,
            origin: row.origin || {start: row.start, end: row.end}};
  $("tune").hidden = false;
  $("tuneNow").textContent = `${row.start.toFixed(2)} – ${row.end.toFixed(2)}　${
    row.seconds} 秒`;
  fetch(`/api/passage/wave?name=${encodeURIComponent(topic)}&index=${index
    }&start=${row.start}&end=${row.end}`).then((r) => r.json())
    .then((box) => drawWave(box, TUNING)).catch(() => {});
  video.setAttribute("src", `/media/passage/${encodeURIComponent(topic)}/${
    encodeURIComponent(row.clip.split("/").pop())}`);
  $("now").textContent = `C${index}　${row.outlet}　原片的 ${row.start}s – ${
    row.end}s（${row.seconds} 秒）　${
    row.exact ? "切點查真值" : "切點用估的，誤差中位 0.13 秒"}`;
  $("saidnow").textContent = row.said;
  $("now").textContent += row.doubt ? "　⚠ 切點上還有人在說話" : "";
  video.play().catch(() => {});      /* 使用者還沒互動過就會被擋，不是錯 */
  $("stage").scrollIntoView({block: "nearest"});
}

function cut(row, index, topic) {
  /* 命中的關鍵詞排前面（那是它被選上的原因），整段涵蓋到的排後面。
     排序看的是命中「幾個」不是哪一個，所以那個數字也要寫出來。 */
  const hit = new Set(row.matched || []);
  const keys = (row.hits || []).map((one) =>
    `<span class="key${hit.has(one) ? "" : " dim"}">${esc(one)}</span>`).join("");
  /* 縮圖就是播放鍵。多一顆「播這一段」是同一件事的第二個入口，而點圖
     本來就是所有人的第一直覺。 */
  const shot = row.thumb
    ? `<img class="shot" loading="lazy" data-cut="${index - 1}"
         alt="C${index} 的畫面" src="/media/passage/${encodeURIComponent(topic)}/${
           encodeURIComponent(row.thumb.split("/").pop())}">`
    : '<div class="none">還沒剪</div>';
  return `
  <div class="cut${row.doubt ? " doubt" : ""}" id="C${index}">
    ${shot}
    <div class="body">
      <div class="top">
        <span class="no">C${index}</span>
        <span class="when">${clock(row.start)} → ${clock(row.end)}　${
          row.seconds} 秒</span>
        <span class="src${row.exact ? " exact" : ""}">${
          row.exact ? "切點查真值" : "切點用估的"}</span>
        ${row.doubt ? `<span class="warn">切點上還有人在說話　頭 ${
          (row.edge || [])[0]} / 尾 ${(row.edge || [])[1]} dB</span>` : ""}
      </div>
      <p class="said">${esc(row.said)}</p>
      <p class="why">因為命中 ${hit.size} 個關鍵詞被選上　${keys}</p>
    </div>
  </div>`;
}

async function load() {
  const wanted = pickedName();
  const back = await fetch("/api/passages"
    + (wanted ? "?name=" + encodeURIComponent(wanted) : ""));
  if (!back.ok) throw new Error(await back.text());
  const d = await back.json();
  const rows = d.passages || [];

  $("pick").innerHTML = (d.topics || []).map((one) =>
    `<option value="${esc(one)}"${one === d.topic ? " selected" : ""}>${
      esc(one)}</option>`).join("");
  $("pick").onchange = () => {
    /* 記住就好，不寫網址 —— 中文題目編碼成一串百分號很醜。 */
    pickName($("pick").value);
    location.href = location.pathname;
  };

  const seconds = rows.reduce((n, one) => n + one.seconds, 0);
  $("tally").innerHTML = [
    [`<b>${rows.length}</b>段`, ""],
    [`<b>${d.videos || 0}</b>支影片有字幕`, ""],
    [`<b>${rows.length ? (seconds / rows.length).toFixed(1) : 0}</b>秒`, "平均長度"],
    [`<b>${d.least}–${d.most}</b>秒`, "上下限"],
    [`<b>${d.carved || 0}</b>段`, "已經剪出檔案"],
    [`<b>${rows.filter((one) => one.exact).length}</b>段`, "切點查真值"],
    [`<b>${rows.filter((one) => !one.exact).length}</b>段`, "切點用估的"],
    [`<b>${rows.filter((one) => one.doubt).length}</b>段`, "可疑，要聽"],
  ].map(([head, tail]) => `<div>${head}${tail ? " " + esc(tail) : ""}</div>`).join("");

  /* 讀了 N 支影片、一段都切不出來，跟「這個題目沒有影片」在畫面上一模一樣。
     這裡把它說出來 —— 而且是說哪幾家，不是只說一個數字。 */
  const silent = d.silent || [];
  $("callout").innerHTML = !rows.length
    ? `<div class="callout"><b>一段都沒有</b><p>讀了 ${d.videos || 0}
         支有字幕的影片，切不出任何段落。文案會寫成一支完全沒有動態畫面的片，
         而每一道門都會過。</p></div>`
    : (silent.length
      ? `<div class="callout"><b>${esc(silent.join("、"))} 切不出東西</b>
         <p>有字幕，但沒有一段落在長度範圍內（${d.least}–${d.most} 秒）。
            多半是那份字幕整段沒有句號 —— 硬切就會切回半句。</p></div>`
      : "");

  draw(rows, d);
  wire(rows, d);

  /* 從文案頁點「調切點」跳過來的時候，網址帶著 #C11 這種錨點。捲過去，
     而且直接打開那一段 —— 不然使用者還要自己從四十段裡再找一次。 */
  const wantCut = location.hash.replace(/^#/, "");
  const match = /^C(\d+)$/.exec(wantCut);
  if (match) {
    const index = Number(match[1]);
    const el = document.getElementById(wantCut);
    if (el && rows[index - 1]) {
      el.scrollIntoView({block: "center"});
      play(rows[index - 1], d.topic, index);
    }
  }
}

/* 清單畫成一片。抽出來是因為重剪一段之後要重畫，而重畫不該重新載入整頁 ——
   那會把正在調的那一段的狀態丟掉。 */
function draw(rows, d) {
  const by = [];
  rows.forEach((one, index) => {
    const last = by[by.length - 1];
    if (!last || last.file !== one.file) {
      by.push({file: one.file, outlet: one.outlet, title: one.title, rows: []});
    }
    by[by.length - 1].rows.push({one, index: index + 1});
  });

  $("list").innerHTML = by.map((film) => `
    <div class="film"><b>${esc(film.outlet)}</b>　${esc(film.title || "")}</div>
    ${film.rows.map(({one, index}) => cut(one, index, d.topic)).join("")}`).join("")
    || "";
}

function wire(rows, d) {
  $("list").onclick = (event) => {
    const which = event.target.getAttribute("data-cut");
    if (which !== null) play(rows[Number(which)], d.topic, Number(which) + 1);
  };

  /* 播放的時候波形跟著動。播的是剪出來的那一段，所以 currentTime 的零點
     就是這一刀的起點。

     跟著螢幕更新畫，不是跟著 `timeupdate` —— 那個事件一秒只發四次，畫出來
     的播放頭是一格一格跳的，看起來像卡住而不是在走。 */
  let running = 0;
  const follow = () => {
    const player = $("player");
    if (TUNING && CURVE) drawWave(CURVE, TUNING, TUNING.start + player.currentTime);
    running = player.paused || player.ended ? 0 : requestAnimationFrame(follow);
  };
  $("player").onplay = () => { if (!running) running = requestAnimationFrame(follow); };
  /* 停下來也要再畫一次，不然最後一格停在上一次的位置。 */
  $("player").onpause = $("player").onseeked = $("player").ontimeupdate = () => {
    if (!running) follow();
  };

  $("tune").onclick = async (event) => {
    const move = event.target.getAttribute("data-move");
    if (!TUNING) return;
    if (move) {
      const [which, step] = move.split(",");
      const next = {...TUNING, [which]: Math.max(0,
        Number((TUNING[which] + Number(step)).toFixed(2)))};
      /* 頭尾不能交叉，而且一秒以下剪不出東西。 */
      if (next.end - next.start < 1) return;
      TUNING = next;
      await retune();
      return;
    }
    if (event.target.id === "btnReset") {
      TUNING = {...TUNING, start: TUNING.origin.start, end: TUNING.origin.end};
      await retune();
      return;
    }
    if (event.target.id !== "btnKeep") return;
    /* 確定才落地：寫回起訖、重剪這一段的 mp4 和縮圖。 */
    const button = event.target;
    button.disabled = true;
    button.textContent = "重剪中…";
    try {
      const got = await fetch("/api/passage/retime", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: TUNING.topic, index: TUNING.index,
                              start: TUNING.start, end: TUNING.end})})
        .then((r) => r.ok ? r.json() : r.text().then((why) => {throw new Error(why);}));
      Object.assign(rows[TUNING.index - 1], got);
      draw(rows, d);
      play(rows[TUNING.index - 1], d.topic, TUNING.index);
    } catch (error) {
      $("tuneNow").textContent = "重剪失敗：" + error.message;
    } finally {
      button.disabled = false;
      button.textContent = "確定，重剪這一段";
    }
  };
}

load().catch((error) => {
  $("callout").innerHTML = '<div class="callout"><b>讀不到</b><p>'
    + esc(error.message) + "</p></div>";
});
</script>
</body>
</html>
