<style>
  :root {
    --paper:  #091e30;   /* 卡片底色 */
    --edge:   #40bee6;   /* 外框、重點 */
    --title:  #ffeea5;   /* 標題 */
    --ink:    #ffffff;   /* 內文 */
    --muted:  #9fc4d8;   /* 次要文字 */
    --warn:   #ff9d5c;   /* 強調、負面 */
    --ok:     #7fd4a8;   /* 正面 */
    --radius: 34px;      /* 圓角 */
  }
  html, body { margin: 0; background: transparent; }
  #card {
    width: 560px; box-sizing: border-box; padding: 34px 38px 38px;
    border-radius: var(--radius); background: color-mix(in srgb, var(--paper) 92%, transparent); border: 4px solid var(--edge);
    font-family: &quot;PingFang TC&quot;, &quot;Heiti TC&quot;, sans-serif; color: var(--ink); text-align: center;
  }
  .badge { display: inline-block; background: color-mix(in srgb, var(--edge) 70%, #000); border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  .figure { margin: 26px 0 4px; font-size: 108px; line-height: 1;
            font-weight: 700; color: var(--title); font-variant-numeric: tabular-nums; }
  .figure .unit { font-size: 44px; font-weight: 500; margin-left: 8px; }
  .what { font-size: 30px; line-height: 1.4; }
  .note { margin-top: 16px; font-size: 20px; color: var(--muted); }

  /* The panel arrives first and its contents fill it in. Without this the
     first frame is an empty box, which reads as a mistake rather than a start. */
  #card {
    animation: cardIn .28s both cubic-bezier(.2,.7,.3,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.97) }
    to   { opacity: 1; transform: none }
  }
  #card > * {
    animation: cardRise var(--rise, .45s) both cubic-bezier(.2,.7,.3,1);
    animation-delay: calc(var(--step, .1s) * var(--row, 0));
  }
  #card > *:nth-child(1)  { --row: 0 }
  #card > *:nth-child(2)  { --row: 1 }
  #card > *:nth-child(3)  { --row: 2 }
  #card > *:nth-child(4)  { --row: 3 }

  #card > *:nth-child(6)  { --row: 5 }
  #card > *:nth-child(7)  { --row: 6 }
  #card > *:nth-child(8)  { --row: 7 }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(16px) }
    to   { opacity: 1; transform: none }
  }

  #card {
    animation-play-state: paused !important;
    animation-delay: calc(-1 * var(--at) * 1s) !important;
  }
  #card > * {
    animation-play-state: paused !important;
    animation-delay: calc(var(--step, .1s) * var(--row, 0) - var(--at) * 1s)
                     !important;
  }
  :root { --at: 0.0000 }
</style>

    font-family: &quot;PingFang TC&quot;, &quot;Heiti TC&quot;, sans-serif; color: var(--ink); text-align: center;
  }
  .badge { display: inline-block; background: color-mix(in srgb, var(--edge) 70%, #000); border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  .figure { margin: 26px 0 4px; font-size: 108px; line-height: 1;
            font-weight: 700; color: var(--title); font-variant-numeric: tabular-nums; }
  .figure .unit { font-size: 44px; font-weight: 500; margin-left: 8px; }
  .what { font-size: 30px; line-height: 1.4; }
  .note { margin-top: 16px; font-size: 20px; color: var(--muted); }

  /* The panel arrives first and its contents fill it in. Without this the
     first frame is an empty box, which reads as a mistake rather than a start. */
  #card {
    animation: cardIn .28s both cubic-bezier(.2,.7,.3,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.97) }
    to   { opacity: 1; transform: none }
  }
  #card > * {
    animation: cardRise var(--rise, .45s) both cubic-bezier(.2,.7,.3,1);
    animation-delay: calc(var(--step, .1s) * var(--row, 0));
  }
  #card > *:nth-child(1)  { --row: 0 }
  #card > *:nth-child(2)  { --row: 1 }
  #card > *:nth-child(3)  { --row: 2 }
  #card > *:nth-child(4)  { --row: 3 }
  #card > *:nth-child(5)  { --row: 4 }
  #card > *:nth-child(6)  { --row: 5 }
  #card > *:nth-child(7)  { --row: 6 }
  #card > *:nth-child(8)  { --row: 7 }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(16px) }
    to   { opacity: 1; transform: none }
  }

  #card {
    animation-play-state: paused !important;
    animation-delay: calc(-1 * var(--at) * 1s) !important;
  }
  #card > * {
    animation-play-state: paused !important;
    animation-delay: calc(var(--step, .1s) * var(--row, 0) - var(--at) * 1s)
                     !important;
  }
  :root { --at: 0.8667 }
</style>
