<meta charset="utf-8">
<style>
  :root {
    --paper:  #091e30;   /* 卡片底色 */
    --edge:   #40bee6;   /* 外框、重點 */
    --title:  #ffeea5;   /* 標題 */
    --ink:    #ffffff;   /* 內文 */
    --muted:  #9fc4d8;   /* 次要文字 */
    --warn:   #ff9d5c;   /* 強調、負面 */
    --ok:     #7fd4a8;   /* 正面 */
    --radius: 34px;      /* 圓角 */
  }
  html, body { margin: 0; background: transparent; }
  #card {
    width: 620px; box-sizing: border-box; padding: 30px 34px 34px;
    border-radius: var(--radius); background: color-mix(in srgb, var(--paper) 92%, transparent); border: 4px solid var(--edge);
    font-family: "PingFang TC", "Heiti TC", sans-serif; color: var(--ink);
  }
  .badge { display: inline-block; background: color-mix(in srgb, var(--edge) 70%, #000); border-radius: 18px;
           padding: 7px 18px; font-size: 22px; letter-spacing: .06em; }
  h1 { margin: 22px 0 18px; font-size: 46px; font-weight: 600; color: var(--title); }
  ul { margin: 0; padding: 0; list-style: none; }
  li { font-size: 30px; line-height: 1.55; padding-left: 26px; position: relative; }
  li::before { content: "・"; position: absolute; left: 0; color: var(--edge); }
</style>

<div id="card">
  <span class="badge">新聞重點</span>
  <h1>標題寫在這裡</h1>
  <ul>
    <li>第一個要點</li>
    <li>第二個要點</li>
  </ul>
</div>
