<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #card {
    width: 640px; box-sizing: border-box; padding: 34px 38px;
    border-radius: 34px; background: rgba(9, 30, 48, .92);
    border-left: 10px solid #ffeea5;
    font-family: "PingFang TC", "Heiti TC", sans-serif; color: #fff;
  }
  .mark { font-size: 64px; line-height: .6; color: #ffeea5; }
  blockquote { margin: 6px 0 22px; font-size: 34px; line-height: 1.5; }
  blockquote .close { font-size: 44px; color: #ffeea5; vertical-align: -8px;
                      margin-left: 2px; }
  .who { font-size: 22px; color: #9fc4d8; }
  .who b { color: #fff; font-weight: 600; font-size: 25px; }
</style>

<div id="card">
  <div class="mark">「</div>
  <blockquote>把要引用的話dddddd放在這裡，<br>兩行以內最好讀。<span class="close">」</span></blockquote>
  <div class="who"><b>說話的人</b>　職稱或場合</div>
</div>
